<!doctype html><html><head><meta charset="utf-8"><title>Scorcher redesign 2</title>
<style>
@font-face{font-family:EB;font-weight:400;src:url(../fonts/eb-garamond-latin-400-normal.woff2)}
@font-face{font-family:EB;font-weight:400;font-style:italic;src:url(../fonts/eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:EB;font-weight:500;src:url(../fonts/eb-garamond-latin-500-normal.woff2)}
@font-face{font-family:IS;font-weight:400;src:url(../fonts/instrument-sans-latin-400-normal.woff2)}
@font-face{font-family:IS;font-weight:600 700;src:url(../fonts/instrument-sans-latin-600-normal.woff2)}
:root{--bg:#f5f0e7;--card:#fffdf8;--ink:#17140f;--ink2:#4a443a;--mute:#8d8576;--line:#e9e1d1;--acc:#e5482a;--acc2:#fde9e2;--ok:#2f7d46;--r:20px}
.dk{--bg:#0d0b16;--card:#161326;--ink:#f1eefb;--ink2:#c3bcdc;--mute:#7f7899;--line:#262140;--acc:#ff7a4d;--acc2:#2a1a22;--ok:#5fd68a}
*{box-sizing:border-box;margin:0}body{background:#7d7a74;font-family:IS,system-ui,sans-serif;padding:28px;color:#fff}
h2.t{font:700 12px IS;letter-spacing:.2em;text-transform:uppercase;margin:34px 0 14px;color:#fff}
.rowx{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.ph{width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);box-shadow:0 30px 60px -20px #0008}
.scr{position:absolute;inset:0 0 84px 0;overflow:hidden;padding:54px 18px 0}
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;font:600 10.5px IS;color:var(--mute);letter-spacing:.02em}.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--acc)}.tab.on i{display:block;width:22px;height:3px;border-radius:3px;background:var(--acc);margin-top:-1px}.tab i{display:block;height:3px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font:500 24px EB}.logo b{color:var(--acc);font-weight:500;font-style:italic}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:600 12.5px IS;color:var(--ink2)}
.pill svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:2}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.eye{font:700 10.5px IS;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font:700 15px IS;background:var(--ink);color:var(--bg);width:100%}.btn.acc{background:var(--acc);color:#fff}.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{height:40px;font-size:13px;border-radius:12px}
.big{font:400 40px/1.02 EB}.mid{font:400 28px/1.05 EB}
canvas{display:block}
.mt{margin-top:14px}.dt .card .big{font-size:60px}.rowx{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}.g8{display:grid;gap:8px}.g12{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--bg);font:600 12px IS;color:var(--ink2)}.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}.seg span{flex:1;text-align:center;height:34px;line-height:34px;font:700 12.5px IS;color:var(--mute);border-radius:10px}.seg span.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dock{position:absolute;left:14px;right:14px;bottom:96px;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 14px 30px -14px #0006}
.dock .d{flex:1;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px IS;color:var(--ink2);gap:2px}.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.art{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(120% 90% at 50% 20%,#17304a,#07060f 70%)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 13px IS;color:var(--ink2)}
.num{font:700 13px IS;width:22px;color:var(--mute)}
.bar2{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc);border-radius:4px}
.heat{height:8px;border-radius:5px;background:linear-gradient(90deg,#2a4f8a,#d8c8a8,#e5482a)}
.art-p{padding:16px;line-height:1.55;font:400 15.5px/1.55 EB;color:var(--ink2)}.art-p a{color:var(--acc);text-decoration:underline}
.dt{width:1180px;height:760px;border-radius:16px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);display:flex;box-shadow:0 30px 60px -20px #0008}
.rail{width:220px;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.rail .nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font:600 14px IS;color:var(--ink2)}.rail .nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rail .nv.on{background:var(--acc2);color:var(--acc)}
.main{flex:1;padding:26px 34px;overflow:hidden}

.dt{width:1280px;height:800px}.rail{width:232px;transition:none;flex:none}.rail.c{width:76px;padding:22px 12px;align-items:center}.rail.c .nv{width:48px;padding:0;justify-content:center}.rail.c .lab,.rail.c .logo span.w,.rail.c .sc{display:none}
.coll{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);margin-left:auto}.coll svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rail .hd{display:flex;align-items:center;margin-bottom:16px;padding:0 4px}.rail.c .hd{flex-direction:column;gap:12px}
.mainx{flex:1;display:flex;flex-direction:column;min-width:0}.tb{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px 20px}
.hero .rt{font:400 84px/1 EB;letter-spacing:-.01em}.hero .rt i{color:var(--acc)}.hero .to{display:flex;align-items:center;gap:18px;color:var(--mute);margin:14px 0;font:italic 24px EB;width:520px}.hero .to div{flex:1;height:1px;background:var(--line)}
.cta{display:inline-flex;align-items:center;gap:12px;height:72px;padding:0 54px;border-radius:22px;background:var(--acc);color:#fff;font:700 19px IS;box-shadow:0 18px 36px -16px var(--acc)}.cta svg{width:20px;height:20px;fill:#fff;stroke:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 32px 28px}.strip .card{padding:16px 18px}
.kv{font:400 30px/1 EB}.ex{font:500 13px/1.4 IS;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 32px 28px;flex:1;min-height:0}
.tile9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
</style></head><body>
<script src="../skyobjects.js"></script>
<div id="R"></div>
<script>
const I={play:'<path d="M7 5l12 7-12 7z"/>',sky:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',packs:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',ranks:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 20h8"/>',me:'<circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',find:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',list:'<path d="M5 7h14M5 12h10M5 17h12"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',back:'<path d="M15 5l-7 7 7 7"/>',live:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/>',studio:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const nav=a=>`<div class="bar">${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['me','Me']].map(([k,t])=>`<div class="tab ${a===k?'on':''}">${ic(k)}${t}<i></i></div>`).join('')}</div>`;
const tp=(r)=>`<div class="top"><div class="logo">Scorch<b>er</b></div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12</span>${r||''}</div></div>`;
const art=(id,h,extra='')=>`<div class="art" style="height:${h}px;${extra}"><canvas data-art="${id}" width="760" height="${Math.round(h*760/354)}" style="width:100%;height:100%"></canvas></div>`;
const route=`<div style="text-align:center"><div class="eye">Plate no. 300 · Tuesday</div><div class="big" style="margin-top:12px">Lemon</div><div style="display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--mute)"><div style="flex:1;height:1px;background:var(--line)"></div><i style="font:italic 18px EB">to</i><div style="flex:1;height:1px;background:var(--line)"></div></div><div class="big" style="color:var(--acc);font-style:italic">Global Positioning System</div></div>`;

const rail=(a,c)=>`<div class="rail ${c?'c':''}"><div class="hd"><div class="logo" style="font-size:26px">${c?'S<b>.</b>':'Scorch<b>er</b>'}</div><div class="coll" style="${c?'margin:0':''}"><svg viewBox="0 0 24 24"><path d="${c?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg></div></div>${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['live','Live'],['studio','Studio'],['me','Me']].map(([k,t])=>`<div class="nv ${a===k?'on':''}">${ic(k)}<span class="lab">${t}</span></div>`).join('')}<div style="margin-top:auto" class="sc"><div class="card" style="padding:12px 14px"><div class="eye">Streak</div><div class="mid" style="font-size:26px">12 days</div></div></div>${c?`<div style="margin-top:auto"><span class="pill" style="padding:0 9px">${ic('flame')}12</span></div>`:''}</div>`;
const tb=(t)=>`<div class="tb"><div class="eye">${t}</div><div style="display:flex;gap:8px"><span class="pill">${ic('find')}Search</span><span class="pill">${ic('flame')}12 day streak</span><span class="pill">Will</span></div></div>`;
const home=(c,dark)=>`<div class="dt ${dark?'dk':''}">${rail('play',c)}<div class="mainx">${tb('Tuesday 27 October · Plate no. 300')}
 <div class="hero"><div class="eye" style="margin-bottom:22px">Today's puzzle</div><div class="rt">Lemon</div><div class="to"><div></div>to<div></div></div><div class="rt"><i>Global Positioning System</i></div>
  <div style="display:flex;gap:8px;margin:26px 0 30px"><span class="chip">Fastest 3 clicks</span><span class="chip">Medium</span><span class="chip">Food → Technology</span></div>
  <div class="cta">Play today's puzzle ${ic('play')}</div><div class="ex" style="margin-top:14px">No account needed · new puzzle every day</div></div>
 <div class="strip"><div class="card"><div class="eye">Your streak</div><div class="kv" style="margin:6px 0">12 days</div><div class="ex">Next boost at 14 days</div></div><div class="card"><div class="eye">Today's board</div><div class="kv" style="margin:6px 0">6 players</div><div class="ex">Fastest so far: 0:31</div></div><div class="card" style="display:flex;gap:14px;align-items:center"><div class="art" style="width:60px;height:60px;border-radius:14px;flex:none"><canvas data-art="reddwarf" width="120" height="120" style="width:100%;height:100%"></canvas></div><div><div class="eye">Next goal</div><div style="font:600 13.5px/1.35 IS;margin-top:3px">1 find from completing your brown dwarfs</div></div></div></div></div></div>`;
const solved=(c)=>`<div class="dt">${rail('play',c)}<div class="mainx">${tb('Tuesday 27 October · Plate no. 300')}
 <div style="flex:1;display:grid;grid-template-columns:${c?'1.15fr 1fr':'1.05fr 1fr'};gap:28px;padding:0 32px 28px;min-height:0"><div class="card" style="overflow:hidden;background:#0b0a18;border-color:#0b0a18;color:#eceaf8;display:flex;flex-direction:column"><div style="flex:1;min-height:0" class="art"><canvas data-art="quasar" width="900" height="700" style="width:100%;height:100%"></canvas></div><div style="padding:6px 28px 24px"><div class="eye" style="color:#8d86b0">New discovery · Legendary</div><div style="font:italic 400 64px/1 EB;color:#ffa24a;margin:6px 0">TON 618</div><div style="font:600 12px IS;letter-spacing:.1em;text-transform:uppercase;color:#a9a2c8">Quasar · 66 billion Suns</div></div></div>
 <div class="g12" style="align-content:start"><div class="card" style="padding:24px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="eye">Today's puzzle</div><div style="font:400 34px/1.1 EB;margin-top:6px">Lemon → <i style="color:var(--acc)">GPS</i></div></div><span class="chip" style="background:#e4f3e4;color:var(--ok);height:34px">✓ Solved</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;text-align:center">${[['4','Clicks'],['0:33','Time'],['4','Par'],['★★★','Rating']].map(([a,b])=>`<div><div class="big" style="font-size:40px">${a}</div><div class="eye" style="font-size:9px;margin-top:3px">${b}</div></div>`).join('')}</div></div>
 <div class="card" style="padding:14px 16px;display:flex;gap:10px"><div class="btn acc" style="height:48px;flex:1.4">Share this find</div><div class="btn gh" style="height:48px;flex:1">Challenge</div><div class="btn gh" style="height:48px;flex:1">Route</div></div>
 <div class="card" style="padding:18px 22px;display:flex;align-items:center;gap:20px"><div class="kv" style="font-size:40px">11:29:26</div><div class="ex">until plate no. 301<br>Streak boost unlocks at 14 days</div></div></div></div></div></div>`;
const sky=(c)=>`<div class="dt dk">${rail('sky',c)}<div class="mainx">${tb('Your sky')}<div class="two" style="grid-template-columns:1.25fr 1fr"><div><div style="display:flex;align-items:baseline;gap:14px"><div class="big" style="font-size:44px">21 of 146 found</div><div class="ex">9 of 9 types · 30 earned</div></div><div class="bar2" style="margin:12px 0 16px"><i style="width:14%"></i></div><div class="seg" style="width:340px"><span class="on">Collection</span><span>Universe</span></div><div class="tile9" style="margin-top:16px">${['brown','reddwarf','redgiant','sun','bluewhite','bluegiant','whitedwarf','neutron','quasar'].map((id,i)=>`<div class="card art" style="aspect-ratio:1.25;padding:0"><canvas data-art="${id}" width="440" height="352" style="width:100%;height:100%"></canvas><div style="position:absolute;left:12px;bottom:9px;font:italic 19px EB;color:${SKY.OBJ[i].c}">${SKY.OBJ[i].name}</div></div>`).join('')}</div></div>
 <div class="card" style="padding:22px;align-self:start"><div class="eye">Neutron star</div><div style="font:italic 400 44px/1 EB;color:#5fe0ff;margin:6px 0 10px">3 of 15</div><div class="bar2"><i style="width:20%;background:#5fe0ff"></i></div>${[['Crab Pulsar','1.4 Suns'],['Vela Pulsar','1.4 Suns'],['Geminga','1.4 Suns'],['???','still to find']].map(([a,b])=>`<div class="row" style="padding:12px 0"><div style="flex:1;font:italic 20px EB">${a}</div><span class="ex">${b}</span>${a!=='???'?'<span class="chip" style="height:28px">Inspect</span>':''}</div>`).join('')}<div class="ex" style="margin-top:8px">→ 2 more neutron stars completes this set</div></div></div></div></div>`;
const ranks=(c)=>`<div class="dt">${rail('ranks',c)}<div class="mainx">${tb('Ranks')}<div class="two" style="grid-template-columns:1.4fr 1fr"><div><div class="seg" style="width:420px;margin-bottom:16px"><span class="on">Today</span><span>Week</span><span>All time</span><span>Leagues</span></div><div class="card" style="padding:6px 0">${[['Ada','4','0:31','#5fe0ff'],['Eli','4','0:44','#6fa4ff'],['You','4','0:33','#e5482a'],['Mia','5','0:58','#ffc83a'],['Ray','5','0:40','#f57a34'],['Jun','5','1:07','#f0523a']].map(([n,cl,t,col],i)=>`<div class="row" ${n==='You'?'style="background:var(--acc2)"':''}><span class="num">${i+1}</span><div class="av" style="box-shadow:0 0 0 2px ${col}">${n[0]}</div><b style="flex:1;font:600 15px IS">${n}</b><span class="ex">${cl} clicks · ${t}</span></div>`).join('')}</div></div>
 <div class="g12" style="align-content:start"><div class="card" style="padding:22px"><div class="eye">Your standing</div><div class="big" style="margin:6px 0">#3 of 6</div><div class="ex">Top 50% today · 12-day streak</div></div><div class="card" style="padding:22px"><div class="eye">Private leagues</div><div class="ex" style="margin:8px 0 14px">Race friends on the same puzzle every day.</div><div class="btn acc sm">Create a league</div></div></div></div></div></div>`;
const play=(c)=>`<div class="dt">${rail('play',c)}<div class="mainx"><div class="tb"><div style="display:flex;align-items:center;gap:14px"><span class="pill">${ic('back')}Back</span><span style="font:400 26px EB">Lemon <span style="color:var(--mute)">→</span> <i style="color:var(--acc)">Global Positioning System</i></span></div><div style="display:flex;gap:8px"><span class="pill">3 clicks</span><span class="pill">0:21</span></div></div>
 <div style="flex:1;display:grid;grid-template-columns:1fr 300px;gap:22px;padding:0 32px 28px;min-height:0"><div class="card" style="padding:22px 36px;overflow:hidden"><div class="big">Fruit</div><div class="art-p" style="padding:10px 0;font-size:19px">In botany, a <a>fruit</a> is the seed-bearing structure in <a>flowering plants</a> formed from the ovary after flowering. Fruits are the means by which <a>angiosperms</a> disseminate seeds. Edible fruits, in particular, have long propagated using the <a>movements</a> of humans and animals in a <a>symbiotic relationship</a>; the <a>propagation</a> of seeds provides food for <a>animals</a> and <a>humans</a>. Many <a>seeds</a> and fruits are adapted for <a>dispersal</a>…</div></div>
 <div class="g12" style="align-content:start"><div class="card" style="padding:18px"><div class="eye">Heat</div><div class="heat" style="margin:12px 0 8px"></div><b style="font:700 13px IS;color:var(--acc)">WARM</b></div><div class="card" style="padding:18px"><div class="eye">Your path</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"><span class="chip">Lemon</span><span class="chip">Citrus</span><span class="chip on">Fruit</span></div></div><div class="card" style="padding:14px 18px"><div class="pill" style="width:100%;height:42px;justify-content:center">${ic('find')}Find a link on this page</div><div class="pill" style="width:100%;height:42px;justify-content:center;margin-top:8px">${ic('list')}Contents</div></div></div></div></div></div>`;
const phHome=()=>`<div class="ph"><div class="scr">${tp2()}<div style="text-align:center;padding-top:34px"><div class="eye">Today's puzzle · no. 300</div><div style="font:400 58px/1 EB;margin-top:24px">Lemon</div><div style="display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--mute)"><div style="flex:1;height:1px;background:var(--line)"></div><i style="font:italic 20px EB">to</i><div style="flex:1;height:1px;background:var(--line)"></div></div><div style="font:italic 400 52px/1.02 EB;color:var(--acc)">Global Positioning System</div><div style="display:flex;justify-content:center;gap:6px;margin:22px 0"><span class="chip">Fastest 3</span><span class="chip">Medium</span></div></div><div class="btn acc" style="height:64px;font-size:17px;border-radius:20px;margin-top:6px">Play today's puzzle</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px"><div class="card" style="padding:14px"><div class="eye">Streak</div><div class="mid" style="margin-top:4px">12 days</div></div><div class="card" style="padding:14px"><div class="eye">Board</div><div class="mid" style="margin-top:4px">6 played</div></div></div></div>${nav('play')}</div>`;

function tp2(){return `<div class="top"><div class="logo">Scorch<b>er</b></div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12</span></div></div>`}
const R=document.getElementById('R');const sec=(t,h)=>R.insertAdjacentHTML('beforeend',`<h2 class="t">${t}</h2><div class="rowx">${h}</div>`);
sec('1 · Desktop home: sidebar expanded vs collapsed. Play is the centrepiece',home(false)+home(true));
sec('2 · Desktop: after solving (collapsed) and in a puzzle',solved(true)+play(true));
