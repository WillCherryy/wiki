<style>

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font:700 15px IS;background:var(--ink);color:var(--bg);width:100%}.btn.acc{background:var(--acc);color:#fff}.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{height:40px;font-size:13px;border-radius:12px}

.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}.seg span{flex:1;text-align:center;height:34px;line-height:34px;font:700 12.5px IS;color:var(--mute);border-radius:10px}.seg span.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}

.dock{position:absolute;left:14px;right:14px;bottom:96px;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 14px 30px -14px #0006}
.dock .d{flex:1;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px IS;color:var(--ink2);gap:2px}.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.art{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(120% 90% at 50% 20%,#17304a,#07060f 70%)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 13px IS;color:var(--ink2)}
.num{font:700 13px IS;width:22px;color:var(--mute)}
.bar2{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc);border-radius:4px}

.art-p{padding:16px;line-height:1.55;font:400 15.5px/1.55 EB;color:var(--ink2)}.art-p a{color:var(--acc);text-decoration:underline}
.dt{width:1180px;height:760px;border-radius:16px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);display:flex;box-shadow:0 30px 60px -20px #0008}

.rail .nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font:600 14px IS;color:var(--ink2)}.rail .nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rail .nv.on{background:var(--acc2);color:var(--acc)}
.main{flex:1;padding:26px 34px;overflow:hidden}

.dt{width:1280px;height:800px}.rail{width:232px;transition:none;flex:none}.rail.c{width:76px;padding:22px 12px;align-items:center}.rail.c .nv{width:48px;padding:0;justify-content:center}.rail.c .lab,.rail.c .logo span.w,.rail.c .sc{display:none}
.coll{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);margin-left:auto}.coll svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rail .hd{display:flex;align-items:center;margin-bottom:16px;padding:0 4px}.rail.c .hd{flex-direction:column;gap:12px}
.mainx{flex:1;display:flex;flex-direction:column;min-width:0}.tb{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px 20px}
.hero .rt{font:400 84px/1 EB;letter-spacing:-.01em}.hero .rt i{color:var(--acc)}.hero .to{display:flex;align-items:center;gap:18px;color:var(--mute);margin:14px 0;font:italic 24px EB;width:520px}.hero .to div{flex:1;height:1px;background:var(--line)}
.cta{display:inline-flex;align-items:center;gap:12px;height:72px;padding:0 54px;border-radius:22px;background:var(--acc);color:#fff;font:700 19px IS;box-shadow:0 18px 36px -16px var(--acc)}.cta svg{width:20px;height:20px;fill:#fff;stroke:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 32px 28px}.strip .card{padding:16px 18px}
.kv{font:400 30px/1 EB}.ex{font:500 13px/1.4 IS;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 32px 28px;flex:1;min-height:0}
.tile9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* alignment system: every page is a 12-column grid with one gap; cards stretch to equal heights in a row; one inner padding */
.mainx{overflow:hidden}.pg{flex:1;min-height:0;padding:0 32px 28px;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(0,1fr);gap:18px}
.pg>*{min-width:0;min-height:0}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}.r2{grid-row:span 2}.r3{grid-row:span 3}
.pg>.card,.cd{padding:20px 22px;display:flex;flex-direction:column;overflow:hidden}.card h4,.cd h4{font:700 10.5px IS;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:18px;min-height:0}.stack>.card{flex:1;padding:20px 22px;display:flex;flex-direction:column;overflow:hidden}
.fill{flex:1;min-height:0}.pgh{padding:0 32px 14px;display:flex;align-items:baseline;gap:14px}.pgh .t1{font:400 40px/1 EB}.pgh .t2{font:500 14px IS;color:var(--mute)}
.tabsx{display:flex;gap:6px;padding:0 32px 16px}.tabsx span{height:36px;padding:0 16px;border-radius:99px;font:700 12.5px IS;color:var(--mute);display:flex;align-items:center;background:transparent}.tabsx span.on{background:var(--ink);color:var(--bg)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li .n{flex:1;font:600 14px IS}.li small{font:500 12.5px IS;color:var(--mute)}
.tocl{display:grid;gap:2px}.tocl div{padding:9px 12px;border-radius:10px;font:600 13.5px IS;color:var(--ink2)}.tocl div.on{background:var(--acc2);color:var(--acc)}.tocl div.s{padding-left:26px;font-weight:500;color:var(--mute)}
.sw{width:100%;aspect-ratio:1.5;border-radius:14px;display:grid;place-items:center;font:italic 22px EB;color:#fff}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}.kpi b{display:block;font:400 40px/1 EB}.kpi span{display:block;margin-top:6px;font:700 9.5px IS;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.togl{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative}.togl.on{background:var(--acc)}.togl::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}.togl.on::after{left:21px}
.modalx{position:absolute;inset:0;background:#0007;display:grid;place-items:center}.mdl{width:460px;background:var(--card);border-radius:24px;padding:26px;box-shadow:0 30px 60px #0008}
.phx{height:844px}.pgp{display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.togl{flex:none}.pg.cmp,.pg.me{align-content:start}.pg.cmp{grid-template-rows:none;grid-auto-rows:minmax(380px,auto)}.pg.cmp>.card,.pg.cmp>.stack{align-self:stretch}.pg.cmp .stack>.card{flex:none}.cmp .grid2>.card{min-height:120px}.ph [style*="flex-direction:column"] svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style></head><body>
<script src="../skyobjects.js"></script>
<div id="R"></div>
<script>
const I={play:'<path d="M7 5l12 7-12 7z"/>',sky:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',packs:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',ranks:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 20h8"/>',me:'<circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',find:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',list:'<path d="M5 7h14M5 12h10M5 17h12"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',back:'<path d="M15 5l-7 7 7 7"/>',live:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/>',studio:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const nav=a=>`<div class="bar">${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['me','Me']].map(([k,t])=>`<div class="tab ${a===k?'on':''}">${ic(k)}${t}<i></i></div>`).join('')}</div>`;
const tp=(r)=>`<div class="top"><div class="logo">Scorch<b>er</b></div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12</span>${r||''}</div></div>`;
const art=(id,h,extra='')=>`<div class="art" style="height:${h}px;${extra}"><canvas data-art="${id}" width="760" height="${Math.round(h*760/354)}" style="width:100%;height:100%"></canvas></div>`;
const route=`<div style="text-align:center"><div class="eye">Plate no. 300 · Tuesday</div><div class="big" style="margin-top:12px">Lemon</div><div style="display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--mute)"><div style="flex:1;height:1px;background:var(--line)"></div><i style="font:italic 18px EB">to</i><div style="flex:1;height:1px;background:var(--line)"></div></div><div class="big" style="color:var(--acc);font-style:italic">Global Positioning System</div></div>`;


const rail=(a,c=true)=>`<div class="rail ${c?'c':''}"><div class="hd"><div class="logo" style="font-size:26px">${c?'S<b>.</b>':'Scorch<b>er</b>'}</div><div class="coll" style="${c?'margin:0':''}"><svg viewBox="0 0 24 24"><path d="${c?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg></div></div>${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['live','Live'],['studio','Studio'],['me','Me']].map(([k,t])=>`<div class="nv ${a===k?'on':''}">${ic(k)}<span class="lab">${t}</span></div>`).join('')}<div style="margin-top:auto"><span class="pill" style="padding:0 9px">${ic('flame')}12</span></div></div>`;
const tb=(l,r='')=>`<div class="tb"><div class="eye">${l}</div><div style="display:flex;gap:8px">${r}<span class="pill">${ic('find')}Search</span><span class="pill">${ic('flame')}12 day streak</span><span class="pill">Will</span></div></div>`;
const D=(a,l,inner,dark)=>`<div class="dt ${dark?'dk':''}">${rail(a)}<div class="mainx">${tb(l)}${inner}</div></div>`;
const cv=(id,w=400,h=300,st='')=>`<div class="art" style="${st}"><canvas data-art="${id}" width="${w}" height="${h}" style="width:100%;height:100%"></canvas></div>`;
const hdr=(t,s)=>`<div class="pgh"><div class="t1">${t}</div><div class="t2">${s}</div></div>`;
const btn=(t,k='')=>`<div class="btn ${k} sm" style="height:44px">${t}</div>`;
// 1 puzzle with contents
const puzzle=()=>D('play','Plate no. 300 · in progress',`<div style="padding:0 32px 14px;display:flex;align-items:center;gap:14px"><span class="pill">${ic('back')}Back</span><span style="font:400 26px EB">Lemon <span style="color:var(--mute)">→</span> <i style="color:var(--acc)">Global Positioning System</i></span><span style="margin-left:auto" class="pill">3 clicks · 0:21</span></div>
<div class="pg" style="grid-template-rows:auto 1fr"><div class="card c12" style="padding:12px 22px;flex-direction:row;align-items:center;gap:18px"><div class="eye">Heat</div><div class="heat fill"></div><b style="font:700 13px IS;color:var(--acc)">WARM</b><div style="width:1px;height:24px;background:var(--line)"></div><span class="chip">Lemon</span><span class="chip">Citrus</span><span class="chip on">Fruit</span></div>
<div class="card c9" style="padding:22px 38px"><div class="big">Fruit</div><div class="art-p" style="padding:10px 0;font-size:19px">In botany, a <a>fruit</a> is the seed-bearing structure in <a>flowering plants</a> formed from the ovary after flowering. Fruits are the means by which <a>angiosperms</a> disseminate seeds. Edible fruits, in particular, have long propagated using the <a>movements</a> of humans and animals in a <a>symbiotic relationship</a>; the <a>propagation</a> of seeds provides food for <a>animals</a> and <a>humans</a>. Many <a>seeds</a> and fruits are adapted for <a>dispersal</a> by wind, water or animals…</div></div>
<div class="card c3"><div class="seg" style="margin-bottom:14px"><span class="on">Contents</span><span>Find</span></div><div class="tocl"><div class="on">Introduction</div><div>Botanical term</div><div class="s">Development</div><div class="s">Types</div><div>Seed dispersal</div><div>Uses</div><div class="s">Nutrition</div><div>References</div></div><div style="margin-top:auto"><div class="btn gh sm" style="height:40px">${ic('target')}Target: GPS</div></div></div></div>`);
// 2 result
const result=()=>D('play','Result · Plate no. 300',`${hdr('Solved in 4 clicks','Par 4 · 0:33 · every click warmer')}<div class="pg" style="grid-template-rows:1fr 1fr"><div class="card c8"><h4>Your route</h4><div class="fill" style="display:flex;align-items:center;gap:0;justify-content:space-between;padding:0 6px">${['Lemon','Citrus','Fruit','Satellite','GPS'].map((n,i)=>`<div style="text-align:center;flex:1;position:relative"><div style="width:${14+i*5}px;height:${14+i*5}px;border-radius:50%;background:${['#2a4f8a','#6a85a8','#d8c8a8','#f0a050','#e5482a'][i]};margin:0 auto 10px"></div><div style="font:600 13px IS">${n}</div></div>`).join('')}</div><div class="heat"></div></div>
<div class="card c4 r2" style="background:#0b0a18;border-color:#0b0a18;color:#eceaf8;padding:0">${cv('neutron',560,560,'flex:1;border-radius:0')}<div style="padding:14px 22px 20px;text-align:center"><div class="eye" style="color:#8d86b0">New discovery · Epic</div><div style="font:italic 400 44px/1 EB;color:#5fe0ff;margin:6px 0">Crab Pulsar</div>${btn('Share this find','acc')}</div></div>
<div class="card c4"><h4>Run</h4><div class="kpi" style="grid-template-columns:repeat(2,1fr);gap:16px"><div><b>4</b><span>Clicks</span></div><div><b>0:33</b><span>Time</span></div></div></div><div class="card c4"><h4>The crowd</h4><div class="li"><span class="n">Italy</span><small>41% chose this</small></div><div class="li"><span class="n">Fruit</span><small>You · 24%</small></div></div></div>`);
// 3 packs
const packs=()=>D('packs','Packs',`${hdr('Packs','Themed puzzle sets, solved at your pace')}<div class="pg" style="grid-template-rows:1fr 1fr">${[['Food & drink','0 / 22','#e5482a',2],['Space','8 / 22','#2a4f8a',36],['History','3 / 22','#8a6a2a',14],['Nature','0 / 22','#2f7d46',0],['Science','5 / 22','#6a4fa8',23],['Geography','1 / 22','#0f8b7e',5]].map(([n,c,col,p])=>`<div class="card c4"><div style="display:flex;justify-content:space-between;align-items:center"><div style="width:44px;height:44px;border-radius:12px;background:${col}22;display:grid;place-items:center">${ic('packs').replace('<svg','<svg style="width:22px;height:22px;stroke:'+col+'"')}</div><span class="chip">${c}</span></div><div style="font:400 30px EB;margin-top:auto">${n}</div><div class="bar2" style="margin-top:10px"><i style="width:${p}%;background:${col}"></i></div></div>`).join('')}</div>`);
// 4 live
