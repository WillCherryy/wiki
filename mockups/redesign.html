<!doctype html><html><head><meta charset="utf-8"><title>Scorcher redesign</title>
<style>
@font-face{font-family:EB;font-weight:400;src:url(../fonts/eb-garamond-latin-400-normal.woff2)}
@font-face{font-family:EB;font-weight:400;font-style:italic;src:url(../fonts/eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:EB;font-weight:500;src:url(../fonts/eb-garamond-latin-500-normal.woff2)}
@font-face{font-family:IS;font-weight:400;src:url(../fonts/instrument-sans-latin-400-normal.woff2)}
@font-face{font-family:IS;font-weight:600 700;src:url(../fonts/instrument-sans-latin-600-normal.woff2)}
:root{--bg:#f5f0e7;--card:#fffdf8;--ink:#17140f;--ink2:#4a443a;--mute:#8d8576;--line:#e9e1d1;--acc:#e5482a;--acc2:#fde9e2;--ok:#2f7d46;--r:20px}
.dk{--bg:#0d0b16;--card:#161326;--ink:#f1eefb;--ink2:#c3bcdc;--mute:#7f7899;--line:#262140;--acc:#ff7a4d;--acc2:#2a1a22;--ok:#5fd68a}
*{box-sizing:border-box;margin:0}body{background:#7d7a74;font-family:IS,system-ui,sans-serif;padding:28px;color:#fff}
h2.t{font:700 12px IS;letter-spacing:.2em;text-transform:uppercase;margin:34px 0 14px;color:#fff}
.rowx{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.ph{width:390px;height:844px;border-radius:38px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);box-shadow:0 30px 60px -20px #0008}
.scr{position:absolute;inset:0 0 84px 0;overflow:hidden;padding:54px 18px 0}
.bar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;font:600 10.5px IS;color:var(--mute);letter-spacing:.02em}.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--acc)}.tab.on i{display:block;width:22px;height:3px;border-radius:3px;background:var(--acc);margin-top:-1px}.tab i{display:block;height:3px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font:500 24px EB}.logo b{color:var(--acc);font-weight:500;font-style:italic}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:600 12.5px IS;color:var(--ink2)}
.pill svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:2}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.eye{font:700 10.5px IS;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font:700 15px IS;background:var(--ink);color:var(--bg);width:100%}.btn.acc{background:var(--acc);color:#fff}.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{height:40px;font-size:13px;border-radius:12px}
.big{font:400 40px/1.02 EB}.mid{font:400 28px/1.05 EB}
canvas{display:block}
.mt{margin-top:14px}.dt .card .big{font-size:60px}.rowx{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}.g8{display:grid;gap:8px}.g12{display:grid;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--bg);font:600 12px IS;color:var(--ink2)}.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}.seg span{flex:1;text-align:center;height:34px;line-height:34px;font:700 12.5px IS;color:var(--mute);border-radius:10px}.seg span.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dock{position:absolute;left:14px;right:14px;bottom:96px;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 14px 30px -14px #0006}
.dock .d{flex:1;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px IS;color:var(--ink2);gap:2px}.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.art{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(120% 90% at 50% 20%,#17304a,#07060f 70%)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 13px IS;color:var(--ink2)}
.num{font:700 13px IS;width:22px;color:var(--mute)}
.bar2{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc);border-radius:4px}
.heat{height:8px;border-radius:5px;background:linear-gradient(90deg,#2a4f8a,#d8c8a8,#e5482a)}
.art-p{padding:16px;line-height:1.55;font:400 15.5px/1.55 EB;color:var(--ink2)}.art-p a{color:var(--acc);text-decoration:underline}
.dt{width:1180px;height:760px;border-radius:16px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);display:flex;box-shadow:0 30px 60px -20px #0008}
.rail{width:220px;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.rail .nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font:600 14px IS;color:var(--ink2)}.rail .nv svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rail .nv.on{background:var(--acc2);color:var(--acc)}
.main{flex:1;padding:26px 34px;overflow:hidden}
</style></head><body>
<script src="../skyobjects.js"></script>
<div id="R"></div>
<script>
const I={play:'<path d="M7 5l12 7-12 7z"/>',sky:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',packs:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',ranks:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 20h8"/>',me:'<circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',find:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',list:'<path d="M5 7h14M5 12h10M5 17h12"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',back:'<path d="M15 5l-7 7 7 7"/>',live:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/>',studio:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const nav=a=>`<div class="bar">${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['me','Me']].map(([k,t])=>`<div class="tab ${a===k?'on':''}">${ic(k)}${t}<i></i></div>`).join('')}</div>`;
const tp=(r)=>`<div class="top"><div class="logo">Scorch<b>er</b></div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12</span>${r||''}</div></div>`;
const art=(id,h,extra='')=>`<div class="art" style="height:${h}px;${extra}"><canvas data-art="${id}" width="760" height="${Math.round(h*760/354)}" style="width:100%;height:100%"></canvas></div>`;
const route=`<div style="text-align:center"><div class="eye">Plate no. 300 · Tuesday</div><div class="big" style="margin-top:12px">Lemon</div><div style="display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--mute)"><div style="flex:1;height:1px;background:var(--line)"></div><i style="font:italic 18px EB">to</i><div style="flex:1;height:1px;background:var(--line)"></div></div><div class="big" style="color:var(--acc);font-style:italic">Global Positioning System</div></div>`;
const S={};
S.home=()=>`<div class="ph"><div class="scr">${tp()}
 <div class="card" style="padding:22px 20px">${route}
  <div style="display:flex;justify-content:center;gap:8px;margin:18px 0 6px"><span class="chip">Fastest 3</span><span class="chip">Medium</span><span class="chip">Food → Tech</span></div></div>
 <div class="btn acc mt" style="height:58px;font-size:16px">Play today's puzzle ${ic('play').replace('<svg','<svg style="width:18px;height:18px;fill:#fff;stroke:none"')}</div>
 <div class="card mt" style="padding:14px 16px;display:flex;align-items:center;gap:14px"><div style="flex:1"><div class="eye">Your streak</div><div class="mid" style="margin-top:4px">12 days</div></div><div class="dots">${'<i style="background:var(--acc)"></i>'.repeat(5)}<i></i><i></i></div></div>
 <div class="card mt" style="padding:14px 16px;display:flex;align-items:center;gap:14px"><div style="width:62px;height:62px;border-radius:14px;overflow:hidden" class="art"><canvas data-art="reddwarf" width="124" height="124" style="width:100%;height:100%"></canvas></div><div style="flex:1"><div class="eye">Next goal</div><div style="font:600 14px/1.35 IS;margin-top:3px">1 find away from completing your brown dwarfs</div></div></div></div>${nav('play')}</div>`;
S.solved=()=>`<div class="ph"><div class="scr">${tp()}
 <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div><div class="eye">Plate no. 300</div><div style="font:400 22px EB;margin-top:2px">Lemon → <i style="color:var(--acc)">GPS</i></div></div><span class="chip" style="background:#e4f3e4;color:var(--ok)">✓ Solved</span></div>
 <div class="card" style="overflow:hidden;background:#0b0a18;border-color:#0b0a18;color:#eceaf8;--c:#5fe0ff">${art('neutron',205,'border-radius:0')}
  <div style="padding:6px 18px 18px;text-align:center"><div class="eye" style="color:#8d86b0">New discovery · Epic</div><div style="font:italic 400 50px/1 EB;color:#5fe0ff;margin:6px 0;text-shadow:0 0 24px #5fe0ff88">Crab Pulsar</div><div style="font:600 11.5px IS;letter-spacing:.1em;text-transform:uppercase;color:#a9a2c8">Neutron star · 1.4 Suns</div>
  <div style="margin:10px 0;padding:7px 12px;border-radius:12px;background:#ffffff12;border-left:3px solid #5fe0ff;font:500 13px/1.4 IS;text-align:left"><b style="display:block;font:800 9.5px IS;letter-spacing:.18em;color:#5fe0ff">SO CLOSE</b>No search or rewind would have found a quasar.</div>
  <div class="btn sm" style="background:#5fe0ff;color:#06121a">Share this find</div></div></div>
 <div class="card mt" style="display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px;text-align:center">${[['4','Clicks'],['0:33','Time'],['4','Par'],['★★★','Rating']].map(([a,b])=>`<div><div class="mid">${a}</div><div class="eye" style="font-size:9px;margin-top:3px">${b}</div></div>`).join('')}</div>
 <div class="g8 mt" style="grid-template-columns:1fr 1fr 1fr"><div class="btn gh sm">Challenge</div><div class="btn gh sm">Route</div><div class="btn gh sm">Poster</div></div>
 <div style="text-align:center;margin-top:12px;font:500 12.5px IS;color:var(--mute)">Next puzzle in <b style="color:var(--ink)">11:29:26</b></div></div>${nav('play')}</div>`;
S.game=()=>`<div class="ph"><div style="position:absolute;inset:0 0 84px 0;padding:50px 0 0">
 <div style="padding:0 16px"><div style="display:flex;align-items:center;justify-content:space-between"><span class="pill">${ic('back')}Lemon</span><div style="text-align:center"><div class="eye" style="font-size:9px">Reach</div><div style="font:italic 20px EB;color:var(--acc)">Global Positioning System</div></div><span class="pill">3 · 0:21</span></div>
 <div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px"><div class="heat" style="flex:1"></div><b style="font:700 12px IS;color:var(--acc)">WARM</b></div>
 <div style="display:flex;gap:6px;overflow:hidden"><span class="chip">Lemon</span><span class="chip">Citrus</span><span class="chip on">Fruit</span></div></div>
 <div class="card" style="margin:12px 16px 0;height:520px;overflow:hidden"><div style="padding:14px 16px 0"><div class="mid">Fruit</div></div><div class="art-p">In botany, a <a>fruit</a> is the seed-bearing structure in <a>flowering plants</a> formed from the ovary after flowering. Fruits are the means by which <a>angiosperms</a> disseminate seeds. Edible fruits, in particular, have long propagated using the <a>movements</a> of humans and animals in a <a>symbiotic relationship</a>; the <a>propagation</a> of seeds provides food for <a>animals</a> and <a>humans</a>…</div></div></div>
 <div class="dock"><div class="d">${ic('back')}Back</div><div class="d">${ic('find')}Find</div><div class="d">${ic('list')}Contents</div><div class="d">${ic('target')}Target</div></div>${nav('play').replace('class="bar"','class="bar" style="opacity:.0;pointer-events:none"')}<div style="position:absolute;left:0;right:0;bottom:0;height:84px"></div></div>`;
S.sky=()=>`<div class="ph dk"><div class="scr">${tp()}<div class="eye">Your sky</div><div class="mid" style="margin:4px 0 12px">21 of 146 found</div><div class="bar2" style="margin-bottom:12px"><i style="width:14%"></i></div>
 <div class="seg"><span class="on">Collection</span><span>Universe</span></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px">${['brown','reddwarf','redgiant','sun','bluewhite','bluegiant','whitedwarf','neutron','quasar'].map((id,i)=>`<div class="card art" style="aspect-ratio:1;border-radius:16px;padding:0"><canvas data-art="${id}" width="300" height="300" style="width:100%;height:100%"></canvas><div style="position:absolute;left:0;right:0;bottom:7px;text-align:center;font:italic 15px EB;color:${SKY.OBJ[i].c}">${SKY.OBJ[i].name}</div></div>`).join('')}</div>
 <div class="card mt" style="padding:12px 14px;font:600 13px/1.4 IS;color:var(--ink2)"><span class="eye" style="display:block;margin-bottom:3px">Next goal</span>2 more neutron stars completes your collection</div></div>${nav('sky')}</div>`;
S.ranks=()=>`<div class="ph"><div class="scr">${tp()}<div class="mid">Ranks</div><div class="seg mt"><span class="on">Today</span><span>Week</span><span>All time</span><span>Leagues</span></div>
 <div class="card mt" style="padding:6px 0">${[['Ada','4','0:31','#5fe0ff'],['Eli','4','0:44','#6fa4ff'],['You','4','0:33','#e5482a'],['Mia','5','0:58','#ffc83a'],['Ray','5','0:40','#f57a34'],['Jun','5','1:07','#f0523a']].map(([n,c,t,col],i)=>`<div class="row" ${n==='You'?'style="background:var(--acc2)"':''}><span class="num">${i+1}</span><div class="av" style="box-shadow:0 0 0 2px ${col}">${n[0]}</div><b style="flex:1;font:600 14.5px IS">${n}</b><span style="font:600 12.5px IS;color:var(--mute)">${c} clicks · ${t}</span></div>`).join('')}</div>
 <div class="card mt" style="padding:14px 16px;display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="eye">Private league</div><div style="font:600 14px IS;margin-top:3px">Create one to race friends daily</div></div><span class="btn sm acc" style="width:auto;padding:0 16px">Create</span></div></div>${nav('ranks')}</div>`;
S.packs=()=>`<div class="ph"><div class="scr">${tp()}<div class="mid">Packs</div><div style="font:500 14px IS;color:var(--mute);margin:2px 0 14px">Themed puzzle sets, solved at your pace</div>
 <div class="g12">${[['Food & drink','0 / 22','#e5482a',12],['Space','8 / 22','#2a4f8a',36],['History','3 / 22','#8a6a2a',14],['Nature','0 / 22','#2f7d46',0]].map(([n,c,col,p])=>`<div class="card" style="padding:16px;display:flex;align-items:center;gap:14px"><div style="width:52px;height:52px;border-radius:14px;background:${col}22;display:grid;place-items:center">${ic('packs').replace('<svg','<svg style="width:26px;height:26px;stroke:'+col+'"')}</div><div style="flex:1"><div style="font:400 24px EB">${n}</div><div class="bar2" style="margin-top:8px"><i style="width:${p}%;background:${col}"></i></div></div><div style="font:700 12px IS;color:var(--mute)">${c}</div></div>`).join('')}</div>
 <div class="card mt" style="padding:14px 16px;display:flex;gap:12px;align-items:center">${ic('live').replace('<svg','<svg style="width:26px;height:26px;stroke:var(--acc)"')}<div style="flex:1"><div style="font:600 14.5px IS">Live race</div><div style="font:500 12.5px IS;color:var(--mute)">Host or join a lobby with friends</div></div></div></div>${nav('packs')}</div>`;
S.me=()=>`<div class="ph"><div class="scr">${tp()}
 <div class="card" style="padding:18px;display:flex;gap:16px;align-items:center"><div class="art" style="width:84px;height:84px;border-radius:20px"><canvas data-art="neutron" width="168" height="168" style="width:100%;height:100%"></canvas></div><div><div class="eye">Title</div><div class="mid">Pulsar Hunter</div><div style="font:500 12.5px IS;color:var(--mute);margin-top:2px">Level 8 · 640 XP</div></div></div>
 <div class="card mt" style="display:grid;grid-template-columns:repeat(3,1fr);padding:16px 4px;text-align:center">${[['63','Played'],['41','Best streak'],['2','Best clicks']].map(([a,b])=>`<div><div class="mid">${a}</div><div class="eye" style="font-size:9px;margin-top:3px">${b}</div></div>`).join('')}</div>
 <div class="card mt" style="padding:6px 0">${[['Cloud save','On · restore code ready'],['Locker','Themes, trails and buddies'],['Studio','Make your own puzzles'],['Settings','Sound, motion, text size']].map(([a,b])=>`<div class="row"><div style="flex:1"><div style="font:600 14.5px IS">${a}</div><div style="font:500 12.5px IS;color:var(--mute)">${b}</div></div><span style="color:var(--mute)">›</span></div>`).join('')}</div></div>${nav('me')}</div>`;
const rail=a=>`<div class="rail"><div class="logo" style="padding:4px 12px 18px;font-size:26px">Scorch<b>er</b></div>${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['live','Live'],['studio','Studio'],['me','Me']].map(([k,t])=>`<div class="nv ${a===k?'on':''}">${ic(k)}${t}</div>`).join('')}<div style="margin-top:auto"><div class="card" style="padding:12px 14px"><div class="eye">Streak</div><div class="mid">12 days</div></div></div></div>`;
S.dt=(solved,dark)=>`<div class="dt ${dark?'dk':''}">${rail('play')}<div class="main"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div class="eye">Tuesday 27 October · Plate no. 300</div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12 streak</span><span class="pill">Search</span></div></div>
 ${solved?`<div style="display:grid;grid-template-columns:1.2fr 1fr;gap:26px"><div class="card" style="overflow:hidden;background:#0b0a18;border-color:#0b0a18;color:#eceaf8">${art('quasar',430,'border-radius:0')}<div style="padding:4px 24px 22px"><div class="eye" style="color:#8d86b0">New discovery · Legendary</div><div style="font:italic 400 58px/1 EB;color:#ffa24a;margin:6px 0">TON 618</div><div style="font:600 12px IS;letter-spacing:.1em;text-transform:uppercase;color:#a9a2c8">Quasar · 66 billion Suns</div></div></div>
 <div class="g12"><div class="card" style="padding:22px"><div style="display:flex;justify-content:space-between"><div><div class="eye">Plate no. 300</div><div style="font:400 30px/1.1 EB;margin-top:4px">Lemon → <i style="color:var(--acc)">GPS</i></div></div><span class="chip" style="background:#e4f3e4;color:var(--ok);height:32px">✓ Solved</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;text-align:center">${[['4','Clicks'],['0:33','Time'],['4','Par'],['★★★','Rating']].map(([a,b])=>`<div><div class="big" style="font-size:36px">${a}</div><div class="eye" style="font-size:9px">${b}</div></div>`).join('')}</div></div>
 <div class="card" style="padding:18px;display:flex;gap:12px"><div class="btn sm" style="background:var(--acc);color:#fff">Share this find</div><div class="btn sm gh">Challenge</div><div class="btn sm gh">Route</div></div>
