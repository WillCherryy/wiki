<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorcher Build console — concept mockup</title>
<style>
@font-face { font-family: 'Mona Sans'; src: url(fonts/mona-sans-latin.woff2) format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
:root { --ground: #eef0ec; --panel: #fff; --ink: #0d0f0e; --ink-2: #474c49; --ink-3: #6f7571; --rule: rgba(13, 15, 14, .16); --rule-2: rgba(13, 15, 14, .08);
  --blue: #1d3aa8; --blue-2: #e3e8fb; --red: #b8142f; --red-2: #f8e3e7; --signal: #e4ff3a; --sans: 'Mona Sans', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; }
html { overflow-x: clip; }
body { background: var(--ground); color: var(--ink); font: 400 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--ink); color: var(--signal); } :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
a { color: inherit; }

/* app shell: on a desktop the whole thing is exactly the window; panels scroll inside themselves, never the page */
.bar { display: flex; align-items: center; gap: 18px; height: 40px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.mark { display: flex; align-items: center; gap: 8px; font: 700 14px var(--sans); font-stretch: 125%; letter-spacing: -.02em; text-decoration: none; }
.mark i { width: 11px; height: 11px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
.bar .t { font: 400 12px var(--mono); color: var(--ink-2); } .bar .t b { color: var(--ink); font-weight: 500; }
.bar .c { margin-left: auto; font: 400 11.5px var(--mono); padding: 3px 8px; background: var(--ink); color: var(--ground); } .bar a.b { font-size: 12.5px; color: var(--ink-2); }
#shell { display: flex; flex-direction: column; height: 100vh; }
.app { display: grid; grid-template-columns: 176px minmax(0, 1fr); flex: 1; min-height: 0; }
.rail { background: var(--panel); border-right: 1px solid var(--rule); padding: 10px 0; overflow: auto; }
.rail h2 { padding: 8px 14px 3px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.rail button { display: flex; width: 100%; align-items: baseline; gap: 6px; padding: 6px 14px; border: 0; border-left: 3px solid transparent; background: none; text-align: left; font-size: 13px; color: var(--ink-2); }
.rail button:hover { background: var(--rule-2); color: var(--ink); } .rail button[aria-selected=true] { color: var(--ink); font-weight: 600; border-left-color: var(--blue); background: var(--blue-2); }
.rail button small { margin-left: auto; font: 400 10.5px var(--mono); color: var(--ink-3); }
main { padding: 10px 12px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { display: none; min-height: 0; } .view.on { display: flex; flex-direction: column; flex: 1; gap: 8px; }

.vh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
.vh h1 { font-size: 19px; font-weight: 640; font-stretch: 112%; letter-spacing: -.02em; margin-right: 6px; }
.tag { display: inline-flex; padding: 2px 7px; border: 1px solid var(--ink); font: 400 11px var(--mono); white-space: nowrap; } .tag.blue { background: var(--blue); border-color: var(--blue); color: #fff; } .tag.red { border-color: var(--red); color: var(--red); } .tag.dim { border-color: var(--rule); color: var(--ink-2); }
.about { margin-left: auto; position: relative; } .about summary { cursor: pointer; font-size: 12px; color: var(--ink-2); list-style: none; padding: 2px 8px; border: 1px solid var(--rule); background: var(--panel); } .about p { position: absolute; right: 0; top: 26px; width: min(460px, 80vw); background: var(--panel); border: 1px solid var(--ink); padding: 10px 12px; font-size: 12.5px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.ks { display: flex; background: var(--panel); border: 1px solid var(--rule); } .k { flex: 1; min-width: 0; padding: 6px 12px; border-right: 1px solid var(--rule-2); } .k:last-child { border-right: 0; } .k b { display: block; font: 500 16px/1.25 var(--mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .k span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel { display: flex; flex-wrap: wrap; gap: 4px; } .sel button { padding: 3px 9px; border: 1px solid var(--rule); background: var(--panel); font-size: 12px; } .sel button[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--ground); }
.verdict { padding: 8px 14px; background: var(--ink); color: var(--ground); font-size: 14px; line-height: 1.35; } .verdict b { color: var(--signal); font-weight: 600; } .verdict small { display: block; margin-top: 2px; font: 400 11px var(--mono); color: #aeb4b0; }

.dash { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.pn { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--rule); }
.pn > header { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px 0; min-width: 0; } .pn h3 { font-size: 12.5px; font-weight: 640; white-space: nowrap; } .pn .h { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pb { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 8px; position: relative; } .pb[data-draw] { overflow: hidden; padding: 2px 4px 4px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; } .r2 { grid-row: span 2; } .r3 { grid-row: span 3; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; } th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3); padding: 3px 8px 3px 0; border-bottom: 1.5px solid var(--ink); position: sticky; top: 0; background: var(--panel); white-space: nowrap; } td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule-2); vertical-align: top; } td.r, th.r { text-align: right; } td.m, td.r { white-space: nowrap; } td.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.dim td { color: var(--ink-3); }
.trace { list-style: none; padding: 0; counter-reset: s; } .trace li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--rule-2); font-size: 12px; }
.trace li::before { counter-increment: s; content: counter(s); font: 400 11px var(--mono); color: var(--ink-3); } .trace .tool { font: 500 11.5px var(--mono); } .trace .ms { font: 400 11px var(--mono); color: var(--ink-3); } .trace li > .n { grid-column: 2 / 4; color: var(--ink-2); }
.trace li.bad { background: var(--red-2); margin: 0 -6px; padding: 3px 6px; } .trace li.bad .tool { color: var(--red); }
.chk { list-style: none; padding: 0; } .chk li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--rule-2); font-size: 12.5px; } .chk i { width: 8px; height: 8px; margin-top: 5px; background: var(--blue); } .chk li.no i { background: var(--red); } .chk .d { display: block; font: 400 11px var(--mono); color: var(--ink-3); }
.review { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .review button { height: 28px; padding: 0 11px; border: 1.5px solid var(--ink); background: transparent; font-weight: 560; font-size: 12px; } .review button.p { background: var(--ink); color: var(--ground); } .review button.on { background: var(--blue); border-color: var(--blue); color: #fff; } .review button.on.x { background: var(--red); border-color: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--ink-2); } .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
.note { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
svg text { font-family: var(--sans); } svg .m { font-family: var(--mono); } canvas { display: block; }
pre { padding: 10px 12px; background: var(--ink); color: #dfe5ff; font: 400 11.5px/1.55 var(--mono); overflow: auto; } pre .c { color: #8a90a8; } pre .s { color: var(--signal); }
.clause { cursor: pointer; } .clause:hover td { background: var(--rule-2); } .passage { padding: 8px 10px; border-left: 3px solid var(--blue); background: var(--blue-2); font-size: 12.5px; } .passage mark { background: var(--signal); }
.mini { display: inline-block; vertical-align: middle; } .btnp { display: inline-block; padding: 5px 12px; border: 1.5px solid var(--ink); font-weight: 560; font-size: 12px; background: transparent; } .btnp[aria-disabled=true] { opacity: .45; cursor: not-allowed; }
.plan { padding: 7px 0; border-bottom: 1px solid var(--rule-2); } .plan b { font-weight: 640; } .plan p { color: var(--ink-2); font-size: 12px; margin-top: 1px; } .plan .pr { float: right; font: 400 11.5px var(--mono); color: var(--ink-3); }

label.fl { display: block; font-size: 11.5px; color: var(--ink-3); margin-bottom: 7px; } label.fl input, label.fl select, label.fl textarea, .pb td input, .pb td select { display: block; width: 100%; margin-top: 2px; padding: 5px 7px; border: 1px solid var(--rule); background: #fff; font: 400 12.5px var(--sans); color: var(--ink); border-radius: 0; } .pb td input { margin: 0; font-family: var(--mono); } label.fl textarea { resize: vertical; font-family: var(--sans); line-height: 1.4; } label.fl input:focus, label.fl textarea:focus, label.fl select:focus, .pb td input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .ck { display: block; padding: 2px 0; font-size: 12.5px; } .ck input { margin-right: 6px; } .x { border: 0; background: none; font-size: 16px; color: var(--ink-3); } .x:hover { color: var(--red); }
.drop { padding: 16px; border: 1.5px dashed var(--ink-3); text-align: center; font-size: 12.5px; margin-bottom: 6px; } .drop.over { border-color: var(--blue); background: var(--blue-2); } .lk { color: var(--blue); text-decoration: underline; cursor: pointer; }
.heat { display: grid; grid-template-columns: minmax(70px, 1.1fr) repeat(12, minmax(0, 1fr)); gap: 2px; font-size: 11px; align-items: stretch; } .heat .hh { font-size: 9.5px; letter-spacing: -.01em; color: var(--ink-3); text-align: center; padding: 2px 0; } .heat .hl { font-size: 11.5px; padding: 4px 4px 4px 0; align-self: center; } .heat .c { text-align: center; padding: 5px 0; font: 400 11px var(--mono); border: 1px solid var(--rule-2); }
.sel.sm button { padding: 2px 7px; font-size: 11.5px; }
.ivb { position: relative; display: block; height: 10px; background: var(--rule-2); }
.ivb i { position: absolute; top: 2px; height: 6px; background: rgba(29,58,168,.3); }
.ivb b { position: absolute; top: 0; width: 2px; height: 10px; margin-left: -1px; }
.scx { overflow-x: auto; }
table.rn { min-width: 760px; }
table.rn tr.on .ivb { background: rgba(255,255,255,.18); } table.rn tr.on .ivb i { background: rgba(201,210,255,.55); } table.rn tr.on .ivb b { background: var(--signal) !important; }
table.rn tr[data-i] { cursor: pointer; }
table.rn tr[data-i]:not(.on):hover td { background: var(--rule-2); }
table.rn tr.on td { background: var(--ink); color: var(--ground); }
table.rn tr.on .tag.red { border-color: #ff8b9b; color: #ff8b9b; }
table.rn tr[data-i]:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.tk { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
.tk button { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; padding: 4px 6px; border: 1px solid var(--ink); background: var(--panel); font: 400 11px var(--mono); text-align: left; }
.tk button small { color: var(--ink-3); font-size: 10px; }
.tk button.ok { background: var(--blue); border-color: var(--blue); color: #fff; }
.tk button.ok small { color: #c9d2ff; }
.tk button.bad { background: var(--red); border-color: var(--red); color: #fff; }
.tk button.bad small { color: #ffd0d7; }
.tk button[aria-pressed=true] { outline: 2px solid var(--signal, #e4ff3a); outline-offset: 1px; box-shadow: 0 0 0 3px var(--ink); } .lg { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--ink-2); margin-top: 4px; } .lg i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--rule); }
@media (max-width: 1000px) {
  #shell { height: auto !important; zoom: 1 !important; } .app { grid-template-columns: minmax(0, 1fr); } .rail { display: flex; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--rule); } .rail h2 { display: none; } .rail button { flex: none; width: auto; border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 11px 12px; } .rail button small { display: none; } .rail button[aria-selected=true] { border-bottom-color: var(--blue); }
  .dash { display: flex; flex-direction: column; } .pn { min-height: 240px; } .pb[data-draw] { min-height: 230px; } .ks { flex-wrap: wrap; } .k { flex: 1 1 45%; border-bottom: 1px solid var(--rule-2); } .bar .t { display: none; } .about p { right: auto; left: 0; }
}
</style>
</head>
<body>
<div id="shell">
<header class="bar"><a class="mark" href="build.html"><i></i>Scorcher Build</a><span class="t">Trial <b>geothermal-pilot-demo</b></span><span class="c">Concept · synthetic data · fixture agents</span><a class="b" href="build.html">Back to Build</a></header>
<div class="app">
  <nav class="rail" role="tablist" aria-label="Dashboards">
    <h2>Trial</h2>
    <button role="tab" data-v="overview" aria-selected="true">Overview</button>
    <button role="tab" data-v="agents" aria-selected="false">Agents and plans</button>
    <button role="tab" data-v="suites" aria-selected="false">Suites<small>4 domains</small></button>
    <h2>Task dashboards</h2>
    <button role="tab" data-v="resource" aria-selected="false">Resource estimate<small>ref</small></button>
    <button role="tab" data-v="gis" aria-selected="false">GIS screening<small>ref</small></button>
    <button role="tab" data-v="seismic" aria-selected="false">Seismic picks<small>judg.</small></button>
    <button role="tab" data-v="well" aria-selected="false">Well data<small>ref</small></button>
    <button role="tab" data-v="docs" aria-selected="false">Documents<small>ref</small></button>
    <button role="tab" data-v="mining" aria-selected="false">Mining: grade, tonnage<small>ref</small></button>
    <button role="tab" data-v="gisbench" aria-selected="false">GIS benchmark<small>phase 1</small></button>
    <button role="tab" data-v="runs" aria-selected="false">Agent runs<small>models</small></button>
    <h2>Set up</h2>
    <button role="tab" data-v="newtask" aria-selected="false">New task</button>
    <button role="tab" data-v="connect" aria-selected="false">Connect an agent</button>
    <h2>Trust</h2>
    <button role="tab" data-v="security" aria-selected="false">Security</button>
  </nav>
  <main>
    <section class="view on" id="v-overview"></section><section class="view" id="v-agents"></section><section class="view" id="v-resource"></section><section class="view" id="v-gis"></section><section class="view" id="v-seismic"></section><section class="view" id="v-well"></section><section class="view" id="v-docs"></section><section class="view" id="v-connect"></section><section class="view" id="v-suites"></section><section class="view" id="v-mining"></section><section class="view" id="v-gisbench"></section><section class="view" id="v-runs"></section><section class="view" id="v-newtask"></section><section class="view" id="v-security"></section>
  </main>
</div>
</div>
<script src="build-sample.js"></script>
<script src="gisbench-sample.js"></script>
<script>
(() => {
'use strict';
const S = window.BUILD_SAMPLE, $ = id => document.getElementById(id), f = (x, d = 1) => (+x).toFixed(d), pc = x => (x * 100).toFixed(0) + ' %', esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])), usd = (x, d = 4) => '$' + (+x).toFixed(d);
const BLUE = '#1d3aa8', RED = '#b8142f', INK = '#0d0f0e', MUTE = '#6f7571', GRID = 'rgba(13,15,14,.12)';
// seeded generator and Wilson interval: the same formulas as harness/stats.js
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const wilson = (k, n, z = 1.959964) => { const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return { rate: p, lo: k === 0 ? 0 : Math.max(0, c - h), hi: k === n ? 1 : Math.min(1, c + h) }; };
const short = n => n.replace(' (fixture)', '');

// layout helpers
const pn = (cls, title, hint, body, draw) => `<section class="pn ${cls}"><header><h3>${title}</h3>${hint ? `<span class="h">${hint}</span>` : ''}</header><div class="pb"${draw ? ` data-draw="${draw}"` : ''}>${body || ''}</div></section>`;
const vh = (title, cls, tags, about) => `<div class="vh"><h1>${title}</h1><span class="tag blue">${cls}</span>${tags.map(t => `<span class="tag ${t[1] || 'dim'}">${t[0]}</span>`).join('')}<details class="about"><summary>About this dashboard</summary><p>${about}</p></details></div>`;
const ks = items => `<div class="ks">${items.map(([v, l, col]) => `<div class="k"><b${col ? ` style="color:${col}"` : ''}>${v}</b><span title="${esc(l)}">${l}</span></div>`).join('')}</div>`;
const trace = steps => `<ol class="trace">${steps.map(s => `<li class="${s.bad ? 'bad' : ''}"><span class="tool">${esc(s.tool)}</span><span class="ms">${s.ms == null ? '' : s.ms + ' ms'}</span><span class="n">${esc(s.note)}</span></li>`).join('')}</ol>`;
const reviewHtml = id => `<div class="review" id="${id}"><button class="p" data-a="ok">Approve</button><button data-a="fix">Correct</button><button data-a="x">Reject</button></div>`;
function wireReview(id) { const box = $(id); if (!box) return; box.querySelectorAll('button').forEach(b => b.onclick = () => { box.querySelectorAll('button').forEach(x => x.classList.remove('on', 'x')); b.classList.add('on'); if (b.dataset.a === 'x') b.classList.add('x'); }); }
const DRAW = {};
const dprf = () => Math.min(3, (devicePixelRatio || 1) * (window.ZOOM || 1));
function fit() { const wide = innerWidth > 1000, Z = wide ? Math.max(1, Math.min(1.5, innerWidth / 1440, innerHeight / 900)) : 1, sh = $('shell'); window.ZOOM = Z; sh.style.zoom = Z; sh.style.height = wide ? (innerHeight / Z) + 'px' : ''; }   // scale the whole console to the screen, so a large display is used, not left empty
function drawActive() { document.querySelectorAll('.view.on [data-draw]').forEach(el => { const fn = DRAW[el.dataset.draw]; if (fn) fn(el, Math.max(120, el.clientWidth), Math.max(100, el.clientHeight)); }); }
const interval = (w, W = 110, H = 12) => `<svg class="mini" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="${GRID}"/><line x1="${w.lo * (W - 6) + 3}" x2="${w.hi * (W - 6) + 3}" y1="${H / 2}" y2="${H / 2}" stroke="${BLUE}" stroke-width="4"/><rect x="${w.rate * (W - 6) + 1}" y="1" width="4" height="${H - 2}" fill="${INK}"/></svg>`;

/* ================================================================ overview */
const views = {};
views.overview = {
  html() { const [a, b] = S.arms, p = S.pairs[0], n = S.nTasks, cats = Object.fromEntries(S.arms.map(x => [x.name, x.failures]));
    return vh('Trial overview', 'Reference-graded', [[`${n} tasks`], ['Resource estimate'], ['Synthetic example']], 'Did an agent do the work, and do we know it? Every rate carries its sample size and interval; two agents are compared on the same tasks. Two kinds of uncertainty appear in Scorcher Build and are never mixed: in the answer (P90 to P10, an interval on a temperature) from the engineering method; and in the score (the interval on a pass rate) from statistics over tasks.')
      + `<div class="verdict">On ${n} synthetic resource-estimate tasks, <b>${esc(short(a.name))}</b> passed ${pc(a.pass.rate)} (${pc(a.pass.lo)} to ${pc(a.pass.hi)}) and <b>${esc(short(b.name))}</b> ${pc(b.pass.rate)} (${pc(b.pass.lo)} to ${pc(b.pass.hi)}). Paired on the same tasks, the first is ahead by <b>${f(p.diff * 100, 0)} points</b> (${f(p.lo * 100, 0)} to ${f(p.hi * 100, 0)}); verdict: ${p.verdict}.<small>The current process (an engineer on the same tasks) is not measured in this example, so no claim is made about saving time or money.</small></div>`

  return `<table><tr><th>Field</th><th class="r">Key</th><th class="r">${esc(gbShort(gbArm))}</th><th>Check</th></tr>${ans ? F.map(([k, n, d]) => `<tr><td>${n}</td><td class="r m">${fmt(ex.key[k], d)}</td><td class="r m">${fmt(ans[k], d)}</td><td style="${r.checks[k] ? '' : 'color:' + RED + ';font-weight:600'}">${r.checks[k] ? 'within tolerance' : 'wrong'}</td></tr>`).join('') + `<tr><td>Mask agreement (IoU)</td><td class="r m">1.00</td><td class="r m">${f(r.iou, 2)}</td><td style="${r.checks.mask ? '' : 'color:' + RED + ';font-weight:600'}">${r.checks.mask ? 'within tolerance' : 'wrong'}</td></tr>` : '<tr><td colspan="4">No answer submitted</td></tr>'}</table>`
    + `<p class="note"><b>${r.pass ? 'Pass' : 'Fail'}.</b> ${r.hard_cells ? `<span style="color:${RED};font-weight:600">${r.hard_cells} cells delivered inside a protected area plus its buffer: a hard violation, whatever the totals.</span> ` : ''}${r.violations.length ? `Policy: ${r.violations.map(v => v.kind + ' (' + esc(v.detail) + ')').join(', ')}. ` : ''}Brief: ${esc(ex.statement.slice(0, 190))}...</p>`; }
function gbTrace(ex) { const r = ex.arms[gbArm].row; return trace(r.trace.map(t => ({ tool: t.tool + '  ' + t.hash, note: t.ok ? '' : t.error, ms: null, bad: !t.ok }))) + `<p class="note">${r.trace.length} calls, ${r.errors} refused. Each entry's hash includes the one before; editing any call breaks every later hash.</p>`; }
DRAW.gbmap = (el, W, H) => { const ex = GB.examples[gbEx], a = ex.arms[gbArm], n = ex.n, side = Math.max(100, Math.min(W, H) - 4), dpr = dprf();
  el.innerHTML = `<canvas style="width:${side}px;height:${side}px"></canvas><div class="lg">${gbMode === 'diff' ? '<span><i style="background:rgba(29,58,168,.45)"></i>both</span><span><i style="background:#b8142f"></i>arm only</span><span><i style="background:#e4ff3a"></i>key only</span>' : `<span><i style="background:rgba(29,58,168,.5)"></i>${gbMode === 'key' ? 'suitable (key)' : 'suitable (arm)'}</span>`}<span><i style="background:rgba(184,20,47,.18)"></i>no-go zone</span></div>`;
  const cv = el.querySelector('canvas'), c = cv.getContext('2d'); cv.width = side * dpr; cv.height = side * dpr; const k = cv.width / n, dem = u8(ex.dem), land = u8(ex.land), key = u8(ex.key_mask), hard = u8(ex.hard), am = a.mask ? u8(a.mask) : null;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const i = y * n + x, L = LCCOL[land[i]], sh = .86 + dem[i] / 255 * .14; c.fillStyle = `rgb(${L[0] * sh | 0},${L[1] * sh | 0},${L[2] * sh | 0})`; c.fillRect(x * k, y * k, k + .5, k + .5);
    if (bitAt(hard, i)) { c.fillStyle = 'rgba(184,20,47,.16)'; c.fillRect(x * k, y * k, k + .5, k + .5); }
    const kk = bitAt(key, i), aa = am ? bitAt(am, i) : 0;
    if (gbMode === 'key' && kk) c.fillStyle = 'rgba(29,58,168,.5)'; else if (gbMode === 'agent' && aa) c.fillStyle = 'rgba(29,58,168,.5)'; else if (gbMode === 'diff' && (kk || aa)) c.fillStyle = kk && aa ? 'rgba(29,58,168,.4)' : aa ? '#b8142f' : '#e4ff3a'; else continue; c.fillRect(x * k, y * k, k + .5, k + .5); }
  c.strokeStyle = INK; c.lineWidth = 1.2 * dpr; ex.protected.forEach(p => { c.beginPath(); p.ring.forEach(([x, y], j) => j ? c.lineTo(x * k, y * k) : c.moveTo(x * k, y * k)); c.closePath(); c.stroke(); c.fillStyle = INK; c.font = `600 ${10 * dpr}px Mona Sans, sans-serif`; c.fillText(p.designation, p.ring[0][0] * k + 3 * dpr, p.ring[0][1] * k + 11 * dpr); });
  c.setLineDash([6 * dpr, 4 * dpr]); c.beginPath(); ex.grid.forEach(([x, y], j) => j ? c.lineTo(x * k, y * k) : c.moveTo(x * k, y * k)); c.stroke(); c.setLineDash([]); };

/* ================================================================ Agent runs: each model run on gisbench, task by task (real output of gisbench/model_runner) */
let rnRun = 0, rnTask = 0, rnMode = 'diff';
const rnRuns = () => (GB && GB.runs) || [], rnName = r => `${r.model} · ${r.prompt}${r.engine === 'qgis' ? ' · QGIS' : ''}`, rnVer = r => `<span class="tag ${r.current ? 'dim' : 'red'}" title="${r.current ? 'current benchmark version' : 'an earlier benchmark version: see gisbench/README.md for what changed'}">v${r.version}</span>`, rnTest = r => /^test-/.test(r.model);
const rnSet = r => { const sd = r.rows.map(x => +x.task.split('-')[2]), lo = Math.min(...sd), hi = Math.max(...sd), rg = lo === hi ? `seed ${lo}` : `seeds ${lo}–${hi}`; return r.suite === 'injection' ? `Injection, ${rg}` : r.suite === 'hard' ? `Hard suite, ${rg}` : lo >= 5 ? `Held-out, ${rg}` : `Development, ${rg}`; };
const rnBar = (w, col) => `<span class="ivb" title="${pc(w.lo)} to ${pc(w.hi)}"><i style="left:${w.lo * 100}%;width:${Math.max(.6, (w.hi - w.lo) * 100)}%"></i><b style="left:${w.p * 100}%;background:${col || INK}"></b></span>`;
const unrle = (s, n) => { const b = u8(s), o = new Uint8Array(n * n); let k = 0; for (let i = 0; i < b.length; i += 2) { o.fill(b[i], k, k + b[i + 1]); k += b[i + 1]; } return o; };
const pv = p => p < .001 ? '< 0.001' : '= ' + f(p, 3);
const rnArgs = a => Object.entries(a || {}).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join('  ');
views.runs = {
  html() { const R = rnRuns();
    if (!R.length) return vh('Agent runs', 'Outcome-graded', [['No runs yet']], 'Each language-model run on the GIS benchmark, task by task.') + `<div class="verdict">No model run has been exported yet.<small>Run python3 -m gisbench.model_runner, then python3 -m gisbench.export_dashboard. Version 1 runs cannot be replayed (their traces carry no arguments) and are summarised in gisbench/README.md.</small></div>`;
    rnRun = Math.min(rnRun, R.length - 1); const r = R[rnRun]; rnTask = Math.min(rnTask, r.rows.length - 1); const t = r.rows[rnTask], wd = GB.worlds[t.task];
    const d0 = r.vs.d0, unsafe = r.rows.filter(x => !x.safe).length, spent = R.reduce((a, x) => a + x.usd, 0), P = d0.paired;
    const lead = `${esc(rnName(r))} passed <b>${r.pass.k} of ${r.pass.n}</b> (${pc(r.pass.lo)} to ${pc(r.pass.hi)}); the defaults pipeline passed <b>${d0.pass.k}</b> of the same tasks. ${P.only_b} task${P.only_b === 1 ? '' : 's'} only the agent passed, ${P.only_a} only the pipeline; exact McNemar p ${pv(P.mcnemar_p)}.`;
    return vh('Agent runs', 'Outcome-graded', [[`${R.length} run${R.length === 1 ? '' : 's'}`], [`benchmark v${GB.bench_version}`], ...(r.current ? [] : [[`showing a v${r.version} run`, 'red']]), ['Synthetic world'], rnTest(r) ? ['Test data', 'red'] : ['Real model']],
        'Every language-model run on the GIS site-screening benchmark. A run passes a task only if all five checks hold and nothing unsafe happened. Intervals are 95 % Wilson; the comparison with the defaults pipeline is paired on the same tasks (exact McNemar). The agent\'s map is rebuilt by replaying its recorded tool calls, which are deterministic; the replay is checked against the answer it submitted.')
      + ks([[R.length, 'Runs'], [usd(spent, 2), 'Model spend, all runs'], [`${r.pass.k}/${r.pass.n}`, 'Selected run: passed'], [unsafe, 'Selected run: unsafe tasks', unsafe ? RED : null], [`${r.vs.d1.pass.k}/${r.vs.d1.pass.n}`, 'Analyst pipeline, same tasks']])
      + `<div class="verdict">${lead}<small>${r.pass.n < 60 ? `${r.pass.n} tasks give wide intervals: read differences under about 25 points as unresolved. ` : ''}${rnTest(r) ? 'This run is test data made from a fixture policy, not a language model. ' : ''}${r.current ? '' : `Run on benchmark version ${r.version}, before the corrections listed in gisbench/README.md; not directly comparable with version ${GB.bench_version} runs. `}${rnSet(r)}.</small></div>`
      + `<div class="dash" style="grid-template-rows:none;grid-auto-rows:max-content;overflow:auto;align-content:start">`
      + pn('s12', 'Runs', 'pass = right and safe; bars show the 95 % interval on 0–100 %', `<div class="scx"><table class="rn"><tr><th>Run</th><th>Tasks</th><th class="r">Pass</th><th style="width:22%">Interval</th><th class="r">Defaults, same tasks</th><th class="r">Agent − defaults</th><th class="r">p</th><th class="r">Unsafe</th><th class="r">Cost</th></tr>${R.map((x, i) => `<tr data-i="${i}" class="${i === rnRun ? 'on' : ''}" tabindex="0"><td style="white-space:nowrap">${rnVer(x)} ${esc(rnName(x))}${rnTest(x) ? ' <span class="tag red">test</span>' : ''}</td><td>${rnSet(x)}</td><td class="r m">${x.pass.k}/${x.pass.n}</td><td>${rnBar(x.pass, BLUE)}</td><td class="r m">${x.vs.d0.pass.k}/${x.vs.d0.pass.n}</td><td class="r m">${x.vs.d0.paired.diff >= 0 ? '+' : ''}${f(x.vs.d0.paired.diff * 100, 0)} pts</td><td class="r m">${pv(x.vs.d0.paired.mcnemar_p).replace('= ', '')}</td><td class="r m" style="${x.rows.some(y => !y.safe) ? 'color:' + RED : ''}">${x.rows.filter(y => !y.safe).length}</td><td class="r m">${usd(x.usd, 3)}</td></tr>`).join('')}</table></div>`, '')
      + pn('s5', 'Tasks in this run', 'specification, data defect, seed; select one', `<div class="tk" id="rnTasks">${r.rows.map((x, i) => `<button data-i="${i}" aria-pressed="${i === rnTask}" class="${x.pass ? 'ok' : x.safe ? 'no' : 'bad'}" title="${esc(x.task)}: ${x.pass ? 'pass' : 'fail'}"><span>${x.spec} ${x.defect}</span><small>${x.task.split('-')[2]}</small></button>`).join('')}</div><div class="lg"><span><i style="background:${BLUE}"></i>pass</span><span><i style="background:#fff;border:1px solid var(--ink)"></i>wrong</span><span><i style="background:${RED}"></i>unsafe</span></div>`
        + `<p class="note">${r.rows.filter(x => x.pass).length} passed. Wrong fields: ${['suitable_area_ha', 'largest_parcel_ha', 'feasible', 'clear_sky_yield_gwh', 'mask'].map(k => `${k.replace(/_ha|_gwh/, '').replace(/_/g, ' ')} ${r.rows.filter(x => x.checks && !x.checks[k]).length}`).join(', ')}.</p>`, '')
      + pn('s7 r2', `Task ${esc(t.task)}`, 'the answer key against the agent; protected areas outlined, line dashed', `<div class="sel sm" id="rnMode">${[['key', 'Answer key'], ['agent', 'Agent mask'], ['diff', 'Difference']].map(([m, n]) => `<button data-m="${m}" aria-pressed="${m === rnMode}">${n}</button>`).join('')}</div><div data-draw="rnmap" style="height:min(520px,92vw);margin-top:4px"></div>`, '')
      + pn('s5', 'Answer against the key', 'area 1.5 %, yield 2 %, mask IoU 0.97', rnAnswer(t, wd), '')
      + pn('s12', 'Tool calls', `${t.calls} calls${t.errors ? `, ${t.errors} refused` : ''}${t.usd != null ? `, ${usd(t.usd, 4)}` : ''}; arguments as the agent sent them`, trace(t.trace.map(e => ({ tool: e.tool, note: e.ok ? rnArgs(e.args) : `${rnArgs(e.args)}  →  ${e.error}`, ms: null, bad: !e.ok }))), '')
      + `</div>`; },
  wire() { const re = () => render('runs'), q = s => document.querySelectorAll('#v-runs ' + s);
    q('table.rn tr[data-i]').forEach(tr => { const go = () => { rnRun = +tr.dataset.i; rnTask = 0; re(); }; tr.onclick = go; tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
    q('#rnTasks button').forEach(b => b.onclick = () => { rnTask = +b.dataset.i; re(); });
    q('#rnMode button').forEach(b => b.onclick = () => { rnMode = b.dataset.m; re(); }); } };
function rnAnswer(t, wd) { const a = t.answer || {}, k = t.key || {}, F = [['suitable_area_ha', 'Suitable area (ha)', 1], ['largest_parcel_ha', 'Largest parcel (ha)', 1], ['feasible', 'Feasible', 0], ['clear_sky_yield_gwh', 'Clear-sky yield (GWh)', 2]];
  const fmt = (v, d) => v == null ? '–' : typeof v === 'boolean' ? (v ? 'yes' : 'no') : f(v, d), dev = (x, y) => typeof x === 'number' && typeof y === 'number' && y ? ` <small>${x >= y ? '+' : ''}${f((x - y) / y * 100, 1)} %</small>` : '', bad = c => c ? '' : `color:${RED};font-weight:600`;
  return `<table><tr><th>Field</th><th class="r">Key</th><th class="r">Agent</th><th>Check</th></tr>${F.map(([n, l, d]) => `<tr><td>${l}</td><td class="r m">${fmt(k[n], d)}</td><td class="r m">${fmt(a[n], d)}${dev(a[n], k[n])}</td><td style="${bad(t.checks && t.checks[n])}">${t.checks && t.checks[n] ? 'within' : 'wrong'}</td></tr>`).join('')}<tr><td>Mask agreement (IoU)</td><td class="r m">1.00</td><td class="r m">${t.iou == null ? '–' : f(t.iou, 3)}</td><td style="${bad(t.checks && t.checks.mask)}">${t.checks && t.checks.mask ? 'within' : 'wrong'}</td></tr></table>`
    + `<p class="note"><b>${t.pass ? 'Pass' : 'Fail'}.</b> ${t.hard_cells ? `<span style="color:${RED};font-weight:600">${t.hard_cells} cells inside a protected area or its buffer.</span> ` : ''}${(t.violations || []).length ? `<span style="color:${RED}">Policy: ${t.violations.map(v => esc(v.kind + ' (' + v.detail + ')')).join(', ')}.</span> ` : ''}${t.replayed === false ? '<span style="color:' + RED + '">Replay did not reproduce the submitted answer; the map may not be the agent\'s.</span> ' : ''}${t.stop && t.stop !== 'end' ? `Stopped: ${esc(t.stop)}. ` : ''}</p><details class="about" style="margin-top:6px"><summary>Brief</summary><p>${esc(wd.statement)}</p></details>`; }
DRAW.rnmap = (el, W, H) => { const R = rnRuns(); if (!R.length) return; const t = R[rnRun].rows[rnTask], wd = GB.worlds[t.task], n = wd.n, side = Math.max(100, Math.min(W, H - 26) - 4), dpr = dprf();
  el.innerHTML = `<canvas style="width:${side}px;height:${side}px;display:block"></canvas><div class="lg">${rnMode === 'diff' ? '<span><i style="background:rgba(29,58,168,.45)"></i>both</span><span><i style="background:#b8142f"></i>agent only</span><span><i style="background:#e4ff3a"></i>key only</span>' : `<span><i style="background:rgba(29,58,168,.5)"></i>suitable (${rnMode === 'key' ? 'key' : 'agent'})</span>`}<span><i style="background:rgba(184,20,47,.18)"></i>protected area plus buffer</span>${t.mask ? '' : '<span style="color:' + RED + '">no agent mask</span>'}</div>`;
  const cv = el.querySelector('canvas'), c = cv.getContext('2d'); cv.width = side * dpr; cv.height = side * dpr; const k = cv.width / n, land = unrle(wd.land_rle, n), key = u8(wd.key_mask), hard = u8(wd.hard), am = t.mask ? u8(t.mask) : null;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const i = y * n + x, L = LCCOL[land[i]] || [220, 220, 220]; c.fillStyle = `rgb(${L[0]},${L[1]},${L[2]})`; c.fillRect(x * k, y * k, k + .5, k + .5);
    if (bitAt(hard, i)) { c.fillStyle = 'rgba(184,20,47,.16)'; c.fillRect(x * k, y * k, k + .5, k + .5); }
    const kk = bitAt(key, i), aa = am ? bitAt(am, i) : 0;
    if (rnMode === 'key' && kk) c.fillStyle = 'rgba(29,58,168,.5)'; else if (rnMode === 'agent' && aa) c.fillStyle = 'rgba(29,58,168,.5)'; else if (rnMode === 'diff' && (kk || aa)) c.fillStyle = kk && aa ? 'rgba(29,58,168,.4)' : aa ? '#b8142f' : '#e4ff3a'; else continue; c.fillRect(x * k, y * k, k + .5, k + .5); }
  c.strokeStyle = INK; c.lineWidth = 1.2 * dpr; wd.protected.forEach(p => { c.beginPath(); p.ring.forEach(([x, y], j) => j ? c.lineTo(x * k, y * k) : c.moveTo(x * k, y * k)); c.closePath(); c.stroke(); c.fillStyle = INK; c.font = `600 ${10 * dpr}px Mona Sans, sans-serif`; c.fillText(p.designation, p.ring[0][0] * k + 3 * dpr, p.ring[0][1] * k + 11 * dpr); });
  c.setLineDash([6 * dpr, 4 * dpr]); c.beginPath(); wd.grid.forEach(([x, y], j) => j ? c.lineTo(x * k, y * k) : c.moveTo(x * k, y * k)); c.stroke(); c.setLineDash([]); };

/* ================================================================ shell */
function render(id) { $('v-' + id).innerHTML = views[id].html(); views[id].wire(); drawActive(); }
const ids = Object.keys(views), tabs = [...document.querySelectorAll('.rail button')];
function show(v) { tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.v === v)); document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v)); render(v); try { history.replaceState(null, '', '#' + v); } catch {} }
tabs.forEach(t => t.onclick = () => show(t.dataset.v));
let timer; addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => { fit(); drawActive(); }, 120); });
fit();
show(ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
})();
