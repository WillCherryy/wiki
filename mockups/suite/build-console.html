<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorcher Build results</title>
<meta name="description" content="What Scorcher Build has measured: each discipline's tasks, how they are graded, how scripted pipelines and Claude did, why runs failed, and what the engines have been checked against.">
<style>
@font-face { font-family: 'Mona Sans'; src: url(fonts/mona-sans-latin.woff2) format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
:root { --ground: #f3f4f1; --panel: #fff; --ink: #0d0f0e; --ink-2: #444a46; --ink-3: #6a706c; --rule: rgba(13,15,14,.13); --rule-2: rgba(13,15,14,.07);
  --blue: #1d3aa8; --blue-2: #e6eafb; --red: #b8142f; --red-2: #f9e6ea; --green: #136c3a; --green-2: #e3f2e8; --amber: #8a5a00; --amber-2: #fbf1dc;
  --sans: 'Mona Sans', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--ground); color: var(--ink); font: 400 15.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.m { font-family: var(--mono); font-size: .9em; font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--ground) 94%, transparent); border-bottom: 1px solid var(--rule); backdrop-filter: blur(6px); }
.top .in { max-width: 1180px; margin: 0 auto; height: 60px; padding: 0 20px; display: flex; align-items: center; gap: 28px; }
.mark { display: flex; align-items: center; gap: 10px; font: 700 17px var(--sans); font-stretch: 122%; letter-spacing: -.02em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.mark i { width: 12px; height: 12px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
.mark span { font-weight: 450; font-stretch: 100%; color: var(--ink-3); }
.tabs { display: flex; gap: 2px; }
.tabs a { padding: 8px 12px; font-size: 14.5px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); } .tabs a[aria-current=page] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 560; }
.acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--ground); font-weight: 560; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--blue); border-color: var(--blue); } .btn.line { background: transparent; color: var(--ink); } .btn.line:hover { background: var(--ink); color: var(--ground); }

main { max-width: 1180px; margin: 0 auto; padding: 36px 20px 90px; }
h1 { font: 640 clamp(30px, 3.6vw, 44px)/1.05 var(--sans); font-stretch: 112%; letter-spacing: -.03em; }
h2 { font: 620 22px/1.2 var(--sans); font-stretch: 108%; letter-spacing: -.015em; margin: 44px 0 12px; display: flex; align-items: baseline; gap: 12px; }
h2 .n { font: 500 13px var(--mono); color: var(--ink-3); }
h3 { font: 620 16px/1.3 var(--sans); margin: 18px 0 6px; }
.lede { margin-top: 12px; font-size: 17.5px; color: var(--ink-2); max-width: 68ch; }
p { max-width: 74ch; } p + p { margin-top: 10px; }
.note { font-size: 13.5px; color: var(--ink-3); margin-top: 8px; max-width: 80ch; }

/* building blocks */
.kpis { margin-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--ink); background: var(--panel); }
.kpis div { padding: 16px 18px 18px; border-right: 1px solid var(--rule); } .kpis div:last-child { border-right: 0; }
.kpis b { display: block; font: 620 30px/1 var(--sans); font-stretch: 110%; letter-spacing: -.02em; } .kpis span { display: block; margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
.honest { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 400 12.5px var(--mono); padding: 3px 9px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); white-space: nowrap; max-width: 100%; }
.honest .chip { white-space: normal; }
.chip.live { border-color: var(--green); color: var(--green); background: var(--green-2); }
.chip.warn { border-color: #d9b46a; color: var(--amber); background: var(--amber-2); }
.chip.bad { border-color: #e2a3ae; color: var(--red); background: var(--red-2); }
.chip.ok { border-color: #a9b6ee; color: var(--blue); background: var(--blue-2); }
.read { margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.read div { background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px; font-size: 14px; color: var(--ink-2); }
.read b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1.5px solid var(--rule); padding: 16px 18px; color: inherit; text-decoration: none; }
.card:hover { border-color: var(--ink); }
.card h3 { margin: 0; font-size: 18px; font-stretch: 108%; letter-spacing: -.01em; }
.card p { font-size: 14px; color: var(--ink-2); }
.card .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13.5px; align-items: baseline; }
.card .row span { color: var(--ink-3); } .card .row b { font: 500 13.5px var(--mono); }
.card .go { margin-top: auto; padding-top: 6px; font: 500 13px var(--mono); color: var(--blue); }
.box { background: var(--panel); border: 1px solid var(--rule); padding: 18px 20px; }
.brief { border-left: 3px solid var(--ink); background: var(--panel); padding: 14px 18px; font-size: 15px; }
dl.kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 18px; font-size: 14.5px; }
dl.kv dt { color: var(--ink-3); font: 400 13px/1.6 var(--mono); } dl.kv dd { margin: 0; }
ul.plain { padding-left: 18px; } ul.plain li { margin: 3px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 12px var(--mono); color: var(--ink-3); padding: 0 12px 8px 0; border-bottom: 1.5px solid var(--ink); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
td.r, th.r { text-align: right; } td.num { font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
tr.grp td { padding-top: 18px; font-weight: 620; border-bottom: 1px solid var(--rule); }
.tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px 6px; }
.bar { position: relative; display: inline-block; width: 120px; height: 10px; background: var(--rule-2); vertical-align: middle; }
.bar i { position: absolute; top: 0; bottom: 0; background: rgba(29,58,168,.22); } .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--blue); }
.bar.red b { background: var(--red); } .bar.red i { background: rgba(184,20,47,.18); } .bar.grey b { background: var(--ink-3); } .bar.grey i { background: rgba(13,15,14,.1); }
.who { display: flex; flex-direction: column; } .who small { font-size: 12px; color: var(--ink-3); }
.takeaway { margin-top: 14px; padding: 12px 16px; background: var(--blue-2); color: #14246b; font-size: 15px; max-width: 86ch; }
.takeaway.warn { background: var(--amber-2); color: #5c3c00; }
.status { font: 500 12.5px var(--mono); white-space: nowrap; }
.s-verified { color: var(--blue); } .s-consistent { color: var(--ink-2); } .s-source { color: var(--amber); } .s-design { color: var(--red); } .s-FAILED { color: var(--red); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.filters button { border: 1px solid var(--rule); background: var(--panel); padding: 5px 11px; font-size: 13.5px; cursor: pointer; }
.filters button[aria-pressed=true] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.fails li { margin: 6px 0; font-size: 14px; } .fails code { font: 400 12.5px var(--mono); background: var(--ground); padding: 1px 5px; }
pre { background: #0f1211; color: #e9ece8; padding: 12px 14px; overflow-x: auto; font: 400 13px/1.5 var(--mono); margin-top: 8px; }

/* discipline page: list on the left */
.split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; align-items: start; }
.side { position: sticky; top: 80px; display: flex; flex-direction: column; }
.side .t { font: 500 12px var(--mono); color: var(--ink-3); margin-bottom: 8px; }
.side a { padding: 7px 10px; font-size: 14.5px; color: var(--ink-2); text-decoration: none; border-left: 2px solid var(--rule); display: flex; justify-content: space-between; gap: 6px; }
.side a:hover { color: var(--ink); border-left-color: var(--ink-3); } .side a[aria-current=page] { color: var(--ink); font-weight: 600; border-left-color: var(--blue); background: var(--panel); }
.side a small { font: 400 11px var(--mono); color: var(--green); }
.pick { display: none; }
.foot { margin-top: 70px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 20px; }
.foot a { color: var(--ink-2); }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  .tabs { display: none; } .acts .line { display: none; }
  .kpis { grid-template-columns: 1fr 1fr; } .kpis div:nth-child(2) { border-right: 0; } .kpis div:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
  .read { grid-template-columns: 1fr; } .split { grid-template-columns: minmax(0, 1fr); } .side { display: none; }
  .pick { display: block; width: 100%; padding: 10px 12px; margin-bottom: 18px; border: 1.5px solid var(--ink); background: var(--panel); font: 500 15px var(--sans); }
  dl.kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.kv dd { margin-bottom: 10px; }
  .mnav { display: flex !important; }
}
.mnav { display: none; gap: 4px; overflow-x: auto; padding: 0 20px 10px; max-width: 1180px; margin: 0 auto; }
.mnav a { padding: 6px 10px; font-size: 14px; color: var(--ink-2); text-decoration: none; border: 1px solid var(--rule); background: var(--panel); white-space: nowrap; }
.mnav a[aria-current=page] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="mark" href="build.html"><i></i>Scorcher <span>Build</span></a>
  <nav class="tabs" id="tabs"><a href="#overview">Overview</a><a href="#d/welltest">Disciplines</a><a href="#validation">Validation</a><a href="#runs">Model runs</a></nav>
  <div class="acts"><a class="btn line" href="build-paper.html">Paper</a><a class="btn" href="https://build.playscorcher.com/app">Run a test</a></div>
</div>
<nav class="mnav" id="mnav"><a href="#overview">Overview</a><a href="#d/welltest">Disciplines</a><a href="#validation">Validation</a><a href="#runs">Model runs</a></nav></header>
<main id="main"></main>
<script src="earthbench-sample.js"></script>
<script src="gisbench-sample.js"></script>
<script>
(() => {
'use strict';
const EB = window.EARTHBENCH, GB = window.GISBENCH, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pc = x => x == null ? '–' : `${Math.round(x * 100)}%`;
const bar = (w, cls = '') => w && w.n ? `<span class="bar ${cls}" title="${w.k} of ${w.n}; 95% interval ${pc(w.lo)} to ${pc(w.hi)}"><i style="left:${w.lo * 100}%;width:${Math.max(1, (w.hi - w.lo) * 100)}%"></i><b style="left:calc(${w.p * 100}% - 1px)"></b></span>` : '';
const model = id => id.replace(/^claude-/, 'Claude ').replace(/-(\d+)-(\d+)$/, ' $1.$2').replace(/\b(haiku|sonnet|opus)\b/, w => w[0].toUpperCase() + w.slice(1));
const KIND = { gt: 'grade-tonnage', pit: 'ultimate pit', welltest: 'well tests', hip: 'heat in place', buildup: 'buildups', yield: 'energy yield', aep: 'energy', qc: 'quality control', pick: 'horizon pick', campaign: 'campaign', well: 'well reports', permit: 'permits', pga: 'ground motion' };

/* ---------------------------------------------------------------- one model for every discipline */
const ORDER = ['welltest', 'geothermal', 'documents', 'mining', 'gis', 'hazard', 'solar', 'wind', 'seismic', 'scheduling'];
const JOB = {
  welltest: 'Interpret a pressure buildup: permeability, skin, whether a fault is seen, and the window used.',
  geothermal: 'Estimate heat in place and electrical capacity at P90, P50 and P10 from a temperature log.',
  documents: 'Read figures from well reports and permits, with revisions, amendments and field units.',
  mining: 'Grade and tonnage above the break-even cut-off, and the most valuable pit the walls allow.',
  gis: 'Screen land for a solar plant from a brief: slope, land cover, buffers, the largest parcel and its yield.',
  hazard: 'The ground motion with a 10% and a 2% chance of being exceeded in 50 years at a site.',
  solar: 'First-year energy, specific yield and performance ratio of a plant from a weather year.',
  wind: 'Gross and net annual energy, capacity factor and hub speed from a met-mast year.',
  seismic: 'Quality-control a SEG-Y survey and pick a horizon at the right polarity.',
  scheduling: 'Schedule a drilling campaign on three rigs to finish as early as possible.',
};
const LIVE = { welltest: true, documents: true };                              // run in the app today, graded on the server
const AREA = { mining: 'Mining', geothermal: 'Geothermal', welltest: 'Well tests', hazard: 'Seismic hazard', solar: 'Solar', wind: 'Wind', seismic: 'Seismic data', scheduling: 'Scheduling', documents: 'Documents' };
const total = P => Object.values(P.suites).reduce((a, s) => a + s.tasks, 0);
const armSum = (P, a) => { const out = { k: 0, n: 0 }; for (const s of Object.values(P.suites)) { const x = s.arms[a]; if (x) { out.k += x.pass.k; out.n += x.pass.n; } } return out; };
const mainArm = (P, a) => P.suites.main && P.suites.main.arms[a] ? P.suites.main.arms[a].pass : null;
// Kinds whose earlier model results no longer apply: retired (the geothermal Horner tasks) or graded with a key fixed since (mining pits,
// whose slope cone was corrected after the audit of 6 November 2026). A run that mixes kinds is split, so valid results stay visible.
const STALE = { geothermal: { welltest: 'Horner tasks, since retired' }, mining: { pit: 'pit tasks graded with the old slope key' } };
const wilson = (k, n) => { if (!n) return null; const z = 1.959964, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return { k, n, p, lo: Math.max(0, c - h), hi: Math.min(1, c + h) }; };
function modelRows(id, P) {
  const out = [];
  for (const m of P.models || []) {
    const kinds = Object.keys(m.by_kind || {}), stale = STALE[id] || {}, base = { label: model(m.model), usd: m.usd, fails: m.fails };
    if (!kinds.some(k => stale[k])) { out.push({ ...base, kind: kinds.length === 1 ? kinds[0] : null, rerun: !!m.subset, sub: `${m.suite} suite${m.subset ? ', ' + (KIND[m.subset] || m.subset) + ' only' : ''} · ${m.generated}`, pass: m.pass, correct: m.correct, n: m.tasks, restricted: m.restricted, retired: false }); continue; }
    for (const k of kinds) { const b = m.by_kind[k], old = stale[k];
      out.push({ ...base, kind: k, rerun: !!m.subset, usd: kinds.length > 1 ? null : m.usd, sub: `${m.suite} suite, ${KIND[k] || k} · ${m.generated}${old ? ' · ' + old : ''}`, pass: wilson(b.k, b.n), correct: b.correct, n: b.n, restricted: b.restricted,
        retired: !!old, fails: (m.fails || []).filter(f => f.task.includes('-' + k + '-')) }); }
  }
  // a kind re-run on its own (after a runner fix) supersedes that kind's rows in the original run
  for (const r of out) if (!r.rerun && r.kind && out.some(x => x.rerun && x.kind === r.kind)) { r.retired = true; r.sub += ' · superseded by the re-run'; }
  return out;
}
function disciplines() {
  const out = {};
  for (const [id, P] of Object.entries(EB.packs)) out[id] = {
    id, title: P.title === 'Geothermal resource' ? 'Geothermal resource' : P.title, job: JOB[id] || '', engine: P.engine, validated: P.validated, physics: P.physics || [], unsafe: P.unsafe,
    tasks: total(P), example: P.example, defects: P.defects, specs: P.specs, kinds: P.kinds, tools: P.tools,
    arms: { analyst: mainArm(P, 'd1'), recipe: mainArm(P, 'd0'), naive: mainArm(P, 'fx-naive') }, allArms: { analyst: armSum(P, 'd1'), recipe: armSum(P, 'd0'), naive: armSum(P, 'fx-naive') },
    models: modelRows(id, P),
    flags: { wrong: P.suites.main ? (P.suites.main.arms['fx-naive'] || {}).wrong_answers : null, caught: P.suites.main ? (P.suites.main.arms['fx-naive'] || {}).physics_flags_wrong : null },
    area: AREA[id], live: !!LIVE[id] };
  if (GB) {
    const arm = (suite, key) => { const a = (GB[suite] || { arms: [] }).arms.find(x => x.key === key); return a ? a.summary.pass : null; };
    const runs = (GB.runs || []).filter(r => r.model).map(r => ({ rerun: false, label: model(r.model), sub: `${r.suite} suite · ${String(r.generated || '').slice(0, 10)}${r.current === false ? ' · earlier benchmark version' : ''}`, pass: r.pass, correct: null, n: r.n_run, restricted: null, usd: r.usd, fails: [], retired: r.current === false }));
    out.gis = { id: 'gis', title: 'GIS site screening', job: JOB.gis, engine: 'Raster and vector operations in GDAL, cross-checked by a second engine running the same pipeline in QGIS 3.34 processing',
      validated: GB.engine ? `The two engines agree on all ${GB.engine.tasks} engine-check tasks: final masks overlap at least ${pc(GB.engine.min_iou)} (IoU), area within ${(GB.engine.max_area_rel_diff * 100).toFixed(1)}%` : '',
      physics: ['Area and parcel match the delivered map', 'Feasibility follows from the parcel', 'Yield bounded by capacity factor and clear-sky sunlight', 'No land on open water', 'Slope recomputed from elevations in metres'],
      unsafe: 'Land inside a protected buffer', tasks: ['main', 'hard', 'injection', 'stress'].reduce((a, s) => a + ((GB[s] || {}).nTasks || 0), 0),
      example: GB.examples && GB.examples[0] ? { id: GB.examples[0].id, brief: GB.examples[0].statement, docs: [], datasets: [] } : null, defects: ['crs', 'feet', 'nodata', 'invalid geometry', 'recoded legend', 'hand-typed codes'], specs: ['S1', 'S2', 'S3', 'S4'], tools: [],
      arms: { analyst: arm('main', 'd1'), recipe: arm('main', 'd0'), naive: arm('main', 'fx-naive') }, models: runs, area: null, live: false };
  }
  return out;
}
const D = disciplines();
const latestModel = d => { const ok = d.models.filter(m => !m.retired);
  return (d.id === 'gis' ? d.models.find(m => /^hard/.test(m.sub)) : null) || ok.find(m => m.rerun) || ok.slice(-1)[0] || null; };   // GIS: the hard suite is its representative run (made on benchmark version 4, labelled so)

/* ---------------------------------------------------------------- pages */
function overview() {
  const ids = ORDER.filter(id => D[id]), tasks = ids.reduce((a, id) => a + D[id].tasks, 0), L = EB.ledger || { rows: [] }, V = EB.validation;
  const ver = V ? V.rows.filter(r => r.status === 'verified').length : 0;
  const cards = ids.map(id => { const d = D[id], m = latestModel(d);
    return `<a class="card" href="#d/${id}"><h3>${esc(d.title)}</h3><p>${esc(d.job)}</p>
      <div class="row"><span>Tasks</span><b>${d.tasks}</b><span>Scripted analyst</span><b>${d.arms.analyst ? `${d.arms.analyst.k}/${d.arms.analyst.n}` : '–'}</b><span>Claude, latest run</span><b>${m && m.pass ? `${m.pass.k}/${m.pass.n} pass` : 'not run'}</b></div>
      <div class="honest">${d.live ? '<span class="chip live">Runs in the app</span>' : '<span class="chip">Local benchmark</span>'}</div><span class="go">Open →</span></a>`; }).join('');
  return `<h1>What Scorcher has measured</h1>
    <p class="lede">Scorcher tests AI agents on engineering tasks whose right answer is known, because a validated engine computed it. This page shows every discipline, how each is graded, and how well scripted pipelines and a real model did.</p>
    <div class="kpis"><div><b>${ids.length}</b><span>Disciplines</span></div><div><b>${tasks}</b><span>Tasks, each with a known answer</span></div><div><b>${L.entries || 0}</b><span>Model runs on record</span></div><div><b>${V ? `${ver}/${V.rows.length}` : '–'}</b><span>Engine decisions checked against something outside the code</span></div></div>
    <div class="honest"><span class="chip warn">Synthetic tasks, not real projects</span><span class="chip warn">One model tested so far (Claude Haiku)</span><span class="chip bad">No outside expert review yet</span><span class="chip ok">Audited 6 November 2026</span></div>
    <h2>How to read the results</h2>
    <div class="read"><div><b>Pass</b>The answer is within tolerance of the engine's key <em style="font-style:normal">and</em> nothing unsafe happened. Correct counts the answer alone.</div><div><b>Scripted pipelines</b>The analyst solves every task the right way, which proves the key. The fixed recipe and the naive pipeline make known mistakes, which proves the traps work.</div><div><b>Intervals</b>Bars show the 95% interval. With 24 to 48 tasks they are wide: small differences between agents cannot be told apart yet.</div></div>
    <h2>Disciplines</h2><div class="grid">${cards}</div>
    <h2>Latest model runs</h2>${runsTable((L.rows || []).slice(-5).reverse())}<p class="note"><a href="#runs">All runs →</a></p>`;
}

function runsTable(rows) {
  if (!rows.length) return '<p class="note">No model runs yet.</p>';
  return `<div class="tw"><table><tr><th>Discipline</th><th>Model</th><th>Run</th><th class="r">Pass</th><th class="r">Correct</th><th class="r">Cost</th><th>Record</th></tr>${rows.map(e => `<tr><td>${esc((D[e.pack] || {}).title || e.pack)}</td><td>${esc(model(e.model))}</td><td class="num">${esc(e.suite)} · ${esc((e.generated || '').slice(0, 10))}</td><td class="r num">${e.passed}/${e.tasks}</td><td class="r num">${e.correct ?? '–'}</td><td class="r num">$${(e.usd || 0).toFixed(2)}</td><td class="num" style="color:var(--ink-3)">#${e.seq} ${esc(e.hash.slice(0, 8))}</td></tr>`).join('')}</table></div>`;
}

function discipline(id) {
  const d = D[id]; if (!d) return `<p>No such discipline.</p>`;
  const ids = ORDER.filter(x => D[x]);
  const side = `<nav class="side"><div class="t">Disciplines</div>${ids.map(x => `<a href="#d/${x}"${x === id ? ' aria-current="page"' : ''}>${esc(D[x].title)}${D[x].live ? '<small>live</small>' : ''}</a>`).join('')}</nav>`;
  const pick = `<select class="pick" id="pick" aria-label="Discipline">${ids.map(x => `<option value="${x}"${x === id ? ' selected' : ''}>${esc(D[x].title)}</option>`).join('')}</select>`;
  const ex = d.example, m = latestModel(d);
  // 3. results table
  const row = (who, sub, w, correct, n, unsafe, cost, cls) => `<tr><td><div class="who"><b>${esc(who)}</b><small>${esc(sub)}</small></div></td><td class="r num">${w ? `${w.k}/${w.n}` : '–'}</td><td>${bar(w, cls)}</td><td class="r num">${correct == null ? '–' : `${correct}/${n}`}</td><td class="r num" style="${unsafe ? 'color:var(--red)' : ''}">${unsafe == null ? '–' : unsafe}</td><td class="r num">${cost == null ? '–' : '$' + cost.toFixed(2)}</td></tr>`;
  const res = `<div class="tw"><table><tr><th>Who</th><th class="r">Pass</th><th>95% interval</th><th class="r">Correct</th><th class="r">Unsafe or restricted</th><th class="r">Cost</th></tr>
    ${row('Scripted analyst', 'right method and parameters; proves the key', d.arms.analyst, null, null, null, null, 'grey')}
    ${row('Fixed recipe', 'one set of organisation defaults', d.arms.recipe, null, null, null, null, 'grey')}
    ${row('Naive pipeline', 'reads units and codes as written', d.arms.naive, null, null, null, null, 'grey')}
    ${d.models.map(x => row(x.label + (x.retired ? ' (earlier version)' : ''), x.sub, x.pass, x.correct, x.n, x.restricted, x.usd, x.retired ? 'grey' : '')).join('')}</table></div>
    <p class="note">Scripted rows are the main suite. Model rows are each run as recorded, split by task kind where part of a run no longer applies; "earlier version" rows were graded before a fix and are kept for the record. Cost is shown for a whole run only.</p>`;
  let take = '';
  if (m && m.pass) {
    const wrong = m.correct != null ? m.n - m.correct : null, ceiling = m.correct != null && m.correct / m.n >= 0.9;
    take = `<div class="takeaway${ceiling ? ' warn' : ''}">${esc(m.label)} passed ${m.pass.k} of ${m.pass.n}${m.correct != null ? `, with ${m.correct} of ${m.n} answers correct` : ''}${m.restricted ? `; ${m.restricted} run${m.restricted === 1 ? '' : 's'} failed on safety (a refused attempt on a restricted file)` : ''}.${ceiling ? ' A small model is close to the ceiling here, so this discipline does not yet separate strong agents from weak ones.' : ''}</div>`;
  } else take = `<div class="takeaway warn">No model has been run on this discipline yet.</div>`;
  // 4. failures
  const why = {}; for (const x of d.models.filter(x => !x.retired)) for (const f of x.fails || []) for (const w of f.why) { const c = /restricted/.test(w) ? 'Tried to open a restricted file (refused)' : /cut off/.test(w) ? 'Cut off by the runner (since fixed)' : /without an answer/.test(w) ? 'Ended without an answer' : 'Wrong value: ' + w.split(':')[0]; (why[c] = why[c] || []).push(f.task); }
  const fails = Object.keys(why).length ? `<ul class="fails">${Object.entries(why).sort((a, b) => b[1].length - a[1].length).map(([k, t]) => `<li><b>${esc(k)}</b>: ${t.length} run${t.length === 1 ? '' : 's'} <details style="display:inline"><summary style="display:inline;cursor:pointer;color:var(--blue);font-size:13px">tasks</summary> ${t.map(x => `<code>${esc(x)}</code>`).join(' ')}</details></li>`).join('')}</ul>` : '<p class="note">No failures recorded in the latest runs.</p>';
  // 5. validation
  const V = EB.validation, vr = V && d.area ? V.rows.filter(r => r.area === d.area) : [];
  const val = d.id === 'gis' ? `<p>${esc(d.validated)}. This is an independent implementation check: the strongest kind in the suite. Not yet compared with external reference data.</p>`
    : vr.length ? `<div class="tw"><table><tr><th>Decision</th><th>Evidence</th><th>Status</th></tr>${vr.map(r => `<tr><td>${esc(r.decision)}</td><td>${esc(r.basis)}</td><td class="status s-${r.status.split(' ')[0]}">${esc(r.status)}</td></tr>`).join('')}</table></div><p class="note">${esc(d.validated)}. <a href="#validation">The full register →</a></p>` : `<p>${esc(d.validated)}</p>`;
  // 6. try
  const cmd = d.id === 'gis' ? 'python -m gisbench.model_runner --model claude-haiku-5-5 --suite hard --prompt method --max-usd 1 --yes' : `python -m earthbench.run --model claude-haiku-5-5 --pack ${d.id} --suite main --max-usd 1 --yes`;
  const tryIt = d.live ? `<p>These tasks run in the web app: sign in, pick one, and run Scorcher's agent or connect your own over MCP. The app grades on the server with the same key and checks.</p><p style="margin-top:12px"><a class="btn" href="https://build.playscorcher.com/app">Run a ${esc(d.title.toLowerCase())} task</a></p><h3>Or from a terminal</h3><pre>${esc(cmd)}</pre>`
    : `<p>This discipline runs from a terminal today; it is not yet in the web app.</p><pre>${esc(cmd)}</pre><p class="note">Any MCP agent can also work one task: <code>python -m earthbench.mcp_server --task ${esc(ex ? ex.id : '')}</code></p>`;
  return `<div class="split">${side}<div>${pick}
    <p class="note" style="margin:0 0 6px"><a href="#overview">Overview</a> / Disciplines</p>
    <h1>${esc(d.title)}</h1><p class="lede">${esc(d.job)}</p>
    <div class="honest">${d.live ? '<span class="chip live">Runs in the app</span>' : '<span class="chip">Local benchmark</span>'}<span class="chip">${d.tasks} tasks</span>${m && m.correct != null && m.correct / m.n >= .9 ? '<span class="chip warn">Near the ceiling for a small model</span>' : ''}</div>
    <h2><span class="n">1</span>The task</h2>
    ${ex ? `<div class="brief">${esc(ex.brief)}</div><p class="note">Example task <span class="m">${esc(ex.id)}</span>${ex.docs && ex.docs.length ? ` · documents: ${ex.docs.map(esc).join(', ')}` : ''}${ex.datasets && ex.datasets.length ? ` · data: ${ex.datasets.map(esc).join(', ')}` : ''}</p>` : ''}
    <dl class="kv" style="margin-top:16px"><dt>Data traps</dt><dd>${(d.defects || []).map(x => `<span class="chip">${esc(String(x).replace(/_/g, ' '))}</span>`).join(' ')}</dd><dt>Brief levels</dt><dd>${d.id === 'gis' ? 'S1 to S4, from explicit to spread over several documents' : 'L1 everything stated in SI; L2 mixed units and plain words; L3 in documents, beside a superseded one'}</dd>${d.tools && d.tools.length ? `<dt>Tools the agent gets</dt><dd>${d.tools.map(t => `<span class="chip" title="${esc(t.description)}">${esc(t.name)}</span>`).join(' ')}</dd>` : ''}</dl>
    <h2><span class="n">2</span>How it is graded</h2>
    <dl class="kv"><dt>Answer key</dt><dd>${esc(d.engine)}</dd><dt>Counts as unsafe</dt><dd>${esc(d.unsafe)}, whatever the totals</dd><dt>Checks with no key</dt><dd><ul class="plain">${d.physics.map(x => `<li>${esc(x)}</li>`).join('')}</ul><span class="note">Reported beside the grade, never part of it. They catch impossible or inconsistent answers, not every wrong one${d.flags && d.flags.wrong ? `: on the naive pipeline they flagged ${d.flags.caught} of ${d.flags.wrong} wrong answers` : ''}.</span></dd></dl>
    <h2><span class="n">3</span>How well it is solved</h2>${res}${take}
    <h2><span class="n">4</span>Why Claude's runs failed</h2>${fails}
    <h2><span class="n">5</span>What the engine has been checked against</h2>${val}
    <h2><span class="n">6</span>Try it</h2>${tryIt}
  </div></div>`;
}

let vf = 'all';
function validation() {
  const V = EB.validation; if (!V) return '<p>Run python -m earthbench.validation, then python -m earthbench.export.</p>';
  const n = s => V.rows.filter(r => r.status === s).length, rows = V.rows.filter(r => vf === 'all' || r.status === vf);
  let area = '';
  return `<h1>Is the physics right?</h1>
    <p class="lede">Every modelling decision in Scorcher's engines, the evidence behind it, and the automated check that ran. Only evidence from outside the code counts as verified.</p>
    <div class="kpis"><div><b>${n('verified')}</b><span>Verified: agrees with a published value, a standard, an analytical solution or independent code</span></div><div><b>${n('consistent')}</b><span>Consistency only: the code agrees with itself or a formula typed from a paper</span></div><div><b>${n('source only')}</b><span>Backed by a source, with no automated check yet</span></div><div><b>${n('design choice')}</b><span>Judgements with no published source, for expert review</span></div></div>
    <div class="honest"><span class="chip bad">No engine compared with external reference data yet (PEER, MineLib, SAM or PVGIS, field tests)</span><span class="chip bad">No outside expert review yet</span></div>
    <div class="filters">${[['all', 'All'], ['verified', 'Verified'], ['consistent', 'Consistency only'], ['source only', 'Source only'], ['design choice', 'Design choices']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${vf === k}">${l}</button>`).join('')}</div>
    <div class="tw"><table><tr><th style="width:44%">Decision</th><th>Evidence</th><th>Status</th><th style="width:30%">What the check showed</th></tr>${rows.map(r => (r.area !== area ? `<tr class="grp"><td colspan="4">${esc(area = r.area)}</td></tr>` : '') + `<tr><td>${esc(r.decision)}</td><td>${esc(r.basis)}</td><td class="status s-${r.status.split(' ')[0]}">${esc(r.status)}</td><td style="font-size:13px;color:var(--ink-2)">${esc(r.status === 'design choice' ? 'No published source: listed for expert review' : r.detail)}</td></tr>`).join('')}</table></div>
    <p class="note">Generated ${esc(V.generated)} by <span class="m">python -m earthbench.validation</span>. The paper explains each kind of evidence; the audit of 6 November 2026 explains why consistency checks no longer count as verified.</p>`;
}

function runs() {
  const L = EB.ledger || { rows: [] };
  return `<h1>Model runs</h1>
    <p class="lede">Every model run on the benchmark packs, oldest first, as recorded in the results ledger. Each line carries the hash of its results and records and is chained to the line before, so an edited line shows.</p>
    <div class="honest"><span class="chip">${L.entries || 0} runs</span><span class="chip ${L.intact ? 'ok' : 'bad'}">${L.intact ? 'Chain intact' : 'Chain broken'}</span><span class="chip warn">Not signed or anchored outside the repository yet</span></div>
    <div style="margin-top:18px">${runsTable([...(L.rows || [])])}</div>
    <p class="note">Runs marked backfilled were made before the ledger existed. Mining pit results and geothermal well-test results predate fixes made after the audit of 6 November 2026.</p>`;
}

/* ---------------------------------------------------------------- router */
function route() {
  const h = location.hash.slice(1) || 'overview', [page, arg] = h.split('/');
  const html = page === 'd' ? discipline(arg || 'welltest') : page === 'validation' ? validation() : page === 'runs' ? runs() : overview();
  $('#main').innerHTML = html + `<div class="foot"><span>Results exported ${esc(EB.generated)} from the repository</span><a href="build-paper.html">The paper</a><a href="build-concept.html">Concept views (sample data)</a><a href="build.html">Scorcher Build</a></div>`;
  const cur = page === 'd' ? '#d/welltest' : '#' + (['validation', 'runs'].includes(page) ? page : 'overview');
  document.querySelectorAll('#tabs a, #mnav a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === cur ? 'page' : 'false'));
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => { vf = b.dataset.f; route(); });
  const p = $('#pick'); if (p) p.onchange = () => { location.hash = 'd/' + p.value; };
  document.title = page === 'd' && D[arg] ? `${D[arg].title} · Scorcher Build results` : 'Scorcher Build results';
  if (!route.first) scrollTo(0, 0); route.first = false;
}
route.first = true; addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
