<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scorcher Build</title>
<meta name="description" content="Run AI agents on engineering tasks with known answers, watch every step, and inspect each answer against the engine's key.">
<style>
@font-face { font-family: 'Mona Sans'; src: url(fonts/mona-sans-latin.woff2) format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
:root { color-scheme: light;
  --bg: #fafaf9; --surface: #ffffff; --sunk: #f3f3f1; --line: #e6e6e3; --line-2: #efefec; --ink: #141619; --ink-2: #50565d; --ink-3: #82888f;
  --accent: #1d3aa8; --accent-ink: #ffffff; --accent-2: #eef1fb; --pass: #18794e; --pass-2: #e7f4ec; --fail: #c4253c; --fail-2: #fbeaed; --unsafe: #b4510c; --unsafe-2: #fdf0e6; --unv: #8a5a00; --unv-2: #fbf3e2;
  --sans: 'Mona Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; --r: 6px; --r2: 8px; --t: 160ms cubic-bezier(.2,.8,.2,1); --side: 232px; }
:root[data-theme=dark] { color-scheme: dark;
  --bg: #0e0f11; --surface: #16181b; --sunk: #111315; --line: #26292d; --line-2: #1d2023; --ink: #ecedee; --ink-2: #a5abb2; --ink-3: #747a81;
  --accent: #8ea2ff; --accent-ink: #0e0f11; --accent-2: #1b2240; --pass: #4cc38a; --pass-2: #11261b; --fail: #ff6b81; --fail-2: #2d1418; --unsafe: #ff9a4d; --unsafe-2: #2b1a0d; --unv: #e0b252; --unv-2: #272010; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { color-scheme: dark;
  --bg: #0e0f11; --surface: #16181b; --sunk: #111315; --line: #26292d; --line-2: #1d2023; --ink: #ecedee; --ink-2: #a5abb2; --ink-3: #747a81;
  --accent: #8ea2ff; --accent-ink: #0e0f11; --accent-2: #1b2240; --pass: #4cc38a; --pass-2: #11261b; --fail: #ff6b81; --fail-2: #2d1418; --unsafe: #ff9a4d; --unsafe-2: #2b1a0d; --unv: #e0b252; --unv-2: #272010; } }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans); font-stretch: 100%; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.mono, code { font-family: var(--mono); font-size: 12px; }
[hidden] { display: none !important; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; z-index: 99; background: var(--surface); padding: 8px 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 600; font-size: 14px; color: var(--ink); } .brand:hover { text-decoration: none; }
.brand i { width: 13px; height: 13px; border-radius: 3px; background: linear-gradient(90deg, #1d3aa8 50%, #b8142f 50%); } .brand span { color: var(--ink-3); font-weight: 400; }
.search { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink-3); cursor: pointer; font-size: 13px; text-align: left; }
.search:hover { border-color: var(--ink-3); } .search kbd { margin-left: auto; }
kbd { white-space: nowrap; font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-3); background: var(--surface); }
.nv { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r); color: var(--ink-2); font-weight: 450; }
.nv:hover { background: var(--sunk); color: var(--ink); text-decoration: none; } .nv[aria-current=page] { background: var(--sunk); color: var(--ink); font-weight: 550; }
.nv small { margin-left: auto; font: 400 11px var(--mono); color: var(--ink-3); }
.nv .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--unv); }
.grp { margin: 16px 0 4px; padding: 0 10px; font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; }
.side .rr { display: block; padding: 6px 10px; border-radius: var(--r); color: var(--ink-2); font-size: 13px; }
.side .rr:hover { background: var(--sunk); text-decoration: none; } .side .rr span { float: right; font: 400 11.5px var(--mono); color: var(--ink-3); }
.side .foot { margin-top: auto; padding: 10px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.main { min-width: 0; }
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.crumb { color: var(--ink-3); font-size: 13px; } .crumb b { color: var(--ink); font-weight: 550; } .crumb a { color: var(--ink-2); }
.bar .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.bar .menu { display: none; }
.pg { padding: 28px 28px 120px; max-width: 1400px; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
h2 { font-size: 16px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 14px; font-weight: 550; }
.sub { color: var(--ink-2); margin-top: 4px; }
.muted { color: var(--ink-3); }
.sec { margin-top: 32px; } .sec > h2 { margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; } .sec > h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); }
.ph { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pb { padding: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background var(--t), border-color var(--t); }
.btn:hover { border-color: var(--ink-3); text-decoration: none; } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.pri:hover { filter: brightness(1.08); }
.btn.lg { height: 38px; padding: 0 18px; font-size: 14px; }
.btn.q { border-color: transparent; background: transparent; color: var(--ink-2); } .btn.q:hover { background: var(--sunk); color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 5px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); font-weight: 550; box-shadow: 0 0 0 1px var(--line); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 16px; }
.tabs button { border: 0; background: none; padding: 11px 10px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--ink-3); cursor: pointer; font-weight: 500; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); } .tabs button small { font: 400 11px var(--mono); margin-left: 6px; color: var(--ink-3); }
input[type=text], input[type=number], input[type=search], select, textarea { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 6px 9px; font-size: 13px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.5; } textarea.code { font: 400 12px/1.5 var(--mono); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
.field { display: grid; gap: 4px; } .field > span { font-size: 12px; color: var(--ink-2); }
.err { color: var(--fail); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.tag { font: 400 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--ink-2); }

/* status: word and glyph, never colour alone */
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 550; font-size: 12.5px; white-space: nowrap; }
.st::before { font: 600 11px var(--mono); }
.st.pass { color: var(--pass); } .st.pass::before { content: '✓'; }
.st.fail { color: var(--fail); } .st.fail::before { content: '✕'; }
.st.unsafe { color: var(--unsafe); } .st.unsafe::before { content: '▲'; }
.st.unv { color: var(--unv); } .st.unv::before { content: '◇'; }
.st.wait { color: var(--ink-3); } .st.wait::before { content: '○'; }
.st.run { color: var(--accent); } .st.run::before { content: '●'; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.sim { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; background: var(--unv-2); color: var(--unv); font: 500 11.5px var(--mono); }
.sim::before { content: '◇'; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r2); border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.banner.sim { display: flex; font: 400 13px var(--sans); border-color: color-mix(in srgb, var(--unv) 40%, var(--line)); background: var(--unv-2); color: var(--ink); }
.banner.sim::before { content: none; } .banner.sim b { color: var(--unv); }

/* stats and bars */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); }
.stat { padding: 14px 16px; border-right: 1px solid var(--line-2); } .stat:last-child { border-right: 0; }
.stat span { display: block; font-size: 12px; color: var(--ink-3); } .stat b { display: block; margin-top: 2px; font: 500 20px/1.25 var(--mono); letter-spacing: -.01em; }
.stat b.big { font-size: 28px; } .stat b small { font-size: 13px; color: var(--ink-3); font-weight: 400; } .stat em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ib { position: relative; display: inline-block; width: 120px; height: 10px; vertical-align: middle; }
.ib::before { content: ''; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); }
.ib i { position: absolute; top: 2px; height: 6px; background: color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 2px; }
.ib b { position: absolute; top: 0; width: 2px; height: 10px; background: var(--accent); }
.ib.grey i { background: color-mix(in srgb, var(--ink-3) 25%, transparent); } .ib.grey b { background: var(--ink-3); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
.tb th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.tb th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; } .tb th button::after { content: attr(data-dir); margin-left: 4px; }
.tb td { padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tb tr:last-child td { border-bottom: 0; }
.tb tr.cl { cursor: pointer; } .tb tr.cl:hover td { background: var(--sunk); } .tb tr[aria-selected=true] td { background: var(--accent-2); }
.tb td.r, .tb th.r { text-align: right; } .tb td.id { font: 400 12px var(--mono); white-space: nowrap; }
.tb td.ck, .tb th.ck { width: 36px; padding-right: 0; }

/* run screen */
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.opt { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--ink-3); } .opt[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-2); }
.opt b { font-weight: 550; } .opt span { font-size: 12px; color: var(--ink-3); }
.disc { display: grid; grid-template-columns: 24px minmax(0, 1.4fr) minmax(0, 1.2fr) auto 70px; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line-2); }
.disc:last-child { border-bottom: 0; } .disc .t b { font-weight: 550; } .disc .t p { font-size: 12.5px; color: var(--ink-3); }
.disc .k { display: flex; flex-wrap: wrap; gap: 4px; } .disc .n { text-align: right; font: 400 12.5px var(--mono); color: var(--ink-2); }
.sector { padding: 10px 16px 6px; font-size: 12px; color: var(--ink-3); background: var(--sunk); border-bottom: 1px solid var(--line-2); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.filters input[type=search] { flex: 1 1 220px; }
.pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.pager .sp { margin-left: auto; }
.dock { position: fixed; left: var(--side); right: 0; bottom: 0; z-index: 25; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 28px; background: var(--surface); border-top: 1px solid var(--line); }
.dock .sum { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); } .dock .sum b { font: 500 14px var(--mono); color: var(--ink); }
.dock .r { margin-left: auto; display: flex; gap: 8px; }
.ffields { display: grid; gap: 6px; } .frow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 110px 120px 32px; gap: 6px; align-items: center; }

/* live */
.safety { position: sticky; top: 52px; z-index: 15; display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); overflow: hidden; margin-top: 14px; }
.safety div { flex: 1; padding: 9px 14px; border-right: 1px solid var(--line-2); font-size: 12px; color: var(--ink-3); } .safety div:last-child { border-right: 0; }
.safety b { display: block; font: 500 16px var(--mono); color: var(--ink); } .safety div.hot { background: var(--unsafe-2); } .safety div.hot b { color: var(--unsafe); }
.live { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.queue { max-height: calc(100vh - 230px); overflow-y: auto; }
.qi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.qi:hover { background: var(--sunk); } .qi[aria-current=true] { background: var(--accent-2); } .qi .id { font: 400 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .qi small { grid-column: 1 / -1; color: var(--ink-3); font-size: 12px; }
.tl { list-style: none; padding: 0; }
.tl li { display: grid; grid-template-columns: 56px 18px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.tl .tm { font: 400 11.5px var(--mono); color: var(--ink-3); text-align: right; padding-top: 1px; }
.tl .g { font: 600 11px var(--mono); padding-top: 2px; } .tl .g.ok { color: var(--pass); } .tl .g.no { color: var(--fail); } .tl .g.un { color: var(--unsafe); } .tl .g.ev { color: var(--accent); }
.tl .x b { font: 500 12.5px var(--mono); } .tl .x .a { display: block; font: 400 11.5px/1.45 var(--mono); color: var(--ink-3); word-break: break-word; }
.prog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); transition: width var(--t); }

/* inspector */
.kv td, .kv th { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line-2); text-align: left; font-size: 13px; vertical-align: top; } .kv th { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.kv td.v { font: 400 12.5px var(--mono); word-break: break-word; }
.brief { white-space: pre-wrap; line-height: 1.6; font-size: 13.5px; }
details.call { border-bottom: 1px solid var(--line-2); } details.call summary { display: grid; grid-template-columns: 28px 18px minmax(0, 1fr) auto; gap: 8px; padding: 7px 0; cursor: pointer; list-style: none; font: 400 12.5px var(--mono); }
details.call summary::-webkit-details-marker { display: none; } details.call .body { padding: 0 0 10px 54px; font: 400 11.5px/1.5 var(--mono); color: var(--ink-2); word-break: break-word; }
details.call .body div + div { margin-top: 4px; }

/* viewers */
.vw { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; }
.vw-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line-2); }
.vw-h b { font-weight: 550; } .vw-p { font: 400 11.5px var(--mono); color: var(--ink-3); flex-basis: 100%; }
.mark.sim, .mark.eng { font: 500 11px var(--mono); padding: 1px 7px; border-radius: 4px; } .mark.sim { background: var(--unv-2); color: var(--unv); } .mark.eng { background: var(--pass-2); color: var(--pass); }
.mark.sim::before { content: none; }
.vw-t { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }
.vw-l { display: flex; flex-wrap: wrap; gap: 4px 14px; } .vw-l label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.vw-b { margin-left: auto; display: flex; gap: 4px; } .vw-b button { height: 26px; min-width: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; font-size: 12px; }
.vw-c { position: relative; } .vw-c canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.vw-r { position: absolute; left: 10px; top: 8px; font: 400 11.5px var(--mono); color: var(--ink); background: color-mix(in srgb, var(--surface) 88%, transparent); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.vw-r:empty { display: none; }
.vw-sim { position: absolute; right: 10px; bottom: 8px; font: 500 11px var(--mono); color: var(--unv); background: var(--unv-2); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.vw-g { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 14px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line-2); } .vw-g i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.checks { list-style: none; padding: 0; } .checks li { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; } .checks li p { color: var(--ink-3); font: 400 12px var(--mono); }

/* sheet and palette */
.scrim { position: fixed; inset: 0; background: rgba(10,12,14,.32); z-index: 50; animation: fade var(--t); } @keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 51; background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; animation: slide var(--t); }
@keyframes slide { from { transform: translateX(16px); opacity: .6; } }
.sheet-h { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 1; }
.pal { position: fixed; z-index: 60; top: 12vh; left: 50%; transform: translateX(-50%); width: min(620px, 94vw); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,.18); overflow: hidden; animation: fade var(--t); }
.pal input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; font-size: 15px; outline: none; }
.pal ul { list-style: none; padding: 6px; max-height: 50vh; overflow-y: auto; }
.pal li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r); cursor: pointer; } .pal li[aria-selected=true] { background: var(--sunk); }
.pal li .k { font: 400 11px var(--mono); color: var(--ink-3); width: 64px; flex: none; }
.empty { padding: 32px 16px; text-align: center; color: var(--ink-3); }
