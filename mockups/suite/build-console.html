<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorcher Build console — concept mockup</title>
<style>
@font-face { font-family: 'Mona Sans'; src: url(fonts/mona-sans-latin.woff2) format('woff2'); font-weight: 200 900; font-stretch: 75% 125%; font-display: swap; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/geist-mono-latin.woff2) format('woff2'); font-weight: 400 500; font-display: swap; }
:root { --ground: #eef0ec; --panel: #fff; --ink: #0d0f0e; --ink-2: #474c49; --ink-3: #6f7571; --rule: rgba(13, 15, 14, .16); --rule-2: rgba(13, 15, 14, .08);
  --blue: #1d3aa8; --blue-2: #e3e8fb; --red: #b8142f; --red-2: #f8e3e7; --signal: #e4ff3a; --sans: 'Mona Sans', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
* { box-sizing: border-box; margin: 0; }
html { overflow-x: clip; }
body { background: var(--ground); color: var(--ink); font: 400 13px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--ink); color: var(--signal); } :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
a { color: inherit; }

/* app shell: on a desktop the whole thing is exactly the window; panels scroll inside themselves, never the page */
.bar { display: flex; align-items: center; gap: 18px; height: 40px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.mark { display: flex; align-items: center; gap: 8px; font: 700 14px var(--sans); font-stretch: 125%; letter-spacing: -.02em; text-decoration: none; }
.mark i { width: 11px; height: 11px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
.bar .t { font: 400 12px var(--mono); color: var(--ink-2); } .bar .t b { color: var(--ink); font-weight: 500; }
.bar .c { margin-left: auto; font: 400 11.5px var(--mono); padding: 3px 8px; background: var(--ink); color: var(--ground); } .bar a.b { font-size: 12.5px; color: var(--ink-2); }
#shell { display: flex; flex-direction: column; height: 100vh; }
.app { display: grid; grid-template-columns: 176px minmax(0, 1fr); flex: 1; min-height: 0; }
.rail { background: var(--panel); border-right: 1px solid var(--rule); padding: 10px 0; overflow: auto; }
.rail h2 { padding: 8px 14px 3px; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.rail button { display: flex; width: 100%; align-items: baseline; gap: 6px; padding: 6px 14px; border: 0; border-left: 3px solid transparent; background: none; text-align: left; font-size: 13px; color: var(--ink-2); }
.rail button:hover { background: var(--rule-2); color: var(--ink); } .rail button[aria-selected=true] { color: var(--ink); font-weight: 600; border-left-color: var(--blue); background: var(--blue-2); }
.rail button small { margin-left: auto; font: 400 10.5px var(--mono); color: var(--ink-3); }
main { padding: 10px 12px 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { display: none; min-height: 0; } .view.on { display: flex; flex-direction: column; flex: 1; gap: 8px; }

.vh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; }
.vh h1 { font-size: 19px; font-weight: 640; font-stretch: 112%; letter-spacing: -.02em; margin-right: 6px; }
.tag { display: inline-flex; padding: 2px 7px; border: 1px solid var(--ink); font: 400 11px var(--mono); white-space: nowrap; } .tag.blue { background: var(--blue); border-color: var(--blue); color: #fff; } .tag.red { border-color: var(--red); color: var(--red); } .tag.dim { border-color: var(--rule); color: var(--ink-2); }
.about { margin-left: auto; position: relative; } .about summary { cursor: pointer; font-size: 12px; color: var(--ink-2); list-style: none; padding: 2px 8px; border: 1px solid var(--rule); background: var(--panel); } .about p { position: absolute; right: 0; top: 26px; width: min(460px, 80vw); background: var(--panel); border: 1px solid var(--ink); padding: 10px 12px; font-size: 12.5px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.ks { display: flex; background: var(--panel); border: 1px solid var(--rule); } .k { flex: 1; min-width: 0; padding: 6px 12px; border-right: 1px solid var(--rule-2); } .k:last-child { border-right: 0; } .k b { display: block; font: 500 16px/1.25 var(--mono); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .k span { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel { display: flex; flex-wrap: wrap; gap: 4px; } .sel button { padding: 3px 9px; border: 1px solid var(--rule); background: var(--panel); font-size: 12px; } .sel button[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--ground); }
.verdict { padding: 8px 14px; background: var(--ink); color: var(--ground); font-size: 14px; line-height: 1.35; } .verdict b { color: var(--signal); font-weight: 600; } .verdict small { display: block; margin-top: 2px; font: 400 11px var(--mono); color: #aeb4b0; }

.dash { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.pn { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--rule); }
.pn > header { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px 0; min-width: 0; } .pn h3 { font-size: 12.5px; font-weight: 640; white-space: nowrap; } .pn .h { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pb { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 8px; position: relative; } .pb[data-draw] { overflow: hidden; padding: 2px 4px 4px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; } .r2 { grid-row: span 2; } .r3 { grid-row: span 3; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; } th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3); padding: 3px 8px 3px 0; border-bottom: 1.5px solid var(--ink); position: sticky; top: 0; background: var(--panel); white-space: nowrap; } td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule-2); vertical-align: top; } td.r, th.r { text-align: right; } td.m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.dim td { color: var(--ink-3); }
.trace { list-style: none; padding: 0; counter-reset: s; } .trace li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid var(--rule-2); font-size: 12px; }
.trace li::before { counter-increment: s; content: counter(s); font: 400 11px var(--mono); color: var(--ink-3); } .trace .tool { font: 500 11.5px var(--mono); } .trace .ms { font: 400 11px var(--mono); color: var(--ink-3); } .trace li > .n { grid-column: 2 / 4; color: var(--ink-2); }
.trace li.bad { background: var(--red-2); margin: 0 -6px; padding: 3px 6px; } .trace li.bad .tool { color: var(--red); }
.chk { list-style: none; padding: 0; } .chk li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--rule-2); font-size: 12.5px; } .chk i { width: 8px; height: 8px; margin-top: 5px; background: var(--blue); } .chk li.no i { background: var(--red); } .chk .d { display: block; font: 400 11px var(--mono); color: var(--ink-3); }
.review { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .review button { height: 28px; padding: 0 11px; border: 1.5px solid var(--ink); background: transparent; font-weight: 560; font-size: 12px; } .review button.p { background: var(--ink); color: var(--ground); } .review button.on { background: var(--blue); border-color: var(--blue); color: #fff; } .review button.on.x { background: var(--red); border-color: var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--ink-2); } .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
.note { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
svg text { font-family: var(--sans); } svg .m { font-family: var(--mono); } canvas { display: block; }
pre { padding: 10px 12px; background: var(--ink); color: #dfe5ff; font: 400 11.5px/1.55 var(--mono); overflow: auto; } pre .c { color: #8a90a8; } pre .s { color: var(--signal); }
.clause { cursor: pointer; } .clause:hover td { background: var(--rule-2); } .passage { padding: 8px 10px; border-left: 3px solid var(--blue); background: var(--blue-2); font-size: 12.5px; } .passage mark { background: var(--signal); }
.mini { display: inline-block; vertical-align: middle; } .btnp { display: inline-block; padding: 5px 12px; border: 1.5px solid var(--ink); font-weight: 560; font-size: 12px; background: transparent; } .btnp[aria-disabled=true] { opacity: .45; cursor: not-allowed; }
.plan { padding: 7px 0; border-bottom: 1px solid var(--rule-2); } .plan b { font-weight: 640; } .plan p { color: var(--ink-2); font-size: 12px; margin-top: 1px; } .plan .pr { float: right; font: 400 11.5px var(--mono); color: var(--ink-3); }

@media (max-width: 1000px) {
  #shell { height: auto !important; zoom: 1 !important; } .app { grid-template-columns: minmax(0, 1fr); } .rail { display: flex; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--rule); } .rail h2 { display: none; } .rail button { flex: none; width: auto; border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 11px 12px; } .rail button small { display: none; } .rail button[aria-selected=true] { border-bottom-color: var(--blue); }
  .dash { display: flex; flex-direction: column; } .pn { min-height: 240px; } .pb[data-draw] { min-height: 230px; } .ks { flex-wrap: wrap; } .k { flex: 1 1 45%; border-bottom: 1px solid var(--rule-2); } .bar .t { display: none; } .about p { right: auto; left: 0; }
}
</style>
</head>
<body>
<div id="shell">
<header class="bar"><a class="mark" href="build.html"><i></i>Scorcher Build</a><span class="t">Trial <b>geothermal-pilot-demo</b></span><span class="c">Concept · synthetic data · fixture agents</span><a class="b" href="build.html">Back to Build</a></header>
<div class="app">
  <nav class="rail" role="tablist" aria-label="Dashboards">
    <h2>Trial</h2>
    <button role="tab" data-v="overview" aria-selected="true">Overview</button>
    <button role="tab" data-v="agents" aria-selected="false">Agents and plans</button>
    <h2>Task dashboards</h2>
    <button role="tab" data-v="resource" aria-selected="false">Resource estimate<small>ref</small></button>
    <button role="tab" data-v="gis" aria-selected="false">GIS screening<small>ref</small></button>
    <button role="tab" data-v="seismic" aria-selected="false">Seismic picks<small>judg.</small></button>
    <button role="tab" data-v="well" aria-selected="false">Well data<small>ref</small></button>
    <button role="tab" data-v="docs" aria-selected="false">Documents<small>ref</small></button>
    <h2>Set up</h2>
    <button role="tab" data-v="connect" aria-selected="false">Connect an agent</button>
  </nav>
  <main>
    <section class="view on" id="v-overview"></section><section class="view" id="v-agents"></section><section class="view" id="v-resource"></section><section class="view" id="v-gis"></section><section class="view" id="v-seismic"></section><section class="view" id="v-well"></section><section class="view" id="v-docs"></section><section class="view" id="v-connect"></section>
  </main>
</div>
</div>
<script src="build-sample.js"></script>
<script>
(() => {
'use strict';
const S = window.BUILD_SAMPLE, $ = id => document.getElementById(id), f = (x, d = 1) => (+x).toFixed(d), pc = x => (x * 100).toFixed(0) + ' %', esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])), usd = (x, d = 4) => '$' + (+x).toFixed(d);
const BLUE = '#1d3aa8', RED = '#b8142f', INK = '#0d0f0e', MUTE = '#6f7571', GRID = 'rgba(13,15,14,.12)';
// seeded generator and Wilson interval: the same formulas as harness/stats.js
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const wilson = (k, n, z = 1.959964) => { const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return { rate: p, lo: k === 0 ? 0 : Math.max(0, c - h), hi: k === n ? 1 : Math.min(1, c + h) }; };
const short = n => n.replace(' (fixture)', '');

// layout helpers
const pn = (cls, title, hint, body, draw) => `<section class="pn ${cls}"><header><h3>${title}</h3>${hint ? `<span class="h">${hint}</span>` : ''}</header><div class="pb"${draw ? ` data-draw="${draw}"` : ''}>${body || ''}</div></section>`;
const vh = (title, cls, tags, about) => `<div class="vh"><h1>${title}</h1><span class="tag blue">${cls}</span>${tags.map(t => `<span class="tag ${t[1] || 'dim'}">${t[0]}</span>`).join('')}<details class="about"><summary>About this dashboard</summary><p>${about}</p></details></div>`;
const ks = items => `<div class="ks">${items.map(([v, l, col]) => `<div class="k"><b${col ? ` style="color:${col}"` : ''}>${v}</b><span title="${esc(l)}">${l}</span></div>`).join('')}</div>`;
const trace = steps => `<ol class="trace">${steps.map(s => `<li class="${s.bad ? 'bad' : ''}"><span class="tool">${esc(s.tool)}</span><span class="ms">${s.ms == null ? '' : s.ms + ' ms'}</span><span class="n">${esc(s.note)}</span></li>`).join('')}</ol>`;
const reviewHtml = id => `<div class="review" id="${id}"><button class="p" data-a="ok">Approve</button><button data-a="fix">Correct</button><button data-a="x">Reject</button></div>`;
function wireReview(id) { const box = $(id); if (!box) return; box.querySelectorAll('button').forEach(b => b.onclick = () => { box.querySelectorAll('button').forEach(x => x.classList.remove('on', 'x')); b.classList.add('on'); if (b.dataset.a === 'x') b.classList.add('x'); }); }
const DRAW = {};
const dprf = () => Math.min(3, (devicePixelRatio || 1) * (window.ZOOM || 1));
function fit() { const wide = innerWidth > 1000, Z = wide ? Math.max(1, Math.min(1.5, innerWidth / 1440, innerHeight / 900)) : 1, sh = $('shell'); window.ZOOM = Z; sh.style.zoom = Z; sh.style.height = wide ? (innerHeight / Z) + 'px' : ''; }   // scale the whole console to the screen, so a large display is used, not left empty
function drawActive() { document.querySelectorAll('.view.on [data-draw]').forEach(el => { const fn = DRAW[el.dataset.draw]; if (fn) fn(el, Math.max(120, el.clientWidth), Math.max(100, el.clientHeight)); }); }
const interval = (w, W = 110, H = 12) => `<svg class="mini" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="${GRID}"/><line x1="${w.lo * (W - 6) + 3}" x2="${w.hi * (W - 6) + 3}" y1="${H / 2}" y2="${H / 2}" stroke="${BLUE}" stroke-width="4"/><rect x="${w.rate * (W - 6) + 1}" y="1" width="4" height="${H - 2}" fill="${INK}"/></svg>`;

/* ================================================================ overview */
const views = {};
views.overview = {
  html() { const [a, b] = S.arms, p = S.pairs[0], n = S.nTasks, cats = Object.fromEntries(S.arms.map(x => [x.name, x.failures]));
    return vh('Trial overview', 'Reference-graded', [[`${n} tasks`], ['Resource estimate'], ['Synthetic example']], 'Did an agent do the work, and do we know it? Every rate carries its sample size and interval; two agents are compared on the same tasks. Two kinds of uncertainty appear in Scorcher Build and are never mixed: in the answer (P90 to P10, an interval on a temperature) from the engineering method; and in the score (the interval on a pass rate) from statistics over tasks.')
      + `<div class="verdict">On ${n} synthetic resource-estimate tasks, <b>${esc(short(a.name))}</b> passed ${pc(a.pass.rate)} (${pc(a.pass.lo)} to ${pc(a.pass.hi)}) and <b>${esc(short(b.name))}</b> ${pc(b.pass.rate)} (${pc(b.pass.lo)} to ${pc(b.pass.hi)}). Paired on the same tasks, the first is ahead by <b>${f(p.diff * 100, 0)} points</b> (${f(p.lo * 100, 0)} to ${f(p.hi * 100, 0)}); verdict: ${p.verdict}.<small>The current process (an engineer on the same tasks) is not measured in this example, so no claim is made about saving time or money.</small></div>`
      + `<div class="dash" style="grid-template-rows: minmax(0,1.15fr) minmax(0,1fr)">`
      + pn('s5', 'Pass rate with 95 % interval', 'Wilson interval; block is the observed rate', '', 'forest')
      + pn('s4', 'Arms', 'same tasks, tools and budget', `<table><tr><th>Arm</th><th class="r">Final</th><th class="r">First</th><th class="r">Rescued</th><th class="r">Calls</th></tr>${S.arms.map(x => `<tr><td>${esc(short(x.name))}</td><td class="r m">${pc(x.pass.rate)}</td><td class="r m">${pc(x.firstPass.rate)}</td><td class="r m">${x.corrected}</td><td class="r m">${f(x.meanCalls, 1)}</td></tr>`).join('')}<tr class="dim"><td>Current process (engineer)</td><td class="r" colspan="4">not measured</td></tr></table><p class="note">Rescued: failed first, accepted after the review gate named the problem.</p>`)
      + pn('s3', 'Why they failed', 'by category', `<table><tr><th>Arm</th><th>Categories</th></tr>${S.arms.map(x => `<tr><td>${esc(short(x.name))}</td><td class="m">${Object.keys(cats[x.name]).length ? Object.entries(cats[x.name]).map(([k, v]) => `${k} ${v}`).join(', ') : 'none'}</td></tr>`).join('')}</table><p class="note">value: wrong number. no-uncertainty: one number where a P90 to P10 range was required. refusal, cost-cap, no-answer: the run did not produce a graded answer.</p>`)
      + pn('s8', 'Every task, every arm', 'hover a square for the task', '', 'matrix')
      + pn('s4', 'Reading the interval', '', `<p class="note" style="margin-top:0;font-size:12.5px;color:var(--ink-2)">With ${n} tasks a rate is known to roughly ±10 points, so a small gap between agents is usually inconclusive and the console says so. A first attempt and a final answer are scored separately, so a retry loop cannot hide failures.</p>`) + `</div>`; },
  wire() {} };
DRAW.forest = (el, W, H) => { const L = 150, R = 16, T = 6, B = 22, n = S.arms.length, rh = (H - T - B - 28) / n, x = v => L + v * (W - L - R), rows = [];
  S.arms.forEach((a, i) => { const y = T + i * rh + rh / 2; rows.push(`<text x="0" y="${y - 1}" font-size="12.5" font-weight="600">${esc(short(a.name))}</text><text x="0" y="${y + 12}" font-size="11" fill="${MUTE}">${a.kind === 'model' ? 'model, ' + a.route : 'scripted fixture'}</text>`);
    [['Final', a.pass, BLUE, 1, -5], ['First', a.firstPass, INK, .5, 5]].forEach(([, w, col, op, dy]) => { rows.push(`<line x1="${x(w.lo)}" x2="${x(w.hi)}" y1="${y + dy}" y2="${y + dy}" stroke="${col}" stroke-width="5" opacity="${op}"/><rect x="${x(w.rate) - 3}" y="${y + dy - 6}" width="6" height="12" fill="${col}"/>`); }); });
  const ticks = [0, .25, .5, .75, 1].map(v => `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - B - 22}" stroke="${GRID}"/><text class="m" x="${x(v)}" y="${H - B - 10}" font-size="10.5" fill="${MUTE}" text-anchor="middle">${v * 100}%</text>`).join('');
  el.innerHTML = `<svg width="${W}" height="${H - 26}" viewBox="0 0 ${W} ${H - 26}">${ticks}${rows.join('')}</svg><div class="legend"><span><i style="background:${BLUE}"></i>Final answer</span><span><i style="background:${INK};opacity:.5"></i>First attempt, before the review gate</span></div>`; };
DRAW.matrix = (el, W, H) => { const L = 140, n = S.nTasks, sz = Math.max(8, (W - L - 4) / n - 2), rh = Math.max(10, Math.min(26, (H - 54) / (S.arms.length + 1))); let s = '';
  S.arms.forEach((a, i) => { s += `<text x="0" y="${i * (rh + 3) + rh * .72}" font-size="12">${esc(short(a.name))}</text>`; a.results.forEach((r, j) => { const first = a.first[j]; s += `<rect x="${L + j * (sz + 2)}" y="${i * (rh + 3)}" width="${sz}" height="${rh}" fill="${r ? (first ? INK : BLUE) : RED}"><title>${S.taskIds[j]}: ${r ? (first ? 'passed' : 'passed after the review gate') : 'failed'}</title></rect>`; }); });
  const y0 = S.arms.length * (rh + 3); S.taskUnits.forEach((u, j) => { if (u !== 'km2') s += `<rect x="${L + j * (sz + 2)}" y="${y0 + 2}" width="${sz}" height="3" fill="${INK}"/>`; }); s += `<text x="0" y="${y0 + 8}" font-size="11" fill="${MUTE}">Field units</text>`;
  el.innerHTML = `<svg width="${W}" height="${y0 + 14}" viewBox="0 0 ${W} ${y0 + 14}">${s}</svg><div class="legend"><span><i style="background:${INK};height:9px"></i>Passed</span><span><i style="background:${BLUE};height:9px"></i>Passed after the review gate</span><span><i style="background:${RED};height:9px"></i>Failed</span></div>`; };

/* ================================================================ agents and plans */
views.agents = {
  html() { const arms = S.arms, models = arms.filter(a => a.kind === 'model'), ranIds = new Set(models.map(m => m.model)), notRun = S.prices.models.filter(m => m.id !== 'claude-fable-5-1' && !ranIds.has(m.id));
    const row = a => { const c = a.cost, fx = a.kind !== 'model';
      return `<tr><td><b>${esc(short(a.name))}</b><br><span style="color:${MUTE};font-size:11px">${fx ? 'scripted fixture' : 'model · ' + esc(a.route)}</span></td><td class="m">${pc(a.pass.rate)} <span style="color:${MUTE}">${pc(a.pass.lo)} to ${pc(a.pass.hi)}</span><br>${interval(a.pass)}</td><td class="r m">${pc(a.firstPass.rate)}</td>

    "type": "http", "url": "https://&lt;trial-host&gt;/mcp",
    "headers": { "Authorization": "Bearer <span class="s">&lt;trial token&gt;</span>" } } } }

<span class="c"># your agent:  task_get → tools → submit_answer</span></pre><p class="note">Tokens are per trial and short-lived; a request without a valid one is refused (tested). Tools are read-only and run on copies of your data. To run a Claude model through this route yourself: <span class="num">npm run agent -- --model claude-haiku-5-5 --yes</span>.</p>`)
    + pn('s6', 'Tools in the gateway today', 'every agent, yours or ours, gets these', `<table><tr><th>Tool</th><th>What it does</th></tr>${S.tools.map(t => `<tr><td class="m" style="white-space:nowrap">${t.name}</td><td>${esc(t.description.split('.')[0])}.</td></tr>`).join('')}</table>`)
    + pn('s6', 'What we measure, and what you tell us', '', `<table><tr><th>Quantity</th><th>Source</th></tr><tr><td>Tool calls, order, arguments, results</td><td>Measured by the gateway</td></tr><tr><td>Wall time, attempts, review-gate failures</td><td>Measured by the gateway</td></tr><tr><td>Correctness</td><td>Graded against a hidden reference, or by an engineer</td></tr><tr><td>Tokens and cost (route 1)</td><td>Self-reported by the agent's client</td></tr><tr><td>Reasoning inside your agent</td><td>Not visible; steps you declare are shown as declared</td></tr></table>`) + `</div>`; },
  wire() {} };

/* ================================================================ shell */
function render(id) { $('v-' + id).innerHTML = views[id].html(); views[id].wire(); drawActive(); }
const ids = Object.keys(views), tabs = [...document.querySelectorAll('.rail button')];
function show(v) { tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.v === v)); document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v)); render(v); try { history.replaceState(null, '', '#' + v); } catch {} }
tabs.forEach(t => t.onclick = () => show(t.dataset.v));
let timer; addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(() => { fit(); drawActive(); }, 120); });
fit();
show(ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
})();
</script>
