<script src="../skyobjects.js"></script>
<div id="R"></div>
<script>
const I={play:'<path d="M7 5l12 7-12 7z"/>',sky:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',packsold:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',ranks:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 20h8"/>',me:'<circle cx="12" cy="9" r="4"/><path d="M5 20c1-4 4-5 7-5s6 1 7 5"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',find:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',list:'<path d="M5 7h14M5 12h10M5 17h12"/>',target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',back:'<path d="M15 5l-7 7 7 7"/>',live:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',more:'<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/>',studio:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const nav=a=>`<div class="bar">${[['play','Play'],['sky','Sky'],['packs','Packs'],['ranks','Ranks'],['me','Me']].map(([k,t])=>`<div class="tab ${a===k?'on':''}">${ic(k)}${t}<i></i></div>`).join('')}</div>`;
const tp=(r)=>`<div class="top"><div class="logo">Scorch<b>er</b></div><div style="display:flex;gap:8px"><span class="pill">${ic('flame')}12</span>${r||''}</div></div>`;

const route=`<div style="text-align:center"><div class="eye">Plate no. 300 · Tuesday</div><div class="big" style="margin-top:12px">Lemon</div><div style="display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--mute)"><div style="flex:1;height:1px;background:var(--line)"></div><i style="font:italic 18px EB">to</i><div style="flex:1;height:1px;background:var(--line)"></div></div><div class="big" style="color:var(--acc);font-style:italic">Global Positioning System</div></div>`;



const GR=[['Daily',[['play','Today\'s puzzle']]],['Modes',[['modes','Game modes'],['packs','Packs'],['live','Live & friends']]],['Collect',[['sky','Sky'],['locker','Locker']]],['Compete',[['ranks','Ranks']]],['Create',[['studio','Studio']]]];
const I2={packs:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.500l9 5 9-5"/>',modes:'<rect x="3" y="4" width="8" height="8" rx="2"/><rect x="13" y="4" width="8" height="8" rx="2"/><rect x="3" y="14" width="8" height="6" rx="2"/><rect x="13" y="14" width="8" height="6" rx="2"/>',locker:'<path d="M6 3h12v18H6zM6 11h12M10 7h4"/>',friends:'<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c.8-3.6 3.3-5 6-5s5.200 1.400 6 5M15 15c3 0 5 1.200 6 4"/>',stream:'<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4M10 9.500l5 2.500-5 2.500z"/>',practice:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',league:'<path d="M5 20V10M12 20V4M19 20v-7"/>',chal:'<path d="M5 5l7 7M5 12l7-7M13 19l6-6M19 19l-6-6"/>'};Object.assign(I,I2);
const rail=(a,c=true)=>`<div class="rail ${c?'c':''}"><div class="hd"><div class="logo" style="font-size:26px">${c?'S<b>.</b>':'Scorch<b>er</b>'}</div><div class="coll" style="${c?'margin:0':''}"><svg viewBox="0 0 24 24"><path d="${c?'M9 6l6 6-6 6':'M15 6l-6 6 6 6'}"/></svg></div></div>${GR.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,t])=>`<div class="nv ${a===k?'on':''}">${ic(k)}<span class="lab">${t}</span>${k==='live'?'<span class="badge">3 live</span>':''}</div>`).join('')).join('')}<div style="margin-top:auto"><span class="pill" style="padding:0 9px">${ic('flame')}12</span></div></div>`;
const tb=(l)=>`<div class="tb"><div class="eye">${l}</div><div style="display:flex;gap:8px"><span class="pill">${ic('find')}Search</span><span class="pill">${ic('flame')}12 day streak</span><span class="pill">Will</span></div></div>`;
const D=(a,l,inner,dark,c=true)=>`<div class="dt ${dark?'dk':''}">${rail(a,c)}<div class="mainx">${tb(l)}${inner}</div></div>`;
const cv=(id,w=400,h=300,st='')=>`<div class="art" style="${st}"><canvas data-art="${id}" width="${w}" height="${h}" style="width:100%;height:100%"></canvas></div>`;
const hdr=(t,s)=>`<div class="pgh"><div class="t1">${t}</div><div class="t2">${s}</div></div>`;
const btn=(t,k='')=>`<div class="btn ${k} sm" style="height:44px">${t}</div>`;
const modeCard=(ic_,col,t,p,tag,span='c4',go='Start')=>`<div class="card mode ${span}"><span class="tag">${tag}</span><div class="ic" style="background:${col}22;color:${col}">${ic(ic_)}</div><h3>${t}</h3><p>${p}</p><div class="go">${go} →</div></div>`;
// 1 home with modes
const home=()=>D('play','Tuesday 27 October · Plate no. 300',`<div class="pg" style="grid-template-rows:auto 1fr 1fr">
 <div class="card c12" style="flex-direction:row;align-items:center;padding:30px 40px;gap:40px;background:var(--card)"><div style="flex:1"><div class="eye">Today's daily puzzle</div><div style="font:400 50px/1.05 EB;margin-top:10px">Lemon <span style="color:var(--mute);font-size:28px;font-style:italic">to</span> <i style="color:var(--acc)">Global Positioning System</i></div><div style="display:flex;gap:8px;margin-top:16px"><span class="chip">Fastest 3 clicks</span><span class="chip">Medium</span><span class="chip">Food → Technology</span><span class="chip">12 day streak</span></div></div><div class="cta" style="height:78px;padding:0 48px;border-radius:24px;font-size:20px">Play today's puzzle ${ic('play')}</div></div>
 ${modeCard('friends','#e5482a','Play with friends','Race the same puzzle live in a lobby, or send a friend a challenge','Multiplayer','c4')}${modeCard('stream','#6a4fa8','Livestream mode','Run a lobby your audience joins, with an overlay for OBS','Streamers','c4')}${modeCard('packs','#2a4f8a','Packs','Themed sets of puzzles: space, food, history and more','215 puzzles','c4')}
 ${modeCard('practice','#2f7d46','Practice','Random puzzles with no pressure: no streak, no sky objects','Unlimited','c4')}${modeCard('studio','#8a6a2a','Make a puzzle','Pick any two articles and share your own puzzle link','Create','c4')}<div class="card c4" style="padding:20px 22px"><h4>Your next goal</h4><div style="display:flex;gap:14px;align-items:center;flex:1">${cv('reddwarf',200,200,'width:84px;height:84px;border-radius:16px;flex:none')}<div style="font:600 14px/1.4 IS">1 find from completing your brown dwarfs</div></div><div class="bar2"><i style="width:86%"></i></div></div></div>`);
// 2 game modes page

 ${modeCard('friends','#e5482a','Live race','Host or join a lobby with a code. Same puzzle, first to the target.','Multiplayer','c3')}${modeCard('chal','#d63a1f','Challenge a friend','Send your result as a link and see if they can beat it.','Multiplayer','c3')}

 <div class="card" style="padding:22px 38px;overflow:hidden"><div class="big">Fruit</div><div class="art-p" style="padding:10px 0;font-size:19px">In botany, a <a>fruit</a> is the seed-bearing structure in <a>flowering plants</a> formed from the ovary after flowering. Fruits are the means by which <a>angiosperms</a> disseminate seeds. Edible fruits, in particular, have long propagated using the <a>movements</a> of humans and animals in a <a>symbiotic relationship</a>; the <a>propagation</a> of seeds provides food for <a>animals</a> and <a>humans</a>. Many <a>seeds</a> and fruits are adapted for <a>dispersal</a> by wind, water or animals…</div></div>
