<title>Scorcher Tree (mockup)</title>
<!-- A design mockup of Scorcher Tree, the vertebrate first section. Views: ?v=overview | mrca | review | yours | phone.
     Every age, interval and study below is a PLACEHOLDER for layout only: nothing here has been checked against the literature. -->
<style>
@font-face { font-family: 'EB Garamond'; src: url(../../fonts/eb-garamond-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'EB Garamond'; src: url(../../fonts/eb-garamond-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: 'EB Garamond'; src: url(../../fonts/eb-garamond-latin-400-italic.woff2) format('woff2'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Jost'; src: url(../../fonts/jost-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Jost'; src: url(../../fonts/jost-latin-500-normal.woff2) format('woff2'); font-weight: 500 700; }

:root { --paper: #f4efe4; --sheet: #fbf8f1; --ink: #1a1712; --ink2: #4b453b; --mute: #8a8173; --rule: #ddd3c1; --rule2: #ebe4d5; --accent: #c8401f; --accent-soft: rgba(200, 64, 31, .08);
  --fossil: #8a5a2b; --clock: #2f5f8f; --geo: #5d7a3a; --contest: #b7791f;
  --disp: 'EB Garamond', Georgia, serif; --ui: 'Jost', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
.ph { position: fixed; z-index: 99; right: 448px; top: 74px; padding: 4px 12px; border-radius: 99px; background: #1a1712; color: #f4efe4; font: 500 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
/* top bar */
.top { height: 62px; display: flex; align-items: center; gap: 22px; padding: 0 24px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.brand { display: flex; align-items: baseline; gap: 9px; } .brand .w { font: 400 24px var(--disp); } .brand .w b { font-weight: 400; font-style: italic; color: var(--accent); }
.brand .s { font: 500 11px var(--ui); letter-spacing: .3em; text-transform: uppercase; color: var(--ink2); padding-left: 9px; border-left: 1px solid var(--rule); }
.search { flex: 0 1 380px; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: #fff; color: var(--mute); }
.search svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.nav { display: flex; gap: 4px; } .nav a { padding: 8px 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 500; font-size: 13px; } .nav a.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.top .sel { margin-left: auto; font-size: 12px; color: var(--mute); text-align: right; line-height: 1.3; } .top .sel b { color: var(--ink); font-weight: 500; }
/* layout */
.main { position: absolute; top: 62px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 430px; }
.stage { position: relative; overflow: hidden; }
.side { border-left: 1px solid var(--rule); background: var(--sheet); overflow: hidden; padding: 22px 26px; }
svg.tree { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl-period { font: 500 10px var(--ui); letter-spacing: .12em; text-transform: uppercase; fill: var(--ink2); }
.tl-ma { font: 400 10px var(--mono); fill: var(--mute); }
.tip { font: 400 15px var(--disp); fill: var(--ink); } .tip-sci { font: italic 400 12px var(--disp); fill: var(--mute); }
.clade { font: 500 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; fill: var(--ink2); }
.legend { position: absolute; left: 20px; bottom: 16px; display: flex; gap: 18px; align-items: center; padding: 9px 14px; background: rgba(251, 248, 241, .94); border: 1px solid var(--rule); border-radius: 10px; font-size: 11.5px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; } .legend svg { width: 22px; height: 12px; }
.zoom { position: absolute; right: 18px; bottom: 16px; display: grid; gap: 6px; } .zoom button { width: 34px; height: 34px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); font: 400 18px var(--ui); color: var(--ink2); }
.crumbs { position: absolute; left: 20px; top: 14px; font-size: 12px; color: var(--mute); } .crumbs b { color: var(--ink); font-weight: 500; }
/* inspector */
.eye { font: 500 10.5px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font: 500 10px var(--ui); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; }
.badge.rev { color: var(--accent); } .badge.syn { color: var(--mute); } .badge.res { color: var(--geo); } .badge.con { color: var(--contest); }
h1 { margin: 8px 0 4px; font: 400 36px/1.05 var(--disp); } h1 i { color: var(--ink2); }
.lede { margin: 0 0 14px; font: 400 16.5px/1.45 var(--disp); color: var(--ink2); }
h3 { margin: 18px 0 8px; font: 500 10.5px var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; align-items: center; }
h3 em { font-style: normal; letter-spacing: .04em; text-transform: none; font-size: 11px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; font-size: 13px; } .kv dt { color: var(--mute); } .kv dd { margin: 0; color: var(--ink); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.ages { border: 1px solid var(--rule); border-radius: 10px; background: #fff; padding: 12px 14px 8px; }
.ages svg { width: 100%; display: block; }
.ev { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--rule2); font-size: 12.5px; }
.ev:first-of-type { border-top: 0; } .ev i { width: 10px; height: 10px; margin-top: 4px; } .ev b { font-weight: 500; } .ev small { display: block; color: var(--mute); font-size: 11.5px; } .ev .mono { color: var(--ink2); white-space: nowrap; }
.fold { margin-top: 12px; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; background: var(--paper); font-size: 13px; color: var(--ink2); }
.fold summary { font-weight: 500; color: var(--ink); list-style: none; display: flex; justify-content: space-between; } .fold summary::after { content: '+'; color: var(--mute); }
.fold[open] summary::after { content: '−'; } .fold p { margin: 8px 0 0; line-height: 1.5; }
.acts { display: flex; gap: 8px; margin-top: 16px; } .acts button { padding: 9px 14px; border: 1px solid var(--rule); border-radius: 8px; font-weight: 500; font-size: 13px; background: #fff; } .acts button.p { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

.review { position: absolute; top: 62px; left: 0; right: 0; bottom: 0; overflow: hidden; display: grid; grid-template-columns: 250px 1fr 300px; }
.toc { padding: 30px 24px; border-right: 1px solid var(--rule); font-size: 13px; } .toc a { display: block; padding: 6px 0; color: var(--ink2); text-decoration: none; } .toc a.on { color: var(--accent); font-weight: 500; }
.toc .tt { font: 500 10.5px var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
.art { padding: 34px 56px; overflow: hidden; } .art h1 { font-size: 46px; } .art .lede { font-size: 19px; max-width: 760px; }
.art h2 { margin: 28px 0 10px; font: 400 26px var(--disp); } .art p { max-width: 760px; font: 400 16.5px/1.6 var(--disp); color: var(--ink2); margin: 0 0 12px; }
.hyps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 900px; } .hyp { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; background: var(--sheet); }
.hyp h4 { margin: 0 0 6px; font: 500 15px var(--ui); } .hyp p { font-size: 14px !important; line-height: 1.5 !important; margin: 0 0 8px !important; } .hyp svg { width: 100%; height: 54px; display: block; }
.hyp .sup { font: 500 10.5px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.refs { padding: 30px 24px; border-left: 1px solid var(--rule); background: var(--sheet); font-size: 12.5px; color: var(--ink2); }
.refs ol { padding-left: 18px; margin: 0; } .refs li { margin: 0 0 10px; line-height: 1.45; } .refs .st { display: inline-block; margin-top: 2px; font: 500 10px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--contest); }
.status { display: flex; gap: 18px; margin: 4px 0 18px; font-size: 12.5px; color: var(--mute); } .status b { color: var(--ink); font-weight: 500; }
/* compare chips */
.pair { position: absolute; left: 20px; top: 46px; display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--rule); font-weight: 500; }
.chip i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); } .pair .vs { color: var(--mute); font-size: 12px; }
/* your tree */
.yt { position: absolute; left: 20px; top: 46px; display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--sheet); }
.yt b { font: 400 22px var(--disp); } .yt span { font-size: 12px; opacity: .8; } .yt .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .2); } .yt .bar i { display: block; height: 100%; width: 25%; background: var(--accent); border-radius: 2px; }
.card { border: 1px solid var(--rule); border-radius: 12px; background: #fff; padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; }
.card .img { width: 54px; height: 54px; border-radius: 10px; background: var(--c); position: relative; overflow: hidden; } .card b { font: 400 18px var(--disp); display: block; } .card small { color: var(--mute); font-size: 12px; }
/* phone */
body.phone .top, body.phone .main { display: none; } body.phone .ph { left: 12px; right: 12px; top: 62px; font-size: 8px; letter-spacing: .06em; text-align: center; white-space: normal; } .review ~ .ph, body:has(.review) .ph { right: 316px; }
.pw { position: absolute; inset: 0; background: var(--paper); }
.ptop { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: var(--sheet); border-top: 1px solid var(--rule); border-radius: 18px 18px 0 0; padding: 10px 18px 18px; box-shadow: 0 -10px 40px rgba(60, 40, 20, .1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 12px; }
</style></head>
<body>
<header class="top">
  <div class="brand"><span class="w">Scorch<b>er</b></span><span class="s">Tree</span></div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search a species or group</span></label>
  <nav class="nav" id="nav"><a data-v="overview">Explorer</a><a data-v="mrca">Compare</a><a data-v="review">Evidence reviews</a><a data-v="yours">Your Tree</a></nav>
  <div class="sel"><b>A selected tree</b> · 24 of about 70,000 vertebrate species<br>Vertebrates section · version 0.1</div>
</header>
<div class="main" id="main"><div class="stage" id="stage"></div><aside class="side" id="side"></aside></div>
<div class="ph">Mockup · all ages, intervals and studies are placeholders, not verified</div>
<script>
// ---------------- placeholder data: topology is textbook, every number is a stand-in for layout
const T = ['Vertebrata', 535, 480, 600, 'rev', [
  ['Cyclostomi', 450, 400, 500, 'syn', [['Hagfish', 'Myxine glutinosa', '#8b7d70'], ['Lamprey', 'Petromyzon marinus', '#7e7a6f']]],
  ['Gnathostomata', 465, 440, 490, 'rev', [
    ['Chondrichthyes', 385, 370, 410, 'syn', [['Shark', 'Carcharodon carcharias', '#6f8796'], ['Ray', 'Raja clavata', '#7c8f99']]],
    ['Osteichthyes', 425, 420, 440, 'rev', [
      ['Teleostei', 230, 200, 260, 'syn', [['Zebrafish', 'Danio rerio', '#7f9fb0'], ['Salmon', 'Salmo salar', '#9a8a7a']]],
      ['Sarcopterygii', 415, 410, 425, 'syn', [['Coelacanth', 'Latimeria chalumnae', '#6c7d8c'],
        ['Rhipidistia', 408, 400, 418, 'syn', [['Lungfish', 'Protopterus annectens', '#8a7c63'],
          ['Tetrapoda', 352, 340, 370, 'rev', [
            ['Lissamphibia', 300, 285, 320, 'con', [['Frog', 'Rana temporaria', '#7c9a5d'], ['Salamander', 'Salamandra salamandra', '#b78a3a']]],
            ['Amniota', 319, 312, 330, 'rev', [
              ['Mammalia', 180, 165, 200, 'rev', [['Platypus', 'Ornithorhynchus anatinus', '#8a6f55'],
                ['Theria', 160, 150, 170, 'syn', [['Kangaroo', 'Macropus rufus', '#b0805a'],
                  ['Placentalia', 100, 88, 110, 'rev', [['Elephant', 'Loxodonta africana', '#8e8a85'],
                    ['Boreoeutheria', 94, 85, 104, 'syn', [
                      ['Euarchontoglires', 88, 80, 97, 'syn', [['Mouse', 'Mus musculus', '#9f9488'], ['Hominini', 6.5, 5, 8, 'rev', [['Human', 'Homo sapiens', '#b98b6e'], ['Chimpanzee', 'Pan troglodytes', '#6d5a4a']]]]],
                      ['Laurasiatheria', 80, 72, 88, 'syn', [['Dog', 'Canis familiaris', '#a07850'], ['Whale', 'Balaenoptera musculus', '#5f7685']]]]]]]]]]],
              ['Sauria', 270, 255, 285, 'syn', [
                ['Squamata', 170, 150, 190, 'syn', [['Lizard', 'Podarcis muralis', '#7d8f4f'], ['Snake', 'Python regius', '#7a6a4a']]],
                ['Archelosauria', 255, 245, 265, 'con', [['Turtle', 'Chelonia mydas', '#6d8a6a'],
                  ['Archosauria', 250, 245, 256, 'rev', [['Crocodile', 'Crocodylus niloticus', '#6b7350'],
                    ['Aves', 95, 80, 110, 'syn', [['Ostrich', 'Struthio camelus', '#8a7a6a'], ['Chicken', 'Gallus gallus', '#b0603f']]]]]]]]]]]]]]]]]]]]]]];
const PER = [['Cambrian', 538.8, 486.9, '#c9d6b3'], ['Ordovician', 486.9, 443.1, '#b8d6c8'], ['Silurian', 443.1, 419.6, '#d6eadb'], ['Devonian', 419.6, 358.9, '#e6cfaa'], ['Carboniferous', 358.9, 298.9, '#c4dbd6'], ['Permian', 298.9, 251.9, '#efc0b4'],
  ['Triassic', 251.9, 201.4, '#d4bfd9'], ['Jurassic', 201.4, 143.1, '#bfe2ea'], ['Cretaceous', 143.1, 66, '#d2e8c0'], ['Paleogene', 66, 23.03, '#f6d5b8'], ['Neogene', 23.03, 2.58, '#f6efb0'], ['Quat.', 2.58, 0, '#f4f2c8']];   // ICS chart boundaries, tinted
const v = new URLSearchParams(location.search).get('v') || 'overview';
const isNode = n => typeof n[1] === 'number';
let leaves = []; (function walk(n) { if (isNode(n)) n[5].forEach(walk); else leaves.push(n); })(T);
const COLLECTED = new Set(['Human', 'Chicken', 'Shark', 'Frog', 'Elephant', 'Turtle']);
const FOCUS = { overview: 'Amniota', mrca: 'Amniota', yours: null }[v];

function treeSVG(W, H, o = {}) {
  const L = o.left || 40, R = o.right || 250, top = o.top || 92, bot = o.bot || 70, maxMa = 640, x = ma => L + (1 - ma / maxMa) * (W - L - R), rowH = (H - top - bot) / (leaves.length - 1);
  let s = '', yi = 0; const pos = new Map();
  PER.forEach(([n, a, b, c], i) => { s += `<rect x="${x(a)}" y="${top - 46}" width="${x(b) - x(a)}" height="${H - top - bot + 70}" fill="${c}" opacity="${i % 2 ? .28 : .42}"/>`; { const wd = x(b) - x(a), nm = wd > n.length * 8.4 + 8 ? n : wd > 34 ? ({ Cambrian: 'Camb.', Ordovician: 'Ord.', Silurian: 'Sil.', Devonian: 'Dev.', Carboniferous: 'Carb.', Permian: 'Perm.', Triassic: 'Tri.', Jurassic: 'Jur.', Cretaceous: 'Cret.', Paleogene: 'Pg.', Neogene: 'Ng.' }[n] || '') : ''; if (nm) s += `<text class="tl-period" x="${(x(a) + x(b)) / 2}" y="${top - 30}" text-anchor="middle">${nm}</text>`; } });
  (o.ticks || [600, 500, 400, 300, 200, 100]).forEach(m => { s += `<line x1="${x(m)}" x2="${x(m)}" y1="${top - 18}" y2="${H - bot + 22}" stroke="#1a1712" stroke-opacity=".07"/><text class="tl-ma" x="${x(m)}" y="${top - 14}" text-anchor="middle">${m} Ma</text>`; });
  s += `<text class="tl-ma" x="${W - R + 12}" y="${top - 14}">Today</text>`;
  const path = o.path || new Set();
  (function place(n) { if (!isNode(n)) { const y = top + yi++ * rowH; pos.set(n[0], { x: x(0), y }); return pos.get(n[0]); }
    const ps = n[5].map(place), y = (ps[0].y + ps[ps.length - 1].y) / 2, p = { x: x(n[1]), y, n }; pos.set(n[0], p); return p; })(T);
  (function draw(n) { if (!isNode(n)) return; const p = pos.get(n[0]);
    n[5].forEach(c => { const q = pos.get(c[0]), on = path.has(c[0]) && path.has(n[0]), dim = o.dim && !o.dim(c), col = on ? '#c8401f' : '#1a1712';
      s += `<path d="M${p.x},${p.y} V${q.y} H${q.x}" fill="none" stroke="${col}" stroke-opacity="${on ? 1 : dim ? .16 : .62}" stroke-width="${on ? 2.6 : 1.3}"/>`; draw(c); });
    // uncertainty bar and node marker
    const lo = x(n[3]), hi = x(n[2]), rev = n[4] === 'rev', con = n[4] === 'con', foc = n[0] === FOCUS && !o.noFocus, dim = o.dimNode && o.dimNode(n);
    s += `<line x1="${lo}" x2="${hi}" y1="${p.y}" y2="${p.y}" stroke="${rev ? '#c8401f' : '#8a8173'}" stroke-opacity="${dim ? .15 : rev ? .55 : .45}" stroke-width="5" stroke-linecap="round"/>`;
    s += rev ? `<circle cx="${p.x}" cy="${p.y}" r="${foc ? 7 : 4.5}" fill="#fbf8f1" stroke="#c8401f" stroke-width="${foc ? 3 : 2}"/>` : con ? `<rect x="${p.x - 4}" y="${p.y - 4}" width="8" height="8" transform="rotate(45 ${p.x} ${p.y})" fill="#fbf8f1" stroke="#b7791f" stroke-width="1.8"/>` : `<circle cx="${p.x}" cy="${p.y}" r="3.2" fill="#fbf8f1" stroke="#8a8173" stroke-width="1.5"/>`;
    if (foc) s += `<circle cx="${p.x}" cy="${p.y}" r="14" fill="none" stroke="#c8401f" stroke-opacity=".25" stroke-width="6"/>`;
    if (o.cladeLabels && ['Gnathostomata', 'Osteichthyes', 'Tetrapoda', 'Amniota', 'Mammalia', 'Placentalia', 'Archosauria', 'Sauria'].includes(n[0])) s += `<text class="clade" x="${p.x + 9}" y="${p.y - 8}" ${dim ? 'opacity=".3"' : ''}>${n[0]}</text>`;
  })(T);
  leaves.forEach(l => { const p = pos.get(l[0]), dim = o.dim && !o.dim(l), col = o.collected && COLLECTED.has(l[0]), on = path.has(l[0]);
    const tr = o.tipR || 13, tx = p.x + 9 + tr * 2.6; s += `<g opacity="${dim ? .32 : 1}">${col ? `<circle cx="${p.x + 9 + tr}" cy="${p.y}" r="${tr + 4}" fill="none" stroke="#c8401f" stroke-width="2"/>` : ''}<circle cx="${p.x + 9 + tr}" cy="${p.y}" r="${tr}" fill="${l[2]}"/>${tr > 8 ? `<path d="M${p.x + 1 + tr},${p.y + 4} q8,-12 16,-2" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/>` : ''}
      <text class="tip" x="${tx}" y="${p.y + 1}" ${on ? 'fill="#c8401f"' : ''}>${l[0]}</text><text class="tip-sci" x="${tx}" y="${p.y + 14}">${l[1]}</text></g>`; });
  return { svg: `<svg class="tree" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">${s}</svg>`, pos, x };
}
const ancestors = name => { const out = []; (function f(n, trail) { if (!isNode(n)) { if (n[0] === name) out.push(...trail, n[0]); return; } n[5].forEach(c => f(c, [...trail, n[0]])); })(T, []); return out; };
const findNode = name => { let r = null; (function f(n) { if (n[0] === name) r = n; if (isNode(n)) n[5].forEach(f); })(T); return r; };
const LEGEND = `<div class="legend"><span><svg><circle cx="11" cy="6" r="4.5" fill="#fbf8f1" stroke="#c8401f" stroke-width="2"/></svg>Reviewed node</span><span><svg><circle cx="11" cy="6" r="3.2" fill="#fbf8f1" stroke="#8a8173" stroke-width="1.5"/></svg>Age from published synthesis</span><span><svg><rect x="7" y="2" width="8" height="8" transform="rotate(45 11 6)" fill="#fbf8f1" stroke="#b7791f" stroke-width="1.8"/></svg>Relationship debated</span><span><svg><line x1="1" x2="21" y1="6" y2="6" stroke="#8a8173" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/></svg>Published age interval</span></div>`;

function agesChart(rows, lo, hi) {   // a small timeline of age evidence for one node
  const W = 370, x = m => 24 + (1 - (m - lo) / (hi - lo)) * (W - 48); let s = '', y = 16;
  [hi, (hi + lo) / 2, lo].forEach(m => { s += `<text x="${x(m)}" y="10" font-family="IBM Plex Mono" font-size="9.5" fill="#8a8173" text-anchor="middle">${Math.round(m)} Ma</text>`; });
