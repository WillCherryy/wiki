# One Cloudflare Worker serves both the site (dist/) and the API (/api/*). See worker/README.md.
name = "wiki"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[build]
command = "npm run build:site"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Streamer lobbies: one Durable Object per live race (free plan needs the SQLite-backed kind).
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[vars]
# Origin allowed to call the API from a browser. Use your site, e.g. "https://warmer.site". "*" is fine for testing.
ALLOWED_ORIGIN = "https://playwarmer.app"

# D1 database for leaderboards, streaks, reports, statistics and supporter packs.
[[d1_databases]]
binding = "DB"
database_name = "warmer"
database_id = "f2089bff-57e9-4e54-be80-ea66c9da3215"

# Secrets (set with `wrangler secret put NAME`, never commit them):
#   LS_SIGNING_SECRET        Lemon Squeezy webhook signing secret   (optional)
#   STRIPE_WEBHOOK_SECRET    Stripe webhook signing secret          (optional)
