# One Cloudflare Worker serves both the site (dist/) and the API (/api/*). See worker/README.md.
name = "wiki"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[build]
command = "npm run build:site"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Origin allowed to call the API from a browser. Use your site, e.g. "https://wikilink.app". "*" is fine for testing.
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "wiki"
# database_id is omitted on purpose: wrangler creates the D1 database on first deploy.

# Secrets (set with `wrangler secret put NAME`, never commit them):
#   LS_SIGNING_SECRET        Lemon Squeezy webhook signing secret   (optional)
#   STRIPE_WEBHOOK_SECRET    Stripe webhook signing secret          (optional)
