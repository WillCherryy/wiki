<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wikilink — the daily Wikipedia race</title>
<meta name="description" content="Race from one Wikipedia article to another using only links. A new puzzle every day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2316130f'/%3E%3Ccircle cx='8' cy='21' r='3.2' fill='%23f3eee4'/%3E%3Cpath d='M11 19c4-10 9-8 11-8' stroke='%23f3eee4' stroke-width='2' fill='none' stroke-dasharray='1 3.4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='10' r='3.8' fill='%23d63a1f'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/instrument-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <button class="logo" id="logo" aria-label="Home">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 34 20"><circle cx="4" cy="13" r="3.2"/><path d="M8 12C13 0 21 1 26 8"/><circle class="hot" cx="30" cy="9" r="3.6"/></svg></span>
    <span class="word" data-brand>wiki<b>link</b></span>
  </button>
  <div class="spacer"></div>
  <button class="status hide-s" id="streakChip" title="Daily streak"><svg class="ic fl" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg><span><b id="streakN">0</b> streak</span></button>
  <button class="status rankchip" id="rankChip" title="Your rank"><span class="dot"></span><span id="rankName">Wanderer</span></button>
  <button class="chip iconbtn" id="lbBtn" aria-label="Leaderboards"><svg class="ic" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></button>
  <button class="chip iconbtn" id="themeBtn" aria-label="Switch light or dark"></button>
  <button class="chip iconbtn" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg></button>
</div></header>

<main class="wrap">
  <section id="home">
    <div class="plate">
      <div class="plate-meta"><span id="plateDate">Today</span><span id="plateNo"></span></div>
      <h1 class="plate-from" id="fromTitle">&nbsp;</h1>
      <p class="plate-cap" id="fromDesc"></p>
      <div class="plate-route" aria-hidden="true"><i></i><span>to</span><i></i></div>
      <div class="plate-to" id="toTitle" role="heading" aria-level="2">&nbsp;</div>
      <p class="plate-cap" id="toDesc"></p>
      <div class="plate-facts" id="plateFacts"></div>
      <div class="plate-act" id="heroAct"></div>
      <div class="next" id="nextIn"></div>
    </div>
    <nav class="quiet" id="quiet" aria-label="More to play"></nav>
    <footer class="foot"><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · Article text from <a href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a> (CC BY-SA 4.0). Not affiliated with Wikipedia or the Wikimedia Foundation.</footer>
  </section>

  <section id="game">
    <aside class="rail l">
      <div class="hud">
        <div class="hud-row">
          <button class="target" id="targetBtn" title="Show target summary (T)"><span><small id="reachLab">Reach</small><strong id="tName">…</strong></span></button>
          <div class="metric"><b id="mClicks">0</b><span>Clicks</span></div>
          <div class="metric"><b id="mTime">0:00</b><span>Time</span></div>
          <div class="signal"><div class="lab"><span>Temperature</span><b id="sigLab">Cold</b></div><div class="bar"><i id="sigBar"></i></div></div>
        </div>
        <div class="trail trailM" id="trailM"></div>
      </div>
      <div class="tools">
        <label class="finder"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="finder" placeholder="Find a link  ( / )" autocomplete="off" spellcheck="false"><span id="finderN"></span></label>
        <button class="chip" id="tocBtn" title="Jump to a section (C)">Contents <small>sections</small></button>
        <button class="chip" id="backBtn" title="Back (B)">Back <small>+1 click</small></button>
        <button class="chip" id="rewindBtn" title="Watch a short video to undo your last click for free">Rewind <small>1 left</small></button>
        <div class="fsrow"><button class="chip" id="fsDown" aria-label="Smaller text">A−</button><button class="chip" id="fsUp" aria-label="Larger text">A+</button></div>
        <button class="chip" id="giveUp">Give up</button>
      </div>
    </aside>
    <div class="mainc">
      <div class="found" id="found"><span>The target is linked on this page.</span><button id="jump">Show me</button></div>
      <article class="card article" id="article"></article>
    </div>
    <aside class="rail r">
      <div class="routecard"><h4>Your route</h4><div class="trail" id="trail"></div></div>
      <div class="routecard" id="tocCard"><h4>Contents</h4><nav class="toc" id="toc"></nav></div>
      <div class="routecard"><h4>Shortcuts</h4><div class="keys"><span><kbd>/</kbd> Find a link</span><span><kbd>B</kbd> Back</span><span><kbd>C</kbd> Contents</span><span><kbd>T</kbd> Target</span><span><kbd>?</kbd> Help</span></div></div>
    </aside>
  </section>
</main>

<div class="scrim" id="scrim"><div class="card modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script src="config.js"></script>
<script src="cats.js"></script>
<script src="packs.js"></script>
<script src="clean.js"></script>
<script>
'use strict';
const CFG = window.WIKIIO || {};
const BRAND = { name: CFG.name || 'wikilink', domain: CFG.domain || 'wikilink.app', a: CFG.brandA || 'wiki', b: CFG.brandB || 'link' };
document.title = `${BRAND.name} — the daily Wikipedia race`;
document.querySelectorAll('[data-brand]').forEach(el => { el.innerHTML = `${BRAND.a}<b>${BRAND.b}</b>`; });
/* ------------------------------------------------------------------ data */
let POOL = CATS; // replaced by pool.json when present
const RANKS = [
  {n:'Wanderer', xp:0, c:'#8a94a6'}, {n:'Reader', xp:100, c:'#3aa7ff'}, {n:'Scholar', xp:300, c:'#22c5a1'},
  {n:'Navigator', xp:650, c:'#8b5cf6'}, {n:'Cartographer', xp:1100, c:'#f59e0b'}, {n:'Archivist', xp:1800, c:'#ef6a4d'},
  {n:'Sage', xp:2800, c:'#ec4899'}, {n:'Oracle', xp:4200, c:'#f43f5e'}
];
const STOP = new Set('about above after again against also among another because been before being between both could does during each from have having here into just more most much only other over same should since some such than that their them then there these they this those through under until very were what when where which while will with within without would your'.split(' '));

/* --------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t).replace(/_/g, ' ').trim().toLowerCase();
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hash(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function rng(seed) { let a = hash(seed)(); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const dayKey = (d = new Date()) => d.toLocaleDateString('en-CA');
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(2026, 0, 1)) / 864e5) + 1; };
const yesterday = k => { const [y, m, d] = k.split('-').map(Number); return dayKey(new Date(y, m - 1, d - 1)); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }

/* --------------------------------------------------------------- storage */
const KEY = 'wikiio:v1', CUR = 'wikiio:cur';
function loadP() {
  let p = {}; try { p = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
  return Object.assign({ pid: Math.random().toString(36).slice(2, 12), name: '', xp: 0, streak: 0, lastDay: '', days: {}, played: 0, won: 0, best: 0, theme: '', maxStreak: 0, clicksTotal: 0, fastWins: 0, lowWins: 0, ach: {}, leagues: [], fs: 0, parWins: 0, puristWins: 0, packs: {}, packSolves: 0, challengeWins: 0, cos: { theme: 'classic', trail: 'classic', confetti: 'classic' }, cosSeen: [] }, p);
}
let P = loadP();
const saveP = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch {} };
const rankOf = xp => { let i = 0; RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; }); return i; };

const TIERS = [{ n: 'Bronze', c: '#c8793c' }, { n: 'Silver', c: '#9aa6b8' }, { n: 'Gold', c: '#f2b01e' }, { n: 'Diamond', c: '#4cc9f0' }];
const ACH = [
  { id: 'streak', icon: '🔥', name: 'On Fire', desc: 'Longest daily streak', goals: [3, 7, 30, 100], val: () => P.maxStreak },
  { id: 'solver', icon: '🧭', name: 'Navigator', desc: 'Puzzles solved', goals: [1, 10, 50, 250], val: () => P.won },
  { id: 'lean', icon: '🎯', name: 'Sharpshooter', desc: 'Solves in 3 clicks or fewer', goals: [1, 5, 25, 100], val: () => P.lowWins },
  { id: 'fast', icon: '⚡', name: 'Speedrunner', desc: 'Solves in under 60 seconds', goals: [1, 5, 20, 75], val: () => P.fastWins },
  { id: 'par', icon: '⛳', name: 'Par Master', desc: 'Solves at or under par', goals: [1, 10, 30, 100], val: () => P.parWins },
  { id: 'surf', icon: '🌊', name: 'Link Surfer', desc: 'Total clicks made', goals: [50, 250, 1000, 5000], val: () => P.clicksTotal },
  { id: 'purist', icon: '◆', name: 'Purist', desc: 'Solves without link search or rewind', goals: [1, 10, 30, 100], val: () => P.puristWins },
  { id: 'regular', icon: '📅', name: 'Regular', desc: 'Daily puzzles played', goals: [7, 30, 100, 365], val: () => Object.keys(P.days).length }
];
function checkAch() {
  const out = [];
  ACH.forEach(a => { const v = a.val(); let t = -1; a.goals.forEach((g, i) => { if (v >= g) t = i; }); const had = P.ach[a.id] ?? -1; if (t > had) { P.ach[a.id] = t; out.push({ a, tier: t }); } });
  if (out.length) saveP(); return out;
}

/* --------------------------------------------------------------- wikipedia */
const API = 'https://en.wikipedia.org/w/api.php';
const pages = new Map(), sums = new Map();
async function getSummary(title) {
  if (sums.has(title)) return sums.get(title);
  const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, '_'))}?redirect=true`);
  if (!r.ok) throw new Error('summary');
  const j = await r.json();
  const s = { title: j.title, desc: j.description || '', extract: j.extract || '', thumb: j.thumbnail && j.thumbnail.source };
  sums.set(title, s); return s;
}
const inflight = new Map();
function getPage(title) {
  const k = norm(title); if (pages.has(k)) return Promise.resolve(pages.get(k));
  if (!inflight.has(k)) inflight.set(k, loadPage(title).finally(() => inflight.delete(k)));
  return inflight.get(k);
}
async function loadPage(title) {
  const k = norm(title);
  const url = `${API}?action=parse&format=json&formatversion=2&origin=*&redirects=1&prop=text&disableeditsection=1&disablelimitreport=1&disabletoc=1&page=${encodeURIComponent(title)}`;
  const r = await fetch(url); if (!r.ok) throw new Error('net');
  const j = await r.json(); if (j.error) throw new Error(j.error.info || 'missing');
  const doc = new DOMParser().parseFromString(j.parse.text, 'text/html');
  const root = doc.querySelector('.mw-parser-output') || doc.body;
  WikiClean.clean(root);
  const text = root.textContent.toLowerCase();
  const out = { title: j.parse.title, html: root.innerHTML, tokens: new Set(text.match(/[a-z]{4,}/g) || []),
    links: new Set([...root.querySelectorAll('a[data-t]')].map(a => norm(a.dataset.t))) };
  pages.set(k, out); pages.set(norm(out.title), out); return out;
}

/* ------------------------------------------------------------------ puzzle */
let PACKDATA = null; // verified pack puzzles (tools/build-packs.js)
let PUZZLES = null; // precomputed daily schedule (tools/build-puzzles.js): { 'YYYY-MM-DD': {from, to, par, route, cats} }
async function loadData() {
  const get = async u => { try { const r = await fetch(u + '?d=' + dayKey()); return r.ok ? await r.json() : null; } catch { return null; } };
  const [pz, pool, pk] = await Promise.all([get('puzzles.json'), get('pool.json'), get('packs.json')]);
  if (pz && pz.days) PUZZLES = pz.days;
  if (pk && pk.packs) PACKDATA = pk.packs;
  if (pool && Object.keys(pool).length > 3) POOL = pool;
}
const diffOf = par => par <= 2 ? 'Easy' : par === 3 ? 'Medium' : par === 4 ? 'Hard' : 'Expert';
async function getDaily(day) {
  const e = PUZZLES && PUZZLES[day];
  if (e) return { from: e.from, to: e.to, ka: (e.cats || [])[0] || '', kb: (e.cats || [])[1] || '', par: e.par, route: e.route };
  const [from, to, ka, kb] = await resolvePair('wiki.io/' + day);
  return { from, to, ka, kb, par: null, route: null };
}
function pickPair(seed) {
  const keys = Object.keys(POOL), r = rng(seed), ka = keys[Math.floor(r() * keys.length)]; let kb;
  do kb = keys[Math.floor(r() * keys.length)]; while (kb === ka);
  const A = POOL[ka], B = POOL[kb];
  return [A[Math.floor(r() * A.length)], B[Math.floor(r() * B.length)], ka, kb];
}
const pairCache = new Map();
// Deterministically walks to the next candidate if a title has gone missing, so everyone still gets the same puzzle.
async function resolvePair(seed) {
  if (pairCache.has(seed)) return pairCache.get(seed);
  let first;
  for (let i = 0; i < 6; i++) {
    const p = pickPair(i ? seed + '#' + i : seed); first = first || p;
    try { await Promise.all([getSummary(p[0]), getSummary(p[1])]); pairCache.set(seed, p); return p; } catch { if (!navigator.onLine) break; }
  }
  return first;
}
const todaySeed = () => 'wiki.io/' + dayKey();

/* ------------------------------------------------------------------- state */
let G = null; // {mode, day, from, to, path[], steps[{title,sig}], base, t0, done, keywords:Set, toTitle}
let tick = null;

const elapsed = () => G ? G.base + (G.t0 ? (Date.now() - G.t0) / 1000 : 0) : 0;
function persistCur() { if (!G || G.done) { try { localStorage.removeItem(CUR); } catch {} return; } try { localStorage.setItem(CUR, JSON.stringify({ mode: G.mode, day: G.day, from: G.from, to: G.to, path: G.path, steps: G.steps, timeline: G.timeline, rewinds: G.rewinds, usedFind: !!G.usedFind, moves: G.moves || 0, base: elapsed() })); } catch {} }

function show(view) { $('#home').style.display = view === 'home' ? '' : 'none'; $('#game').classList.toggle('on', view === 'game'); window.scrollTo({ top: 0 }); }
function setTemp(sg) { document.documentElement.style.setProperty('--temp', tempCss(sg)); }
function sigLabel(s) { return s >= .97 ? 'In sight!' : s > .72 ? 'Burning' : s > .5 ? 'Hot' : s > .32 ? 'Warm' : s > .15 ? 'Cool' : 'Cold'; }
const SQ = ['⬜', '🟦', '🟩', '🟨', '🟧', '🟥'];
const sigSquare = s => SQ[Math.min(5, Math.floor(s * 5.99))];

/* ------------------------------------------------------------------- render */
function renderHeader() {
  const ri = rankOf(P.xp), r = RANKS[ri];
  $('#rankName').textContent = r.n; $('#rankChip').style.setProperty('--rc', r.c);
  $('#streakN').textContent = P.streak;
}
function fitHero(el, text) { const n = text.length; el.style.setProperty('--fit', n <= 13 ? 1 : n <= 18 ? .8 : n <= 24 ? .64 : .52); }
function setPlate(d, sa, sb) {
  const from = sa ? sa.title : d.from, to = sb ? sb.title : d.to, cap = x => x ? (x.desc || (x.extract || '').split(/(?<=\.)\s/)[0] || '') : '';
  $('#fromTitle').textContent = from; fitHero($('#fromTitle'), from); $('#fromDesc').textContent = cap(sa);
  $('#toTitle').textContent = to; fitHero($('#toTitle'), to); $('#toDesc').textContent = cap(sb);
  $('#plateFacts').innerHTML = [d.par ? `Par ${d.par}` : '', d.par ? diffOf(d.par) : '', d.ka && d.kb ? `${esc(d.ka)} → ${esc(d.kb)}` : ''].filter(Boolean).map(t => `<span>${t}</span>`).join('');
}
function dailyCtx() {
  const day = dayKey(), e = P.days[day]; if (!e) return null;
  G = { mode: 'daily', day, done: true, result: { won: e.won, clicks: e.clicks, secs: e.secs, score: e.score, path: e.path, steps: (e.steps || []).map(x => ({ sig: x })), gain: 0, before: P.xp, mode: 'daily', par: e.par || null, stars: e.stars || 0, timeline: e.timeline || null, from: e.from, to: e.to, rewinds: e.rewinds || 0, purist: !!e.purist } };
  return G.result;
}
function playDaily() {
  const day = dayKey(); if (P.days[day]) { dailyCtx(); return showResult(); }
  const cur = readCur(); startGame('daily', cur && cur.mode === 'daily' && cur.day === day ? cur : null);
}
function renderHeroAct() {
  const day = dayKey(), e = P.days[day], cur = readCur(), box = $('#heroAct');
  if (e) {
    box.innerHTML = `<div class="stamp"><b>${e.won ? 'Solved' : 'Not today'}</b><span>${e.won ? `${e.clicks} click${e.clicks === 1 ? '' : 's'} · ${fmt(e.secs)}${e.par ? ` · par ${e.par}` : ''}${e.stars ? ' · ' + '★'.repeat(e.stars) : ''}${e.purist ? ' · ◆ purist' : ''}` : 'Back tomorrow'}</span></div>
      <div class="act-row">${e.won ? '<button class="btn" id="heroShare">Share card</button><button class="btn ghost" id="heroChal">Challenge a friend</button><button class="btn ghost" id="heroMap">Path map</button>' : ''}<button class="btn ghost" id="heroResult">Full result</button></div>`;
    if ($('#heroShare')) { $('#heroShare').onclick = () => openShareCard(dailyCtx(), () => closeModal()); $('#heroChal').onclick = () => openChallenge(dailyCtx(), () => closeModal()); $('#heroMap').onclick = () => openPathMap(dailyCtx()); }
    $('#heroResult').onclick = () => { dailyCtx(); showResult(); };
  } else {
    const resume = cur && cur.mode === 'daily' && cur.day === day;
    box.innerHTML = `<button class="btn big" id="playBtn">${resume ? 'Resume today’s puzzle' : 'Play today’s puzzle'} <span class="arr">→</span></button>`;
    $('#playBtn').onclick = playDaily;
  }
}
function renderQuiet() {
  const open = allCos().filter(isUnlocked).length, tot = allCos().length, solved = PACKS.reduce((n, p) => n + packStats(p.id).solved, 0), pt = PACKS.reduce((n, p) => n + p.puzzles.length, 0);
  $('#quiet').innerHTML = `<button class="qlink" id="qLb">Leaderboard</button><button class="qlink" id="qPacks">Packs <small>${solved}/${pt}</small></button><button class="qlink" id="qLocker">Locker <small>${open}/${tot}</small></button><button class="qlink" id="qLeague">Leagues</button><button class="qlink" id="qPractice">Practice</button>`;
  $('#qLb').onclick = () => openLeaderboard('day'); $('#qPacks').onclick = openPacks; $('#qLocker').onclick = () => openLocker(); $('#qLeague').onclick = () => leagueModal(); $('#qPractice').onclick = () => startGame('practice');
}
async function renderHome() {
  const day = dayKey();
  $('#plateDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#plateNo').textContent = `Plate No. ${dayNum(day)}`;
  renderHeader(); renderHeroAct(); renderQuiet();
  let d = { from: '', to: '', ka: '', kb: '' };
  try { d = await getDaily(day); } catch { const [a, b, ka, kb] = pickPair(todaySeed()); d = { from: a, to: b, ka, kb }; }
  setPlate(d, null, null);
  try { const [sa, sb] = await Promise.all([getSummary(d.from), getSummary(d.to)]); setPlate(d, sa, sb); } catch {}
}
function readCur() { try { return JSON.parse(localStorage.getItem(CUR)); } catch { return null; } }

/* ------------------------------------------------------------------ gameplay */
async function startGame(mode, resume, extra) {
  const day = dayKey();
  show('game'); setTemp(0);
  $('#article').innerHTML = `<div class="loading"><div class="spin"></div>Setting up your puzzle…</div>`;
  let from, to, meta = { par: null, route: null };
  if (mode === 'daily') { meta = await getDaily(day); ({ from, to } = meta); if (resume && resume.from !== from) resume = null; }
  else if (mode === 'challenge') { resume = null; from = extra.f; to = extra.t; }
  else if (mode === 'pack') { resume = null; const z = packPuzzle(extra.pack, extra.idx); from = z.from; to = z.to; meta = { par: z.par || null, route: z.route || null, goal: z.goal }; }
  else { resume = null; [from, to] = await resolvePair('p' + Math.random()); }
  G = { mode, day, from, to, extra, usedFind: false, goal: meta.goal || null, path: [], steps: [], timeline: [], rewinds: 0, par: meta.par, route: meta.route, base: 0, moves: 0, t0: 0, done: false, keywords: new Set(), toTitle: to };
  if (resume) Object.assign(G, { path: resume.path, steps: resume.steps, timeline: resume.timeline || [], rewinds: resume.rewinds || 0, usedFind: !!resume.usedFind, moves: resume.moves || 0, base: resume.base });
  $('#reachLab').textContent = mode === 'challenge' ? `Reach · beat ${extra.n}'s ${extra.c}` : mode === 'pack' ? `Reach · goal ≤ ${G.goal}` : G.par ? `Reach · par ${G.par}` : 'Reach';
  show('game'); setTemp(0);
  $('#tName').textContent = G.to; $('#mClicks').textContent = 0; $('#mTime').textContent = '0:00'; $('#trail').innerHTML = '';
  $('#article').innerHTML = `<div class="loading"><div class="spin"></div>Loading ${esc(G.from)}…</div>`;
  try {

function drawFrame(ctx, W, d, st) {

function openReplay(back) {
  const d = replayData(), S = buildSegs(d); let t = 0, playing = true, speed = 1, last = performance.now(), raf = 0;
  const canRec = !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
  openModal(`<h2>Replay</h2><p style="margin-bottom:12px">${esc(d.from)} → ${esc(d.to)}</p>
    <canvas id="rpc" width="720" height="720" style="width:100%;aspect-ratio:1;border-radius:16px;display:block;background:#111"></canvas>
    <input id="rpSeek" type="range" min="0" max="1000" value="0" style="width:100%;margin:12px 0 2px;accent-color:var(--accent)" aria-label="Seek">
    <div class="actions"><button class="btn ghost" id="rpPlay">⏸ Pause</button><button class="btn ghost" id="rpSpeed">1×</button>${canRec ? '<button class="btn ghost" id="rpSave">⬇ Save video</button>' : ''}</div>
    <div class="actions" style="margin-top:10px"><button class="btn ghost" id="rpBack">← Back</button></div>`, () => cancelAnimationFrame(raf));
  const cv = $('#rpc'), ctx = cv.getContext('2d');
  const paint = () => drawFrame(ctx, 720, d, stateAt(d, S, t));
  const loop = now => {
    if (playing) { t += (now - last) / 1000 * speed; if (t >= S.total) { t = S.total; playing = false; $('#rpPlay').textContent = '↻ Replay'; } }
    last = now; paint(); $('#rpSeek').value = Math.round(t / S.total * 1000); raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  $('#rpPlay').onclick = () => { if (t >= S.total) t = 0; playing = !playing; $('#rpPlay').textContent = playing ? '⏸ Pause' : '▶ Play'; last = performance.now(); };
  $('#rpSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; $('#rpSpeed').textContent = speed + '×'; };
  $('#rpSeek').oninput = e => { t = e.target.value / 1000 * S.total; playing = false; $('#rpPlay').textContent = '▶ Play'; };

async function exportVideo(d, S, btn) {

/* contents: jump between sections of the current article */
let tocItems = [], tocObs = null;
function gotoSection(id) { const el = id === 'top' ? $('#article') : document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function buildContents() {
  const hs = [...document.querySelectorAll('#article h2, #article h3')].filter(h => h.textContent.trim()).slice(0, 60);
  tocItems = hs.map((h, i) => { h.id = 'sec-' + i; return { id: h.id, t: h.textContent.trim(), lvl: h.tagName === 'H2' ? 1 : 2 }; });

/* usability: link finder, text size, keyboard, hover prefetch, countdown */
let hits = [], hi = -1;

let hoverT;

  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || $('#scrim').classList.contains('on')) return;
