}

/* ---------------------------------------------------------------- finishing: bloom, grade, vignette, grain, letterbox, type */
const bc = mk(W / 4, H / 4), bx = bc.getContext('2d'), VIG = (() => { const c = mk(W, H), x = c.getContext('2d'), gr = x.createRadialGradient(W / 2, H / 2, M * .32, W / 2, H / 2, Math.hypot(W, H) * .52); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.62)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); return c; })();

  { const sg = g.createLinearGradient(0, H - BAR - 230, 0, H - BAR); sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = sg; g.fillRect(0, H - BAR - 230, W, 230); }   // a soft shade under the words

/* ---------------------------------------------------------------- the frame */
window.render = t => {
