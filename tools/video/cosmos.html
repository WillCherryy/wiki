    let gr = x.createRadialGradient(px, py, 0, px, py, 7 * m); gr.addColorStop(0, `rgba(${tint},.95)`); gr.addColorStop(.25, `rgba(${tint},.35)`); gr.addColorStop(1, `rgba(${tint},0)`); x.fillStyle = gr; x.beginPath(); x.arc(px, py, 7 * m, 0, 6.283); x.fill();

/* ---------------------------------------------------------------- the game's own universe, for Earth, the stars and TON 618 */
const L0 = []; SKY.OBJ.forEach((o, i) => SKY.POOL[o.id].forEach(q => L0.push({ ...q, id: o.id, idx: i, count: 1 })));
const lay = SKY.layout(L0); window.lay = lay;
const eng = mk(W, H), eg = eng.getContext('2d');
const uni = (cam, t, o = {}) => { eg.fillStyle = '#000'; eg.fillRect(0, 0, W, H); return SKY.universe(eg, W, H, t, lay, { cam: { ox: 0, oy: 0, ...cam }, noMini: true, tau: 40, pt: o.pt || 0, spin: o.spin || 0, cc: o.cc || 0 }); };
const find = (pos, n) => pos.find(q => q.n === n);
window.probe = names => { const pos = uni({ x: 0, y: 0, z: 1e-6 }, 40); return names.map(n => { const p = find(pos, n); return p ? { n, wx: p.wx, wy: p.wy, ax: p.ax, ay: p.ay, lx: p.lx, ly: p.ly } : { n, missing: true }; }); };
let T = {};
function locate() {   // where everything is, measured once: a planet's offset from its star is re-measured close up so it is exact
  const [sun, bet, crab, ton] = probe(['The Sun', 'Betelgeuse', 'Crab Pulsar', 'TON 618']); let e = probe(['Earth'])[0];
  for (const zz of [1e6, 1e9, 1e11]) { const p = find(uni({ x: e.ax, y: e.ay, ox: e.lx, oy: e.ly, z: zz }, 40), 'Earth'); if (p) e = { ...e, lx: p.lx, ly: p.ly }; }
  const zf = n => { const b = lay.bodies[lay.idxOf[n]]; return H * .17 / (SKY.physR(b) * SKY.RSU); };
  window.__T = T = { sun, earth: e, bet, crab, ton, zE: H * .2 / (1 * .009158 * SKY.RSU), zBet: zf('Betelgeuse'), zCrab: zf('Crab Pulsar'), zTon: zf('TON 618') };
}

/* ---------------------------------------------------------------- shots */
let SKYC = null, RIDGE = null, GAL = null, DEEP = null;
function shotSky(t, a) {   // the sky turns slowly about the pole, above the fixed ridge; the camera drifts upward and in
  const u = (t - SH.sky[0]) / (SH.sky[1] - SH.sky[0]); g.save(); g.globalAlpha = a; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const z = 1.0 + .07 * io(u), ty = lerp(-60, 30, io(u));
  g.save(); g.translate(W / 2, H / 2 + ty); g.scale(z, z); g.rotate(-.022 * u); g.drawImage(SKYC, -W * .66, -H * .62, W * 1.32, H * 1.2); g.restore();
  g.save(); g.translate(W / 2, H / 2 + ty * 1.25); g.scale(z * 1.01, z * 1.01); g.drawImage(RIDGE, -W * .66, -H * .6, W * 1.32, H * 1.2); g.restore();
  g.restore();
}
function shotEarth(t, a) {   // from Earth to the edge of the Kuiper belt in one breath: the camera stays on Earth, then settles on the Sun
  const u = clamp((t - SH.earth[0]) / (SH.earth[1] - SH.earth[0])), z0 = T.zE * 1.25, zM = 3.2e7, z1 = 1.9e6, L0 = Math.log(z0);   // linger on Earth, cross the empty millions of kilometres quickly, then settle over the Sun's family
  const lz = u < .36 ? L0 - .7 * ss(u / .36) : u < .56 ? lerp(L0 - .7, Math.log(zM), io((u - .36) / .2)) : lerp(Math.log(zM), Math.log(z1), 1 - Math.pow(1 - (u - .56) / .44, 2.2)), z = Math.exp(lz);
  const AU = Math.hypot(T.earth.lx, T.earth.ly), zA = 280 / AU, s = ss((Math.log(z) - Math.log(zA)) / Math.log(40));   // 1 while Earth fills the frame, 0 once the Sun's family is in view
  uni({ x: T.sun.wx, y: T.sun.wy, ox: T.earth.lx * s, oy: T.earth.ly * s, z }, 40, { pt: 0 });
  g.save(); g.globalAlpha = a; g.drawImage(eng, 0, 0); g.restore();
}
function shotMW(t, a) {   // the galaxy, seen almost edge-on and close, turning towards us as the camera pulls away
  const u = clamp((t - SH.mw[0]) / (SH.mw[1] - SH.mw[0])), e = io(u), ci = lerp(.13, .6, e), sc = lerp(2.05, .98, Math.pow(e, .8)), rot = -.5 + .16 * u, D = W * sc, cx = W / 2, cy = H * lerp(.5, .5, e);
  g.save(); g.globalAlpha = a; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); SKY.starBg(g, W, H, 2600, 31, null); g.globalAlpha = a;
  g.translate(cx, cy); g.scale(1, ci); g.rotate(rot); g.globalCompositeOperation = 'lighter'; g.drawImage(GAL, -D / 2, -D / 2, D, D); g.restore();
  // the bulge stays round however the disc is tilted
  g.save(); g.globalAlpha = a * Math.pow(clamp((.45 - ci) / .32), 2) * .55; g.globalCompositeOperation = 'lighter'; const br = D * .07, gr = g.createRadialGradient(cx, cy, 0, cx, cy, br); gr.addColorStop(0, 'rgba(255,214,160,.85)'); gr.addColorStop(.4, 'rgba(255,190,130,.25)'); gr.addColorStop(1, 'rgba(255,170,110,0)'); g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy, br, br * .8, 0, 0, 6.283); g.fill(); g.restore();
  // you are here: about 26,000 light-years from the centre, between two arms
  const ya = ramp(t, 34.2, 41.2, 1.4, 1.2) * a; if (ya > 0) { const rs = .44 * .52 * D, th = 2.35, px = Math.cos(th) * rs, py = Math.sin(th) * rs, X = cx + px * Math.cos(rot) - py * Math.sin(rot), Y = cy + (px * Math.sin(rot) + py * Math.cos(rot)) * ci;
    g.save(); g.globalAlpha = ya; g.strokeStyle = 'rgba(236,230,218,.75)'; g.lineWidth = 1; g.beginPath(); g.arc(X, Y, 7 + 3 * Math.sin((t - 34) * 2), 0, 6.283); g.stroke(); g.fillStyle = '#fff'; g.beginPath(); g.arc(X, Y, 1.6, 0, 6.283); g.fill();
    g.beginPath(); g.moveTo(X + 10, Y - 10); g.lineTo(X + 54, Y - 54); g.lineTo(X + 92, Y - 54); g.stroke(); g.font = 'italic 400 21px EB'; g.fillStyle = 'rgba(236,230,218,.9)'; g.textAlign = 'left'; g.fillText('You are here', X + 100, Y - 48); g.restore(); }
}
function shotStar(t, a, which) {   // Betelgeuse turning slowly; the Crab Pulsar's beams sweeping
  const k = which === 'bet' ? SH.bet : SH.crab, u = (t - k[0]) / (k[1] - k[0]), b = T[which], z0 = which === 'bet' ? T.zBet * 1.05 : T.zCrab * .42, z1 = z0 * (which === 'bet' ? 1.28 : 1.22), z = Math.exp(lerp(Math.log(z0), Math.log(z1), io(u)));
  uni({ x: b.wx, y: b.wy, z }, which === 'bet' ? 40 + t * .2 : 40 + t * .15);
  g.save(); g.globalAlpha = a; g.drawImage(eng, 0, 0); g.restore();
}
function shotTon(t, a) {   // TON 618's host galaxy, then a dissolve straight into its heart and a long push towards the black hole
  const t0 = SH.ton[0], tm = 60.4, t1 = SH.ton[1], aA = 1 - ss((t - tm + 1.1) / 1.1), aB = ss((t - tm) / 1.5);   // one view at a time: the engine's cloud detail must not be shared between two zooms in one frame
  if (aA > 0) { const z = Math.exp(lerp(Math.log(.145), Math.log(.26), io((t - t0) / (tm + 1.6 - t0)))); uni({ x: T.ton.wx, y: T.ton.wy, z }, 40 + t * .25); g.save(); g.globalAlpha = a * aA; g.drawImage(eng, 0, 0); g.restore(); }
  if (aB > 0) { const u = clamp((t - tm) / (t1 - tm)), z = Math.exp(lerp(Math.log(T.zTon * .055), Math.log(T.zTon * .21), 1 - Math.pow(1 - u, 2.4))); uni({ x: T.ton.wx, y: T.ton.wy, z }, 40 + t * .25); g.save(); g.globalAlpha = a * aB; g.drawImage(eng, 0, 0); g.restore(); }
}
function shotDeep(t, a) {
  const u = clamp((t - SH.deep[0]) / (SH.deep[1] - SH.deep[0])), z = lerp(1.32, 1.0, io(u));
  g.save(); g.globalAlpha = a; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.translate(W / 2, H / 2); g.scale(z, z); g.drawImage(DEEP, -W * .55, -H * .55, W * 1.1, H * 1.1); g.restore();
}
const LOGOW = new Image(); LOGOW.src = window.LOGO.word;
function endCard(t) {   // the mark arrives one dot at a time, then the name, the line and the address
  const a0 = ramp(t, SH.end[0] + .4, DUR - .2, 2.2, 1.4); if (a0 <= 0) return; const lv = window.LOGO, sc = 1.15, ox = W / 2 - lv.vb[0] * sc / 2, oy = H / 2 - lv.vb[1] * sc / 2 - 40;
  g.save(); lv.dots.forEach((d, i) => { const k = ss((t - (SH.end[0] + 1.0 + i * .22)) / .9) * a0; if (k <= 0) return; g.globalAlpha = k; g.fillStyle = d.c; g.shadowColor = d.c; g.shadowBlur = 18 * k; g.beginPath(); g.arc(ox + d.x * sc, oy + d.y * sc, d.r * sc * (.6 + .4 * k), 0, 6.283); g.fill(); });
  g.shadowBlur = 0; const kw = ss((t - (SH.end[0] + 2.0)) / 1.6) * a0; if (kw > 0 && LOGOW.complete) { g.globalAlpha = kw; g.drawImage(LOGOW, ox, oy, lv.vb[0] * sc, lv.vb[1] * sc); }
  const k2 = ss((t - (SH.end[0] + 3.6)) / 1.6) * a0; if (k2 > 0) { g.globalAlpha = k2; g.fillStyle = 'rgba(236,230,218,.92)'; g.textAlign = 'center'; g.font = 'italic 400 34px EB'; g.fillText('Find them, one Wikipedia link at a time.', W / 2, oy + lv.vb[1] * sc + 34); }
  const k3 = ss((t - (SH.end[0] + 5.0)) / 1.6) * a0; if (k3 > 0) { g.globalAlpha = k3 * .85; g.fillStyle = '#b9b2cf'; g.font = '300 17px Jost'; g.letterSpacing = '9px'; g.fillText('PLAYSCORCHER.COM', W / 2 + 4, oy + lv.vb[1] * sc + 92); g.letterSpacing = '0px'; }
  g.restore();
}

/* ---------------------------------------------------------------- finishing: bloom, grade, vignette, grain, letterbox, type */
const bc = mk(480, 270), bx = bc.getContext('2d'), VIG = (() => { const c = mk(W, H), x = c.getContext('2d'), gr = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.62)'); x.fillStyle = gr; x.fillRect(0, 0, W, H); return c; })();
const GRAIN = (() => { const c = mk(512, 512), x = c.getContext('2d'), im = x.createImageData(512, 512), r = mul(5); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 90; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } x.putImageData(im, 0, 0); return c; })();
function finish(t) {
  bx.filter = 'blur(5px)'; bx.clearRect(0, 0, 480, 270); bx.drawImage(cv, 0, 0, 480, 270); bx.filter = 'none';
  g.save(); g.globalCompositeOperation = 'screen'; g.globalAlpha = .42; g.drawImage(bc, 0, 0, W, H); g.restore();
  g.drawImage(VIG, 0, 0);
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .07; const gx = Math.floor((t * 977) % 512), gy = Math.floor((t * 613) % 512); for (let x = -gx; x < W; x += 512) for (let y = -gy; y < H; y += 512) g.drawImage(GRAIN, x, y); g.restore();
  { const sg = g.createLinearGradient(0, H - BAR - 230, 0, H - BAR); sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.5)'); g.fillStyle = sg; g.fillRect(0, H - BAR - 230, W, 230); }   // a soft shade under the words
  g.fillStyle = '#000'; g.fillRect(0, 0, W, BAR); g.fillRect(0, H - BAR, W, BAR);
}
function captions(t) {
  CAP.forEach(([a, b, text, kind]) => { const k = ramp(t, a, b, 1.5, 1.2); if (k <= 0) return; g.save(); g.textAlign = 'center';
    if (kind === 'cap') { g.globalAlpha = k * .8; g.fillStyle = '#c9c3da'; g.font = '300 15px Jost'; g.letterSpacing = lerp(13, 8, ss((t - a) / 2.4)) + 'px'; g.fillText(text.toUpperCase(), W / 2 + 4, H - BAR - 118); }
    else { g.globalAlpha = k; g.fillStyle = 'rgba(238,232,220,.94)'; g.font = 'italic 400 42px EB'; g.letterSpacing = '.3px'; g.fillText(text, W / 2, H - BAR - 64 + (1 - ss((t - a) / 1.8)) * 6); }
    g.restore(); });
}

/* ---------------------------------------------------------------- the frame */
window.render = t => {
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const A = n => ramp(t, SH[n][0], SH[n][1], n === 'sky' ? 3 : n === 'mw' ? 2.2 : 1.6, n === 'deep' ? 2.2 : 1.6);
  const a = { sky: A('sky'), earth: A('earth'), mw: A('mw'), bet: A('bet'), crab: A('crab'), ton: A('ton'), deep: A('deep') };
  if (a.sky > 0) shotSky(t, a.sky);
  if (a.earth > 0) shotEarth(t, a.earth);
  if (a.mw > 0) shotMW(t, a.mw);
  if (a.bet > 0) shotStar(t, a.bet, 'bet');
  if (a.crab > 0) shotStar(t, a.crab, 'crab');
  if (a.ton > 0) shotTon(t, a.ton);
  if (a.deep > 0) shotDeep(t, a.deep * (1 - .72 * ss((t - SH.end[0] - .4) / 2.4)));
  finish(t); captions(t); endCard(t);
};
window.bake = async () => { const t0 = performance.now(); SKYC = bakeSky(2400, 1350); RIDGE = bakeRidge(2400, 1350); DEEP = bakeDeep(2400, 1350); GAL = bakeGalaxy(2800); return { ms: Math.round(performance.now() - t0), sky: SKYC.toDataURL('image/png'), ridge: RIDGE.toDataURL('image/png'), deep: DEEP.toDataURL('image/png'), gal: GAL.toDataURL('image/png') }; };
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
(async () => {
  await document.fonts.load('italic 400 42px EB'); await document.fonts.load('300 15px Jost'); await document.fonts.load('400 15px EB');
  locate();
  const q = new URLSearchParams(location.search);
  if (q.get('baked')) { const d = q.get('baked'); [SKYC, RIDGE, DEEP, GAL] = await Promise.all(['sky', 'ridge', 'deep', 'gal'].map(n => load(d + '/' + n + '.png'))); }
  else if (!q.get('nobake')) { await window.bake(); }
  window.__ready = true;
})();
