const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function endCard(){return {html:()=>`<div class="layer">${mark5('em',540,500,10)}</div>${ring('er0',540,500)}${ring('er1',540,500)}
  <div class="abs" style="left:0;right:0;top:840px;text-align:center;font:400 264px/1 EB;letter-spacing:-.03em"><span style="display:block;overflow:hidden;padding:12px 0 36px;margin:-12px 0 -36px"><span class="ew" style="display:inline-block">Scorch<em style="font-style:italic;color:var(--hot)">er</em></span></span></div>
  <div class="abs cap et" style="left:0;right:0;top:1180px;text-align:center;opacity:0">The daily Wikipedia link race</div>

  <div class="abs cap en" style="left:0;right:0;top:1620px;text-align:center;opacity:0;letter-spacing:.2em">Free · No account · New puzzle daily</div>`,
  field:null,
  up:(S,u,b)=>{S.qa('.em').forEach((e,i)=>{const t0=.2+i*.34,k=p(b,t0,t0+.55,E.back);e.style.opacity=b>=t0?1:0;e.style.transform=`scale(${.3+.7*k})`;});
   ringUp(S,'.er0',b,.2+4*.34,1.8,1900);ringUp(S,'.er1',b,.2+4*.34+.3,1.8,1500);
   const wk=p(b,1.9,2.9,E.out5);S.q('.ew').style.transform=`translateY(${(1-wk)*118}%)`;
   const f=(sel,a)=>{const e=S.q(sel),k=p(b,a,a+.7,E.out5);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*34}px)`};f('.et',3.2);f('.eu',3.8);f('.en',5.4);
   const ck=p(b,4.3,5,E.back);S.q('.ec').style.opacity=b>=4.3?1:0;S.q('.ec').style.transform=`scale(${.7+.3*ck+Math.sin(b*4)*.012})`}}}

 {html:()=>{const pg=(title,body,i)=>`<div class="abs pg" style="left:0;right:0;top:0;padding:38px 48px 0;opacity:${i?0:1}"><div style="font:400 108px/1 EB;letter-spacing:-.02em">${title}</div><div style="width:84px;height:6px;background:${C[i]};margin:20px 0 34px"></div><div style="font:400 46px/1.38 EB;color:#2b261f">${body}</div></div>`;
   return `<div class="abs tw" style="left:0;right:0;top:150px;text-align:center;font:italic 400 224px/1 EB"></div>

     ${pg('Tour de France','An annual men\'s cycle race held mainly in <u class="lk">France</u>, with stages in <u>Belgium</u> and <u>Italy</u>.',0)}
     ${pg('France','A country in Western Europe that once ruled a vast <u class="lk">British Empire</u> rival, and traded across the world.',1)}

   <i class="abs rp" style="left:0;top:0;width:10px;height:10px;border-radius:50%;border:6px solid #fff;opacity:0"></i>`},

 {html:()=>`<div class="abs" style="left:70px;top:230px;display:flex;align-items:center;gap:18px"><i style="display:block;width:26px;height:26px;border-radius:50%;background:#ff3b2f" class="lv"></i><span class="cap" style="color:#f3eee4;font-size:30px">Live · lobby K7QMA</span></div>`+

// ------------------------------------------------------------------ engine
const AD=new URLSearchParams(location.search).get('ad')||'trailer', CFG=EPIC[AD], BEAT=60/CFG.bpm, TD=.42, STORYB=STORY[AD];
let acc=0;const SC=CFG.scenes.map((s,i)=>{const o={...s,i,start:acc,end:acc+s.b*BEAT,heat:CFG.heat[i]};acc=o.end;return o});window.DURATION=acc;
$('#scenes').innerHTML=SC.map((s,i)=>`<section class="sc" id="sc${i}">${STORYB[i].html()}</section>`).join('');
const mk=el=>({q:s=>el.querySelector(s),qa:s=>[...el.querySelectorAll(s)]});SC.forEach(s=>{s.el=$('#sc'+s.i);s.S=mk(s.el);s.def=STORYB[s.i]});
const HITS=CFG.hits.map(h=>({t:h.b*BEAT,w:h.w}));
const heatAt=t=>{const s=SC.find(x=>t>=x.start&&t<x.end)||SC[SC.length-1],n=SC[s.i+1],k=clamp((t-s.start)/(s.end-s.start));return n?s.heat+(n.heat-s.heat)*k:s.heat};
const bg=$('#bg').getContext('2d'),fd=$('#fd').getContext('2d'),RNG=rng(11);
const EM=Array.from({length:120},()=>({x:RNG()*W,sp:70+RNG()*260,off:RNG()*3000,s:2+RNG()*5,f:.5+RNG()*2,ph:RNG()*6,a:.3+RNG()*.7,amp:10+RNG()*50,c:RNG()}));
const GRID=[];for(let y=0;y<44;y++)for(let x=0;x<25;x++)GRID.push({x:36+x*42+(y%2)*21,y:100+y*40,r:1.2+hash(x*7+y*13)*2.2,ph:hash(x*3+y*5)*6});
function drawBg(t,h){bg.clearRect(0,0,W,H);const top=mix(rgb('#080706'),rgb('#2a2f4a'),.0),g=bg.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070605');g.addColorStop(1,rampA(h*.9,.5+.2*h));bg.fillStyle=g;bg.fillRect(0,0,W,H);
  const r=bg.createRadialGradient(540,H+60,0,540,H+60,1500);r.addColorStop(0,rampA(h,.75*(.35+.65*h)));r.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=r;bg.fillRect(0,0,W,H);
  if(h>.6){const q=bg.createRadialGradient(540,-100,0,540,-100,1200);q.addColorStop(0,rampA(.85,.35*(h-.6)/.4));q.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=q;bg.fillRect(0,0,W,H)}
  EM.forEach(e=>{const y=H+60-((t*e.sp*(.45+h)+e.off)%(H+160)),x=e.x+Math.sin(t*e.f+e.ph)*e.amp,fl=.55+.45*Math.sin(t*9*e.f+e.ph),a=e.a*(.18+.82*h)*fl;if(a<.02)return;
   bg.fillStyle=rampA(clamp(h*.85+e.c*.25),a*.18);bg.beginPath();bg.arc(x,y,e.s*3,0,7);bg.fill();bg.fillStyle=rampA(clamp(h*.85+e.c*.25),a);bg.beginPath();bg.arc(x,y,e.s,0,7);bg.fill()})}
function drawField(t,o,h){fd.clearRect(0,0,W,H);if(!o)return;
  GRID.forEach(g=>{const a=o.a*(.12+.18*Math.sin(t*1.7+g.ph)**2);fd.fillStyle=`rgba(243,238,228,${a})`;fd.beginPath();fd.arc(g.x,g.y,g.r,0,7);fd.fill()});
  if(o.path){const pts=o.path.pts,tot=pts.length-1,pr=o.path.prog*tot;fd.lineWidth=7;fd.setLineDash([2,18]);fd.lineCap='round';fd.strokeStyle='rgba(243,238,228,.8)';fd.beginPath();fd.moveTo(...pts[0]);
   for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],k=clamp(pr-(i-1));fd.lineTo(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k)}fd.stroke();fd.setLineDash([]);
   pts.forEach((q,i)=>{if(i===0||i===tot)return;const k=clamp(pr-i+.4);if(k<=0)return;fd.fillStyle=ramp(i/tot);fd.beginPath();fd.arc(q[0],q[1],14*k,0,7);fd.fill()})}
  o.nodes.forEach(n=>{if(!(n.a>0))return;const pulse=1+.12*Math.sin(t*7);fd.shadowColor=n.c;fd.shadowBlur=60;fd.fillStyle=n.c;fd.beginPath();fd.arc(n.x,n.y,n.r*n.a*pulse,0,7);fd.fill();fd.shadowBlur=0;fd.strokeStyle=n.c;fd.lineWidth=4;fd.globalAlpha=.5;fd.beginPath();fd.arc(n.x,n.y,n.r*2.4*n.a*pulse,0,7);fd.stroke();fd.globalAlpha=1})}
const bars=$('#bars'),slab=$('#slab');bars.innerHTML=Array.from({length:9},()=>'<i></i>').join('');
function sceneFx(s,tt){const u=tt-s.start,b=u/BEAT;let m=1;if(s.def.up){const r=s.def.up(s.S,u,b,tt);if(typeof r==='number')m=r}
  s.S.qa('.kt .w').forEach(w=>{const bb=+w.dataset.b*BEAT,k=p(u,bb,bb+.36,E.out5);w.style.opacity=u>=bb?Math.min(1,k*4):0;w.style.transform=`translateY(${(1-k)*60}px) scale(${1+(1-k)*.5})`;w.style.filter=k<1?`blur(${(1-k)*12}px)`:'none'});return m}
function place(s,tt,css,extra=1){const m=sceneFx(s,tt);s.el.style.cssText='display:block;'+css;s.el.style.opacity=(parseFloat(s.el.style.opacity||1))*m*extra}
function render(t){t=Math.min(t,window.DURATION-1e-3);const cur=SC.find(s=>t>=s.start&&t<s.end)||SC[SC.length-1],prev=cur.i>0?SC[cur.i-1]:null,u=t-cur.start;

     case'zoom':place(prev,t,`opacity:${1-k};transform:scale(${1+k*1.5});filter:blur(${k*20}px)`);place(cur,t,`opacity:${k};transform:scale(${.6+.4*k});filter:blur(${(1-k)*16}px)`);break;

     case'iris':place(prev,t,'opacity:1');place(cur,t,`opacity:1;clip-path:circle(${k*1500}px at 50% 55%)`);break;
     case'slab':slab.style.display='block';slab.style.transform=`translateY(${100-200*k}%)`;place(k<.5?prev:cur,t,'opacity:1');break;
     case'glitch':{const f=Math.floor(t*30),jx=(hash(f)-.5)*150*(1-r),sh=r<.5?prev:cur;place(sh,t,`opacity:1;transform:translateX(${jx}px);filter:hue-rotate(${(hash(f+3)-.5)*160*(1-r)}deg) contrast(${1+.6*(1-r)})`);bars.style.display='block';[...bars.children].forEach((c,i)=>{const on=hash(f*9+i)>.55;c.style.display=on?'block':'none';c.style.top=hash(f*5+i)*1900+'px';c.style.height=20+hash(f*3+i)*140+'px';c.style.background=ramp(hash(f+i));c.style.opacity=.35*(1-r)});break}
     default:place(cur,t,'opacity:1')}
    if(cur.tr==='glitch'||cur.tr==='slab')fieldFrom=r<.5?prev:cur}
  drawBg(t,h);drawField(t,fieldFrom.def.field?fieldFrom.def.field(t-fieldFrom.start,(t-fieldFrom.start)/BEAT):null,h);
  let sx=0,sy=0,fl=0;HITS.forEach(hh=>{const d=t-hh.t;if(d<0||d>1.4)return;sx+=hh.w*22*Math.exp(-d*9)*Math.sin(d*88+hh.t*3);sy+=hh.w*16*Math.exp(-d*9)*Math.cos(d*77+hh.t);fl+=hh.w*(hh.w>=.9?.7:.28)*Math.exp(-d*16)});
  $('#cam').style.transform=`translate(${sx}px,${sy}px) rotate(${sx*.012}deg)`;$('#flash').style.opacity=Math.min(1,fl);
  $('#brand').style.opacity=cur.i===SC.length-1?0:.6;
}
window.render=render;document.fonts.ready.then(()=>{window.__ready=true;render(0)});
