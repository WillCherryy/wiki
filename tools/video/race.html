<!doctype html>
<html><head><meta charset="utf-8"><title>Scorcher race</title>
<style>
@font-face{font-family:EB;font-weight:400;src:url(../../fonts/eb-garamond-latin-400-normal.woff2)}
@font-face{font-family:EB;font-weight:500;src:url(../../fonts/eb-garamond-latin-500-normal.woff2)}
@font-face{font-family:EB;font-weight:400;font-style:italic;src:url(../../fonts/eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:IS;font-weight:500;src:url(../../fonts/instrument-sans-latin-500-normal.woff2)}
@font-face{font-family:IS;font-weight:600;src:url(../../fonts/instrument-sans-latin-600-normal.woff2)}
*{box-sizing:border-box;margin:0}html,body{background:#000;overflow:hidden}
#scene{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#2a221c 0%,#14100d 70%);perspective:1050px;perspective-origin:50% 42%}
#plane{position:absolute;left:540px;top:1000px;width:1000px;transform-origin:0 0;will-change:transform}
#page{position:relative;width:1000px;background:#fbf8f1;color:#16130f;font-family:EB;padding:70px 64px 120px;box-shadow:0 0 0 2px #e6dfce,0 40px 120px rgba(0,0,0,.65),0 0 0 14px rgba(255,255,255,.03);
  background-image:radial-gradient(rgba(60,40,10,.045) 1px,transparent 1.2px),radial-gradient(rgba(60,40,10,.03) 1px,transparent 1.4px);background-size:7px 7px,11px 11px;background-position:0 0,3px 4px}
#page h1{font:400 118px/1 EB;letter-spacing:-.02em;margin:0 0 6px;border-bottom:3px solid #16130f;padding-bottom:10px}
#page .sub{font:italic 400 36px/1.2 EB;color:#4b453b;margin:12px 0 38px}
#page h2{font:400 66px/1.1 EB;margin:58px 0 16px;border-bottom:2px solid #d8cfbf;padding-bottom:6px;letter-spacing:-.01em}
#page p{font:400 38px/1.5 EB;margin:0 0 26px;color:#1d1a15}
#page .l{text-decoration:underline;text-decoration-color:#d63a1f;text-decoration-thickness:3px;text-underline-offset:5px}
#page .box{float:right;width:330px;margin:6px 0 24px 34px;border:2px solid #d8cfbf;background:#f3eee4;padding:18px;font:500 26px/1.3 IS}
#page .box .ph{height:200px;background:linear-gradient(135deg,#d6cdb8,#b9ae98);margin-bottom:12px;display:grid;place-items:center;font:italic 400 30px EB;color:#7a7265}
#page .box b{display:block;font:600 22px IS;letter-spacing:.14em;text-transform:uppercase;color:#7a7265;margin:10px 0 2px}
#page .quote{border-left:8px solid #d63a1f;padding:6px 0 6px 30px;margin:34px 0;font:italic 400 52px/1.25 EB;color:#2b261f}
#page ul{margin:0 0 26px 40px;font:400 38px/1.6 EB}
#fx{position:absolute;left:0;top:0;width:1000px;pointer-events:none}
#haze{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,16,13,.96) 0%,rgba(20,16,13,.55) 16%,rgba(20,16,13,0) 36%)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#end{position:absolute;inset:0;opacity:0;pointer-events:none}
</style></head><body>
<div id="scene">
 <div id="plane"><div id="page"></div><canvas id="fx"></canvas></div>
 <div id="haze"></div><div id="vig"></div><div id="flash"></div><canvas id="end" width="1080" height="1920"></canvas>
</div>
<script src="race-logo.js"></script>
