<html><head><meta charset="utf-8"><title>Scorcher sky</title>

// ---- one continuous shot from the quasar on: it lands, the writing builds around it, the beat drops and the camera pulls back into your whole sky
const VL = []; SKY.OBJ.map((o, i) => ({ o, i })).reverse().forEach(({ o, i }) => SKY.POOL[o.id].slice(0, 3).forEach(q => VL.push({ n: q.n, id: o.id, idx: i, count: ['Betelgeuse', 'Crab Pulsar', 'The Sun', 'Sirius A'].includes(q.n) ? 2 : 1, kind: q.kind, t: q.t })));

  const at = nm => { if (!nm) return { x: 0, y: 0 }; const p = pos.find(q => q.n === nm); return p ? { x: p.wx, y: p.wy } : { x: 0, y: 0 }; };
  const { A, Bk, f } = keySeg(b), pa = at(A.n), pb = at(Bk.n); return { x: lerp(pa.x, pb.x, f), y: lerp(pa.y, pb.y, f), z: zFor(b) };

// orbit clock: orbits run slower the closer the camera is, so nothing strobes at 30 fps; the clock is integrated, so phases never jump
const tsOf = z => 2.4 * clamp(Math.pow(.42 / z, 1.6), .07, 1); let TAU_ARR = [];

const tauAt = t => { const x = clamp(t, 0, window.DURATION + 1.9) * 60, i = Math.floor(x); return lerp(TAU_ARR[i], TAU_ARR[Math.min(i + 1, TAU_ARR.length - 1)], x - i) + 0; };
const ageMap = (list, t) => { const m = {}; list.forEach((q, i) => { if (i > 0) m[q.n] = t - bt(26 + i / 1.7); }); return m; };
function sysDraw(ctx, b, t, list, cam, focus, newId, tNew, primScale, noLabels) { ctx.clearRect(0, 0, W, H); return SKY.system(ctx, W, H, t + 40, list, { cam, focus, primScale, tau: tauAt(t) + 40 * 2.4, ts: tsOf(cam.z), noLabels, wobble: 0, ages: ageMap(list, t) }); }
function sysScene(b, t) {
  const RATE = 1.7, n = clamp(1 + Math.floor((b - 26) * RATE), 1, VL.length), list = b < 26 ? VL.slice(0, 1) : VL.slice(0, n), last = list[list.length - 1], tNew = b < 26 ? 0 : t - bt(26 + (list.length - 1) / RATE);
  const pos = SKY.system(pg, 64, 64, t + 40, list, { cam: { x: 0, y: 0, z: 1 }, tau: tauAt(t) + 40 * 2.4, wobble: 0, noLabels: true }), cam = camFor(b, pos), q = (t - bt(QB)), tl = q * 1.3, grow = tl < .4 ? 0 : Math.min(1.15, E.back(clamp((tl - .4) / .85)));

  { const u = q, fade = 1 - p(b, 22.3, 23.2), o = SKY.OBJ[8], a = p(u, .3, .6, E.out3) * fade; if (a > 0) { g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 30); g.font = 'italic 400 150px EB'; g.textAlign = 'center'; g.fillStyle = o.c; g.fillText(o.name, W / 2, 1480); g.restore();
      const b2 = p(u, .5, .85) * fade; g.globalAlpha = b2; label(`${o.kind.toUpperCase()}  ·  ${o.temp.toUpperCase()}`, W / 2, 1560, 34, CREAM, 'center', .2); g.globalAlpha = 1;

}
function logoScene(b, t) {
  const u = b - 60; bg(1, t, .12); const v = p(u, .2, 1), LS = 1.5, LW = LOGO.vb[0] * LS, LX = (W - LW) / 2, LY = 520; g.globalAlpha = v; LOGO.dots.forEach((d, n) => { g.fillStyle = d.c; g.beginPath(); g.arc(LX + d.x * LS, LY + d.y * LS, Math.max(0, d.r * LS * p(u, .3 + n * .12, .9 + n * .12, E.back)), 0, 7); g.fill(); });

  const x0 = 140, x1 = 940, y = 1250, gr = g.createLinearGradient(x0, 0, x1, 0); ['#2a4f8a', '#5c8cbe', '#d6be8c', '#f08c50', '#d63a1f'].forEach((c, k) => gr.addColorStop(k / 4, c)); g.fillStyle = gr; rr(x0, y, x1 - x0, 24, 12); g.fill(); const mx = lerp(x0, x1, E.io(clamp((b - 3.5) / 2.3))); g.fillStyle = CREAM; g.shadowColor = 'rgba(255,160,80,.8)'; g.shadowBlur = 30; g.beginPath(); g.arc(mx, y + 12, 28, 0, 7); g.fill(); g.shadowBlur = 0; }

  if (!window.__ready) return; const b = clamp(beatAt(t), 0, NB - .001); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);

};
