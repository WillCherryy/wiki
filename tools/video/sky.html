<html><head><meta charset="utf-8"><title>Scorcher sky</title>
<style>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="race-logo.js"></script><script src="../../skyobjects.js"></script><script src="sky-beats.js"></script>
<script>
/* "Sky": a short science lesson about the temperature of objects in space, ending on the line and the logo. No branding, and no "warm it up", until the end card.

const ov = document.createElement('canvas'); ov.width = W; ov.height = H; const ovg = ov.getContext('2d'), ov2 = document.createElement('canvas'); ov2.width = W; ov2.height = H; const ov2g = ov2.getContext('2d');

const oc = document.createElement('canvas'); oc.width = 1080; oc.height = 1080; const og = oc.getContext('2d');

// ---- timeline
const SEG = 3.25, OBJ0 = 8, QB = 34, DROP = 38, SPAWN = 42, ZQ = 1.62, QDY = 134, ZEND = .408, ZOUT0 = DROP, ZOUT1 = 61, LOGOB = 75;
const TK = [2.7, 1e3, 3e3, 4e3, 5.8e3, 1e4, 2.5e4, 5e4, 1e6, 1e7];   // empty space, then the nine objects (kelvin)

Promise.all(['54px EB', 'italic 54px EB', '600 30px IS'].map(f => document.fonts.load(f))).then(init);

// ---- the temperature scale: one marker slides along it from object to object (drawn on top of the crossfades, so it never cuts)

function scaleHud(b, alpha) {

  [[1, '1 K'], [100, '100 K'], [1e4, '10,000 K'], [1e6, ''], [1e7, '10 million K']].forEach(([k, l]) => { const x = lerp(x0, x1, fK(k)); g.fillStyle = 'rgba(239,230,210,.5)'; g.fillRect(x - 1, y + 14, 2, 12); if (l) label(l.toUpperCase(), x, y + 52, 19, 'rgba(239,230,210,.62)', k === 1 ? 'left' : k === 1e7 ? 'right' : 'center', .1); });
  const gl = g.createRadialGradient(mx, y, 0, mx, y, 46); gl.addColorStop(0, heatCol(clamp((f - .35) / .65)).replace('rgb', 'rgba').replace(')', ',.75)')); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.beginPath(); g.arc(mx, y, 46, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(mx, y, 13, 0, 7); g.fill(); g.restore();
}

// ---- scenes

  slam('Temperature', W / 2, 860, 200, CREAM, p(b, .2, 1.1), { fade: f }); slam('in space.', W / 2, 1060, 190, ICE, p(b, 1.3, 2.2), { it: true, fade: f }); g.globalAlpha = p(b, 2.6, 3.4) * f; label('A SHORT LESSON IN KELVIN', W / 2, 1210, 32, MUTE, 'center', .3); g.globalAlpha = 1;

  g.font = '400 46px EB'; g.fillStyle = 'rgba(239,230,210,.75)'; ['The cold afterglow of the Big Bang.', 'The coldest things we can see.'].forEach((l, i) => g.fillText(l, W / 2, 1170 + i * 62)); g.restore();
}
function objText(o, u, fade, y0 = 1400) {   // name, class and temperature, then a line of science; each appears in turn
  const a = p(u, .12, .55, E.out3) * fade; if (a > 0) { g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 22); g.font = 'italic 400 140px EB'; g.textAlign = 'center'; g.fillStyle = o.c; g.fillText(o.name, W / 2, y0); g.restore(); }
  g.globalAlpha = p(u, .35, .8) * fade; label(`${o.kind.toUpperCase()}  ·  ${o.temp.toUpperCase()}`, W / 2, y0 + 70, 32, CREAM, 'center', .2);
  g.globalAlpha = p(u, .7, 1.3) * fade; g.font = '400 40px EB'; g.textAlign = 'center'; g.fillStyle = 'rgba(239,230,210,.88)'; wrap(o.fact, 900, '400 40px EB').forEach((l, i) => g.fillText(l, W / 2, y0 + 140 + i * 52)); g.globalAlpha = 1;
}
function objScene(i, u, t) {   // u = seconds into this object
  const o = SKY.OBJ[i], heat = (i + 1) / 9; bg(heat, t, .08 * Math.exp(-u * 3));
  og.clearRect(0, 0, 1080, 1080); SKY.land(og, 1080, 1080, o.id, i, Math.min(u * 1.5, 3.2)); og.save(); og.globalCompositeOperation = 'destination-in'; { const mk = og.createRadialGradient(540, 540, 250, 540, 540, 540); mk.addColorStop(0, 'rgba(0,0,0,1)'); mk.addColorStop(1, 'rgba(0,0,0,0)'); og.fillStyle = mk; og.fillRect(0, 0, 1080, 1080); } og.restore(); g.drawImage(oc, 0, 250);
  objText(o, u / B1, 1 - p(u / B1, SEG - 1.0, SEG - .25, E.io));
}
let B1 = .39;   // seconds per beat, set when the beat grid is known
// ---- one continuous shot from the quasar on: it lands, the writing builds around it, the beat drops and the camera pulls back into your whole sky
const VL = []; SKY.OBJ.map((o, i) => ({ o, i })).reverse().forEach(({ o, i }) => SKY.POOL[o.id].slice(0, 3).forEach(q => VL.push({ n: q.n, id: o.id, idx: i, count: ['Betelgeuse', 'Crab Pulsar', 'The Sun', 'Sirius A'].includes(q.n) ? 2 : 1, kind: q.kind, t: q.t })));
const pc = document.createElement('canvas'); pc.width = 64; pc.height = 64; const pg = pc.getContext('2d');
const KEYS = [{ b: ZOUT1, n: null, z: ZEND / 1.7 }, { b: 62.8, n: 'Betelgeuse', z: 1.5, hold: 1.3 }, { b: 65.4, n: 'Crab Pulsar', z: 1.5, hold: 1.3 }, { b: 68, n: '3C 273', z: 1.1, hold: .9 }, { b: 71.4, n: null, z: .22 }];
const sm = k => k * k * (3 - 2 * k), FOC = [{ n: 'Betelgeuse', a: 62.8, z: 65.4 }, { n: 'Crab Pulsar', a: 65.4, z: 68 }, { n: '3C 273', a: 68, z: 70.4 }];
function keySeg(b) { let k = 0; while (k < KEYS.length - 2 && b >= KEYS[k + 1].b) k++; const A = KEYS[k], Bk = KEYS[Math.min(k + 1, KEYS.length - 1)], h0 = A.b + (A.hold || 0); return { A, Bk, f: E.io(clamp((b - h0) / Math.max(.01, Bk.b - h0))) }; }

function camFor(b, pos) {
  if (b < ZOUT1) { const s = clamp((b - ZOUT0) / (ZOUT1 - ZOUT0)), z = zFor(b); return { x: 0, y: QDY * (1 - sm(clamp(s * 1.2))) / z, z }; }
  const at = nm => { if (!nm) return { x: 0, y: 0 }; const q = pos.find(v => v.n === nm); return q ? { x: q.wx, y: q.wy } : { x: 0, y: 0 }; };

// orbit clock: orbits run slower the closer the camera is, so nothing strobes at 30 fps; the clock is integrated, so phases never jump
const tsOf = z => 2.4 * clamp(Math.pow(.42 / z, 1.6), .07, 1); let TAU_ARR = [];
function buildTau() { const dt = 1 / 60, n = Math.ceil((window.DURATION + 2) / dt); B1 = (SBb[40] - SBb[10]) / 30; TAU_ARR = new Float64Array(n + 1); for (let i = 0; i < n; i++) TAU_ARR[i + 1] = TAU_ARR[i] + dt * tsOf(zFor(beatAt(i * dt))); }
const tauAt = t => { const x = clamp(t, 0, window.DURATION + 1.9) * 60, i = Math.floor(x); return lerp(TAU_ARR[i], TAU_ARR[Math.min(i + 1, TAU_ARR.length - 1)], x - i); };
const ageMap = (list, t) => { const m = {}; list.forEach((q, i) => { if (i > 0) m[q.n] = t - bt(SPAWN + i / 1.7); }); return m; };
function sysDraw(ctx, t, list, cam, focus, primScale, noLabels) { ctx.clearRect(0, 0, W, H); return SKY.system(ctx, W, H, t + 40, list, { cam, focus, primScale, tau: tauAt(t) + 40 * 2.4, ts: tsOf(cam.z), noLabels, wobble: 0, ages: ageMap(list, t) }); }
function sysScene(b, t) {
  const RATE = 1.7, n = clamp(1 + Math.floor((b - SPAWN) * RATE), 1, VL.length), list = b < SPAWN ? VL.slice(0, 1) : VL.slice(0, n);
  const pos = SKY.system(pg, 64, 64, t + 40, list, { cam: { x: 0, y: 0, z: 1 }, tau: tauAt(t) + 40 * 2.4, wobble: 0, noLabels: true }), cam = camFor(b, pos), q = t - bt(QB), tl = q * 1.2, grow = tl < .4 ? 0 : Math.min(1.15, E.back(clamp((tl - .4) / .85)));
  const fo = FOC.find(f => b >= f.a && b < f.z), focus = fo ? fo.n : null;
  g.fillStyle = DARK; g.fillRect(0, 0, W, H); { const k = clamp(.9 - (b - DROP) / 22 * .7, .2, .9), gr = g.createRadialGradient(W / 2, H * .44, 60, W / 2, H * .44, 1250); gr.addColorStop(0, `rgba(255,120,60,${.30 * k})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  // three samples a few milliseconds apart so motion is smooth; labels are drawn once afterwards so they stay sharp
  const dt = 1 / 90; let mid = []; [-dt, 0, dt].forEach((d, k) => { const ps = sysDraw(ovg, t + d, list, cam, focus, grow, true); if (k === 1) mid = ps; g.globalAlpha = k === 0 ? 1 : k === 1 ? .5 : .34; g.drawImage(ov, 0, 0); }); g.globalAlpha = 1;
  if (tl < 2) SKY.landFx(g, 'quasar', 8, tl, W / 2, H / 2 - cam.y * cam.z, 162, W, 1000);
  { const dd = b - DROP; if (dd > 0 && dd < 1.8) { const u = clamp(dd / 1.8), cy = H / 2 - cam.y * cam.z; g.strokeStyle = `rgba(255,214,160,${.8 * (1 - u)})`; g.lineWidth = 14 * (1 - u) + 2; g.beginPath(); g.arc(W / 2, cy, 120 + 1100 * E.out3(u), 0, 7); g.stroke(); } if (dd > 0 && dd < .45) { g.fillStyle = `rgba(255,255,255,${.3 * (1 - dd / .45)})`; g.fillRect(0, 0, W, H); } }
  const gt = g.createLinearGradient(0, 0, 0, 560); gt.addColorStop(0, 'rgba(8,6,16,.85)'); gt.addColorStop(1, 'rgba(8,6,16,0)'); g.fillStyle = gt; g.fillRect(0, 0, W, 560); const gb = g.createLinearGradient(0, H - 520, 0, H); gb.addColorStop(0, 'rgba(8,6,16,0)'); gb.addColorStop(1, 'rgba(8,6,16,.9)'); g.fillStyle = gb; g.fillRect(0, H - 520, W, 520);
  mid.forEach(v => { if (v.lbl && v.r > 0) SKY.drawLabel(g, v.lbl); });
  { const fade = 1 - p(b, DROP + .4, DROP + 1.4); if (fade > 0) { objText(SKY.OBJ[8], q / B1, fade); slam('Every solve earns', W / 2, 250, 96, CREAM, p(b, QB + 2, QB + 2.8), { fade }); slam('a real star.', W / 2, 370, 130, ORG, p(b, QB + 2.8, QB + 3.6), { it: true, fade }); } }
  if (b >= SPAWN && b < ZOUT1 + 1) { const f = p(b, SPAWN, SPAWN + .8) * (1 - p(b, ZOUT1 - 1.4, ZOUT1)); label('YOUR OWN SKY', W / 2, 200, 34, MUTE, 'center', .3); slam('It grows with you.', W / 2, 330, 110, CREAM, p(b, SPAWN + .3, SPAWN + 1.2), { it: true, fade: 1 - p(b, ZOUT1 - 1.4, ZOUT1) }); g.globalAlpha = f; label(`${list.length} OF 69 OBJECTS FOUND`, W / 2, H - 150, 34, CREAM, 'center', .24); g.globalAlpha = 1; }
  if (fo) { const qd = VL.find(vv => vv.n === fo.n), o = SKY.OBJ[qd.idx], a = p(b, fo.a + .5, fo.a + 1.1) * (1 - p(b, fo.a + 2.0, fo.a + 2.6)); g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 24); g.textAlign = 'center'; g.font = 'italic 400 140px EB'; g.fillStyle = o.c; g.fillText(qd.n, W / 2, H - 260); label(`${qd.kind.toUpperCase()}  ·  ${qd.t.toUpperCase()}`, W / 2, H - 190, 30, CREAM, 'center', .2); label(o.name.toUpperCase() + ' · TIER ' + (qd.idx + 1) + ' OF 9', W / 2, H - 140, 24, MUTE, 'center', .28); g.restore(); }
}
// ---- the end card: the five dots of the mark gather out of the system, then the name, then the line, then the address
function logoScene(b, t) {
  const u = b - LOGOB; g.fillStyle = DARK; g.fillRect(0, 0, W, H); { const gr = g.createRadialGradient(W / 2, H * .38, 80, W / 2, H * .38, 1200); gr.addColorStop(0, `rgba(255,110,60,${.28 * p(u, 0, 2)})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); } g.save(); g.globalAlpha = .7; SKY.starfield(g, W, H, t, 90, 4); g.restore();
  const LS = 1.5, LW = LOGO.vb[0] * LS, LX = (W - LW) / 2, LY = 470;
  LOGO.dots.forEach((d, n) => { const k = p(u, .1 + n * .3, 2 + n * .3, E.io), x = lerp(W / 2, LX + d.x * LS, k), y = lerp(H * .44, LY + d.y * LS, k), r = Math.max(.01, d.r * LS * lerp(.3, 1, k)), a = p(u, .05 + n * .3, .7 + n * .3);
    g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'lighter'; const hg = g.createRadialGradient(x, y, 0, x, y, r * 3.2); hg.addColorStop(0, d.c + 'aa'); hg.addColorStop(1, d.c + '00'); g.fillStyle = hg; g.beginPath(); g.arc(x, y, r * 3.2, 0, 7); g.fill(); g.restore(); g.globalAlpha = a; g.fillStyle = d.c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.globalAlpha = 1; });
  const wa = p(u, 2.2, 4, E.io); g.save(); g.globalAlpha = wa; g.translate(0, (1 - wa) * 26); g.font = '400 210px EB'; const w1 = g.measureText('Scorch').width; g.font = 'italic 400 210px EB'; const w2 = g.measureText('er').width, x0 = W / 2 - (w1 + w2) / 2; g.textAlign = 'left'; g.font = '400 210px EB'; g.fillStyle = CREAM; g.fillText('Scorch', x0, 1140); g.font = 'italic 400 210px EB'; g.fillStyle = ORG; g.fillText('er', x0 + w1, 1140); g.restore();
  slam('Space is cold.', W / 2, 1290, 84, ICE, p(u, 3.8, 5), { it: true }); slam('Warm it up.', W / 2, 1405, 118, ORG, p(u, 4.8, 6), { it: true });
  g.globalAlpha = p(u, 5.8, 6.8); label('THE DAILY WIKIPEDIA LINK RACE', W / 2, 1500, 30, CREAM, 'center', .24); g.globalAlpha = 1;
  const ua = p(u, 6.4, 7.4, E.io); g.save(); g.globalAlpha = ua; g.translate(0, (1 - ua) * 20); g.fillStyle = ORG; rr(W / 2 - 330, 1560, 660, 118, 59); g.fill(); g.fillStyle = '#fff'; g.font = '600 46px IS'; g.textAlign = 'center'; g.fillText('playscorcher.com', W / 2, 1634); g.restore();
}
// scenes in order; every boundary is a crossfade with the outgoing scene still moving
const SEGS = [{ a: 0, f: titleScene, xf: 1 }, { a: 4.5, f: spaceScene, xf: .9 }, ...Array.from({ length: 8 }, (_, i) => ({ a: OBJ0 + i * SEG, f: (b, t) => objScene(i, t - bt(OBJ0 + i * SEG), t), xf: i === 0 ? .9 : 1.1 })), { a: QB, f: sysScene, xf: 1.3 }, { a: LOGOB, f: logoScene, xf: 2.6 }];

};
