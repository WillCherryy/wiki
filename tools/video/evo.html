<html><head><meta charset="utf-8"><title>Scorcher evo</title>

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="race-logo.js"></script>
<script>
/* "Evo": a lesson in animal evolution told through Wikipedia links. Every link opens its own animation. No branding until the logo.
   140 bpm, 66 beats: 0-4 hook, then 8 hops of 6 beats (page, tap, animation), 52-58 the family tree, 58-66 logo. Pure function of time. */
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const BPM = 140, B = 60 / BPM, bt = b => b * B, HOP0 = 4, HL = 6, NH = 8, FIN = HOP0 + NH * HL, LOGOB = FIN + 6, NB = LOGOB + 8;
window.DURATION = NB * B; window.EVENTS = []; window.__ready = false;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
const E = { out3: k => 1 - Math.pow(1 - k, 3), io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, ss: k => k * k * (3 - 2 * k), back: k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }, out5: k => 1 - Math.pow(1 - k, 5) };

const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const DARK = '#14100c', CREAM = '#efe6d2', SHEET = '#fbf8f1', INK = '#16130f', ACC = '#d63a1f', ORG = '#ff6a45', MUTE = '#8a8372', GOLD = '#f5b52e', BLUE = '#5c8cbe', TEAL = '#3ed2c0';
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
function label(txt, x, y, size, col, align = 'left', sp = .16) { g.font = `600 ${size}px IS`; g.letterSpacing = (size * sp) + 'px'; g.textAlign = align; g.fillStyle = col; g.fillText(txt, x, y); g.letterSpacing = '0px'; }
function slam(txt, x, y, size, col, a, opt = {}) {
  if (a <= 0) return; const s = lerp(1.6, 1, E.back(clamp(a))), split = (1 - clamp(a * 1.4)) * 22 + (opt.glitch || 0);
  g.save(); g.translate(x, y); g.scale(s, s); g.textAlign = 'center'; g.font = `${opt.it ? 'italic ' : ''}400 ${size}px EB`; g.globalAlpha = clamp(a * 3);
  if (split > 1) { g.globalCompositeOperation = 'lighter'; g.fillStyle = 'rgba(255,40,40,.65)'; g.fillText(txt, -split, 0); g.fillStyle = 'rgba(40,120,255,.65)'; g.fillText(txt, split, 0); g.globalCompositeOperation = 'source-over'; }
  g.fillStyle = col; g.fillText(txt, 0, 0); g.restore();
}
function wrap(txt, maxW, font) { g.font = font; const out = []; let cur = ''; txt.split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }); out.push(cur); return out; }

// ------------------------------------------------------------------ the lesson
const PAGES = [
  { t: 'Animal', link: ['choanoflagellates'], oth: ['multicellular', 'eukaryotic'], txt: 'Animals are multicellular, eukaryotic organisms that eat other organisms. Their closest living relatives are the choanoflagellates.' },
  { t: 'Choanoflagellate', link: ['cambrian', 'explosion'], oth: ['single-celled', 'microvilli'], txt: 'Choanoflagellates are single-celled organisms with a collar of microvilli. Animals branched off from them long before the Cambrian explosion.' },
  { t: 'Cambrian explosion', link: ['fish'], oth: ['body', 'plans'], txt: 'The Cambrian explosion is a rapid burst of new animal body plans, including the first vertebrates: fish.' },
  { t: 'Fish', link: ['tiktaalik'], oth: ['gill-bearing', 'vertebrates'], txt: 'Fish are gill-bearing vertebrates. About 375 million years ago, lobe-finned fish like Tiktaalik began to crawl.' },
  { t: 'Tiktaalik', link: ['amniotes'], oth: ['tetrapods', 'wrist'], txt: 'Tiktaalik had a neck and wrist-like fin bones. Its tetrapod descendants conquered land and evolved the amniotes.' },
  { t: 'Amniote', link: ['dinosaurs'], oth: ['mammals', 'reptiles'], txt: 'Amniotes lay eggs that do not dry out. They split into the ancestors of mammals and of reptiles, including the dinosaurs.' },
  { t: 'Dinosaur', link: ['mammals'], oth: ['asteroid', 'birds'], txt: 'An asteroid ended the non-avian dinosaurs 66 million years ago. Small mammals survived and spread across the empty world.' },
  { t: 'Mammal', link: ['humans'], oth: ['primates', 'chimpanzees'], txt: 'Mammals include the primates. Chimpanzees and humans share a recent common ancestor.' },

// the animation each link opens: name, big date label (mya), lesson sentence, accent colour
const SCN = [
  { n: 'Choanoflagellate', mya: 600, d: '600+ million years ago', s: 'Our closest living relatives are single cells. Some live in colonies, a clue to how animals began.', c: '#7fe0ff', fn: aChoano },
  { n: 'Cambrian explosion', mya: 539, d: '539 million years ago', s: 'In a geological blink of about 20 million years, most major animal body plans appear.', c: '#ff8f6b', fn: aCambrian },
  { n: 'Fish', mya: 520, d: '520 million years ago', s: 'A stiffening backbone and a skull: the first vertebrates are fish, and they rule the seas.', c: '#8fb4ff', fn: aFish },
  { n: 'Tiktaalik', mya: 375, d: '375 million years ago', s: 'A fish with a neck and a wrist. Fin rays become bones with digits.', c: '#ffd36b', fn: aTiktaalik },
  { n: 'Amniotes', mya: 318, d: '318 million years ago', s: 'The egg leaves the water. Soon the line splits: mammals one way, reptiles and birds the other.', c: '#9be28a', fn: aAmniote },
  { n: 'Birds', mya: 150, d: '150 million years ago', s: 'Feathers evolved in dinosaurs first. Birds are living dinosaurs.', c: '#ff7aa8', fn: aBird },
  { n: 'Mammals', mya: 66, d: '66 million years ago', s: 'An asteroid ends the age of dinosaurs. Small mammals inherit the world and diversify.', c: '#ffb066', fn: aMammal },

const FS = 54, LHT = 82, TX = 120, TW = 840, AY = 470, AH = 1160;

  words.forEach(wd => { const ww = g.measureText(wd).width; if (w + ww > TW && cur.length) { lines.push(cur); cur = []; w = 0; } cur.push(wd); w += ww + sp; }); lines.push(cur);
  pg.tok = []; let y = AY + 370; pg.target = null;
  lines.forEach(ln => { let x = TX; ln.forEach(wd => { const c = wd.replace(/[.,:]$/, '').toLowerCase(), ww = g.measureText(wd.replace(/[.,:]$/, '')).width, isT = pg.link.includes(c), isL = isT || pg.oth.includes(c);

}
function init() {

Promise.all(['54px EB', 'italic 54px EB', '600 30px IS'].map(f => document.fonts.load(f))).then(init);
const kickAt = b => Math.exp(-(b - Math.floor(b)) * 6);

// ------------------------------------------------------------------ drawing kit for the animations
function glowDot(x, y, r, col, a = 1) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

function timeline(mya, col, a = 1) {   // a thin timeline across the top: 600 million years ago on the left, today on the right

const hexA = c => `rgba(${parseInt(c.slice(1, 3), 16)},${parseInt(c.slice(3, 5), 16)},${parseInt(c.slice(5, 7), 16)},A)`;

// ------------------------------------------------------------------ the eight animations: u = progress 0..1 inside the scene, T = seconds
const CX = 540, CY = 840;
function aChoano(u, T) {

  if (one > .01) cell(CX, CY + 80, lerp(150, 120, 1 - one), -.12 * Math.sin(T * 2), T, 0, '#ffe3b0', '#7fe0ff', one);
  const n = 12, R = lerp(0, 235, E.out3(colony));

    const dentIn = fold * Math.max(0, Math.sin(a0)) * .5; cell(lerp(x, CX + Math.cos(a0) * rad * .7, dentIn), lerp(y, CY + 60 + Math.sin(a0) * rad * .55, dentIn), 54 * E.out3(colony), a0 + 1.5708, T, i, '#ffd9a0', '#7fe0ff', colony); }
  if (colony > .5) { g.fillStyle = `rgba(127,224,255,${.08 * colony})`; g.beginPath(); g.arc(CX, CY + 60, R * .9, 0, 7); g.fill(); }
  if (fold > .2) label('A HOLLOW BALL OF CELLS', CX, 1180, 26, 'rgba(127,224,255,' + clamp(fold) + ')', 'center', .22);
}
const BODY = [
  (x, y, s, col, T) => { g.fillStyle = col; for (let i = -5; i <= 5; i++) { g.beginPath(); g.ellipse(x + i * 17 * s, y, 9 * s, (46 - Math.abs(i) * 3) * s, 0, 0, 7); g.fill(); } g.fillStyle = col; g.beginPath(); g.ellipse(x - 112 * s, y, 24 * s, 44 * s, 0, 0, 7); g.fill(); g.fillStyle = INK; g.beginPath(); g.arc(x - 118 * s, y - 14 * s, 6 * s, 0, 7); g.arc(x - 118 * s, y + 14 * s, 6 * s, 0, 7); g.fill(); },   // trilobite-like
  (x, y, s, col, T) => { g.strokeStyle = col; g.lineWidth = 15 * s; g.lineCap = 'round'; g.beginPath(); for (let i = 0; i <= 24; i++) { const q = i / 24; g.lineTo(x - 130 * s + q * 260 * s, y + Math.sin(q * 6 + T * 5) * 22 * s); } g.stroke(); g.lineWidth = 6 * s; for (let i = 0; i < 9; i++) { const q = (i + 1) / 11, xx = x - 130 * s + q * 260 * s, yy = y + Math.sin(q * 6 + T * 5) * 22 * s; g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx, yy + 38 * s); g.stroke(); } },   // worm with spines
  (x, y, s, col, T) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y - 16 * s, 80 * s, 52 * s * (1 + Math.sin(T * 5) * .05), 0, Math.PI, 0); g.fill(); g.strokeStyle = col; g.lineWidth = 7 * s; g.lineCap = 'round'; for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(x + i * 20 * s, y - 14 * s); g.bezierCurveTo(x + i * 24 * s + Math.sin(T * 5 + i) * 10 * s, y + 30 * s, x + i * 16 * s, y + 70 * s, x + i * 22 * s + Math.sin(T * 4 + i) * 12 * s, y + 100 * s); g.stroke(); } },   // jellyfish
  (x, y, s, col, T) => { g.fillStyle = col; g.beginPath(); g.moveTo(x - 30 * s, y + 60 * s); g.bezierCurveTo(x - 70 * s, y - 20 * s, x - 40 * s, y - 70 * s, x - 10 * s, y - 70 * s); g.lineTo(x + 10 * s, y - 70 * s); g.bezierCurveTo(x + 40 * s, y - 70 * s, x + 70 * s, y - 20 * s, x + 30 * s, y + 60 * s); g.fill(); g.fillStyle = INK; g.beginPath(); g.ellipse(x, y - 70 * s, 22 * s, 8 * s, 0, 0, 7); g.fill(); },   // sponge / vase
  (x, y, s, col, T) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, 100 * s, 38 * s, 0, 0, 7); g.fill(); g.strokeStyle = col; g.lineWidth = 11 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + 90 * s, y); g.quadraticCurveTo(x + 150 * s, y - 40 * s + Math.sin(T * 5) * 12 * s, x + 170 * s, y - 80 * s); g.moveTo(x + 90 * s, y + 8 * s); g.quadraticCurveTo(x + 150 * s, y + 40 * s - Math.sin(T * 5) * 12 * s, x + 170 * s, y + 70 * s); g.stroke(); g.fillStyle = INK; for (const o of [-18, 0, 18]) { g.beginPath(); g.arc(x + 70 * s, y + o * s * .7, 6 * s, 0, 7); g.fill(); } },   // swimmer with claws
];
function aCambrian(u, T) {

  const n = 18; for (let i = 0; i < n; i++) {
    const a = p(u, .05 + i * .035, .22 + i * .035, E.back), ang = i * 2.399 + .4, rad = 110 + (i % 6) * 48 + i * 4, x = CX + Math.cos(ang) * rad * (.55 + .45 * a), y = CY + 40 + Math.sin(ang) * rad * 1.15 * (.55 + .45 * a);
    if (a <= 0) continue; g.save(); g.globalAlpha = clamp(a * 1.3); BODY[i % 5](x, y, (.62 + (i % 3) * .1) * a, cols[i % 5], T + i); g.restore(); }

}
function aFish(u, T) {

  const k = E.out3(clamp((u - .18) / .35)), x = lerp(-300, CX, k) + (u > .55 ? (u - .55) * 120 : 0), y = CY + 30 + Math.sin(T * 2) * 14, L = 620; fish(x, y, L, '#a9c6ff', T, 0, 1, 1);

    g.strokeStyle = `rgba(255,255,255,${.85 * sp})`; g.lineWidth = 6; g.beginPath(); g.ellipse(x + L * .33, y - 16, 70, 46, 0, 0, 7); g.stroke(); label('SKULL', x + L * .33, y - 100, 24, `rgba(255,255,255,${sp})`, 'center', .2); label('BACKBONE', x - 40, y + 130, 24, `rgba(255,255,255,${sp})`, 'center', .2); }

function aTiktaalik(u, T) {

  label('FIN', 220, 640, 26, `rgba(255,255,255,${1 - m})`, 'center', .2); label('LIMB WITH WRIST + DIGITS', CX, 1130, 26, `rgba(255,255,255,${m > .6 ? 1 : 0})`, 'center', .2);
}
function aAmniote(u, T) {
  const e = p(u, .02, .24, E.back), sp = p(u, .45, .85, E.out3);
  g.save(); g.translate(CX, 600); g.scale(e, e); g.fillStyle = '#f6efdd'; g.beginPath(); g.ellipse(0, 0, 190, 245, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(150,110,70,.28)'; for (let i = 0; i < 26; i++) { g.beginPath(); g.arc((hash(i) - .5) * 250, (hash(i + 7) - .5) * 350, 4 + hash(i + 3) * 5, 0, 7); g.fill(); }
